function zonedDate(dateStr,timeStr,tz){const [y,mo,d]=dateStr.split("-").map(Number),[h,mi]=timeStr.split(":").map(Number);const want=Date.UTC(y,mo-1,d,h,mi);let t=want;
  for(let i=0;i<3;i++){let p;try{p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date(t)).map(x=>[x.type,x.value]));}catch{return new Date(`${dateStr}T${timeStr}`)}
    const got=Date.UTC(+p.year,+p.month-1,+p.day,(+p.hour)%24,+p.minute);t+=want-got;if(want===got)break;}return new Date(t);}
const tzShort=tz=>{try{return (new Intl.DateTimeFormat("en-US",{timeZone:tz,timeZoneName:"short"}).formatToParts(new Date()).find(p=>p.type==="timeZoneName")||{}).value||tz}catch{return tz}};

const stageForAge=a=>{a=+a||0;return a&&a<7?"Seeds":a&&a<11?"Sprouts":a?"Blooms":"Seeds";};
function suggestStage(age,skills){const base=stageForAge(age);const vals=Object.values(skills||{}).map(Number).filter(Boolean);if(!vals.length)return base;const avg=vals.reduce((a,b)=>a+b,0)/vals.length;const order=["Seeds","Sprouts","Blooms"];let i=order.indexOf(base);if(avg<2.2&&i>0)i--;else if(avg>=4.6&&i<2)i++;return order[i];}

   <div class="stat f" style="background:var(--skySoft)"><b class="num">${Object.keys(src).length?esc(Object.entries(src).sort((a,b)=>b[1].e-a[1].e||b[1].n-a[1].n)[0][0]):"–"}</b><span>Best source</span><small>${Object.entries(src).sort((a,b)=>b[1].n-a[1].n).slice(0,3).map(([k,v])=>`${esc(k)} ${v.e}/${v.n}`).join(" · ")}</small></div></div>

  ${shown.length?`<section class="card panel"><div class="tablewrap"><table><thead><tr><th>Parent</th><th>Child</th><th>Source</th><th>Status</th><th>Trial</th><th>Placement</th><th></th></tr></thead><tbody>${shown.map(x=>{const st=leadSt(x.status);
    return `<tr><td><b>${esc(x.parent||"–")}</b><div class="small muted">${esc([x.phone,x.email,x.country].filter(Boolean).join(" · "))}</div></td><td>${esc(x.child||"–")}${x.age?`<div class="small muted">Age ${esc(x.age)}</div>`:""}</td><td class="small">${esc(x.source||"")}${x.refBy?`<div class="muted">by ${esc(D.profiles[x.refBy]?.displayName||"a parent")}</div>`:""}</td>

   <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">Type</legend><div class="seg"><label><input type="radio" name="type" value="group" ${b.type!=="1:1"?"checked":""}><span class="present">Group</span></label><label><input type="radio" name="type" value="1:1" ${b.type==="1:1"?"checked":""}><span class="present">One-to-one</span></label></div></fieldset></div>

function batchData(f,form){const days=WD_ORDER.filter(d=>f["d_"+d].checked);if(!days.length)throw userErr("Pick at least one day.");const u=f.url.value.trim();if(u&&!safeUrl(u))throw userErr("The meeting link must start with https://");
  const lids=[...form.querySelectorAll('input[name="lids"]:checked')].map(x=>x.value);if(f.type.value==="1:1"&&lids.length>1)throw userErr("A one-to-one batch has one learner.");
  return {name:f.name.value.trim(),type:f.type.value,courseId:f.cid.value,tid:f.tid.value||null,days,time:f.time.value,tz:f.tz.value,dur:+f.dur.value||40,start:f.start.value,url:safeUrl(u),learners:lids};}
async function genBatchClasses(bid,b,fromDate,weeks){if(!weeks)return 0;const have=new Set(batchSessions(bid).map(s=>new Date(s.startsAt).getTime()));let n=0;const [y,m,d]=fromDate.split("-").map(Number);
  for(let i=0;i<weeks*7;i++){const dt=new Date(Date.UTC(y,m-1,d+i));const key=dt.toISOString().slice(0,10);if(!b.days.includes(dt.getUTCDay())||holidayOn(key))continue;const at=zonedDate(key,b.time,b.tz);if(at.getTime()<Date.now()||have.has(at.getTime()))continue;
    await S.db.collection("sessions").doc().set({courseId:b.courseId,trainerId:b.tid,title:b.name,startsAt:at.toISOString(),durationMin:b.dur,joinUrl:b.url||"",notes:"",batchId:bid,forLids:b.learners.slice(),createdBy:S.uid,createdAt:Date.now()});n++;}return n;}
async function syncBatchLearners(b,oldTid){for(const id of b.learners||[]){const L=learner(id);if(!L)continue;const up={};if(b.courseId&&!(L.courses||[]).includes(b.courseId))up.courses=[...(L.courses||[]),b.courseId];
  if(b.tid&&(!L.trainerId||(oldTid&&L.trainerId===oldTid&&oldTid!==b.tid)))Object.assign(up,assignPatch(L,b.tid));if(Object.keys(up).length)await S.db.doc("learners/"+id).update(up);}}
async function addToBatch(bid,lid){const b=D.batches[bid];if(!b)return;const ls=[...new Set([...(b.learners||[]),lid])];await S.db.doc("batches/"+bid).update({learners:ls});
  for(const s of batchSessions(bid))if(sessEnd(s)>Date.now())await S.db.doc("sessions/"+s.id).update({forLids:ls});const L=learner(lid);if(L){const up={};if(!(L.courses||[]).includes(b.courseId))up.courses=[...(L.courses||[]),b.courseId];if(b.tid&&!L.trainerId)Object.assign(up,assignPatch(L,b.tid));if(Object.keys(up).length)await S.db.doc("learners/"+lid).update(up);}}
async function removeFromBatch(bid,lid){const b=D.batches[bid];if(!b)return;const ls=(b.learners||[]).filter(x=>x!==lid);await S.db.doc("batches/"+bid).update({learners:ls});for(const s of batchSessions(bid))if(sessEnd(s)>Date.now())await S.db.doc("sessions/"+s.id).update({forLids:ls});}

  actions:{del:()=>{closeModal();openModal("Delete "+b0.name+"?",`<p>Its future classes are cancelled. Past classes and attendance stay.</p>`,{danger:true,submitLabel:"Delete batch",done:"Batch deleted",onSubmit:async()=>{for(const s of batchSessions(id))if(new Date(s.startsAt).getTime()>Date.now())await S.db.doc("sessions/"+s.id).delete();await S.db.doc("batches/"+id).delete();await audit("Batch deleted",b0.name);}});}},
  onSubmit:async(f,form)=>{const b=batchData(f,form);const oldTid=D.batches[id]?.tid||null;await S.db.doc("batches/"+id).update(b);await syncBatchLearners(b,oldTid);const fut=batchSessions(id).filter(s=>new Date(s.startsAt).getTime()>Date.now());
    if(f.rebuild.checked){for(const s of fut)await S.db.doc("sessions/"+s.id).delete();const n=await genBatchClasses(id,{...b,id},ymd(new Date()),Math.max(1,Math.ceil(fut.length/Math.max(1,b.days.length))));toast(`Rebuilt ${n} future class${n===1?"":"es"}`);}
    else{for(const s of fut)await S.db.doc("sessions/"+s.id).update({trainerId:b.tid,forLids:b.learners,joinUrl:b.url||s.joinUrl||"",durationMin:b.dur,title:b.name,courseId:b.courseId});const n=await genBatchClasses(id,{...b,id},b.start,+f.weeks.value||0);toast(n?`Saved and added ${n} class${n===1?"":"es"}`:"Batch saved");}}});};
A.genBatch=id=>{const b=byId(D.batches,id);if(!b)return;const last=batchSessions(id).slice(-1)[0];const from=last?ymd(new Date(new Date(last.startsAt).getTime()+864e5)):ymd(new Date());

A.batchTrainer=(id,v)=>save(async()=>{const oldTid=D.batches[id]?.tid||null;await S.db.doc("batches/"+id).update({tid:v||null});await syncBatchLearners({...D.batches[id],tid:v||null},oldTid);for(const s of batchSessions(id))if(new Date(s.startsAt).getTime()>Date.now())await S.db.doc("sessions/"+s.id).update({trainerId:v||null});await audit("Batch trainer changed",`${D.batches[id]?.name}: ${trainerName(v)}`);},`Future classes moved to ${v?trainerName(v):"no trainer"}`);

/* ---------- Trainers: profiles, quality, pay ---------- */
const ONBOARD=[["docs","ID and documents"],["bg","Background check"],["train","Training done"],["demo","Demo class passed"],["contract","Contract signed"]];
const onboardDone=t=>ONBOARD.filter(([k])=>((D.priv[t.id]||{}).onboard||{})[k]).length;
function workload(t){const wk=Date.now()+7*864e5,now=Date.now();const ss=entries(D.sessions).filter(s=>(s.trainerId===t.id||(!s.trainerId&&D.courses[s.courseId]?.teacherId===t.id)));
  return {learners:activeLearners().filter(l=>l.trainerId===t.id).length,week:ss.filter(s=>{const x=new Date(s.startsAt).getTime();return x>=now&&x<wk}).length,mins:ss.filter(s=>{const x=new Date(s.startsAt).getTime();return x>=now&&x<wk}).reduce((a,s)=>a+(s.durationMin||45),0),batches:batchList().filter(b=>b.tid===t.id).length};}

function couponValid(code){const c=(AS().coupons||[]).find(x=>x.code===String(code||"").trim().toUpperCase());if(!c)return null;if(c.until&&c.until<ymd(new Date()))return null;return c;}
function pricePlan(planId,coupon,lid){const p=(AS().plans||[]).find(x=>x.id===planId);if(!p)throw userErr("Pick a plan.");const base=+p.price||0;let off=0,code="";
  if(String(coupon||"").trim()){const c=couponValid(coupon);if(!c)throw userErr("That coupon code isn't valid or has expired.");code=c.code;off=c.kind==="flat"?+c.value:Math.round(base*(+c.value)/100);}
  const L=learner(lid);const sibs=L?siblingsOf(L).filter(s=>D.fees[s.id]&&+D.fees[s.id].monthly>0&&(s.createdAt||0)<=(L.createdAt||Date.now())):[];const sp=+AS().siblingPct||0;const sib=sibs.length&&sp?Math.round((base-off)*sp/100):0;
  return {planId:p.id,plan:p.name,classes:+p.classes||0,base,coupon:code,couponOff:off,siblingOff:sib,monthly:Math.max(0,base-off-sib)};}
function remindersToday(){const R=AS().reminders||{before:3,onDue:true,after:[3,7]};const today=new Date(new Date().toDateString());const out=[];
  for(const L of activeLearners()){const fi=feeInfo(L.id,thisMonth());if(!fi||!fi.remainingM)continue;const due=new Date(`${thisMonth()}-${pad(fi.dueDay)}T00:00`);const days=Math.round((due-today)/864e5);
    const hit=(R.before&&days===+R.before)||(R.onDue&&days===0)||(days<0&&(R.after||[]).map(Number).includes(-days));if(!hit)continue;if(((D.fees[L.id]||{}).reminded||{})[ymd(new Date())])continue;out.push({L,fi,due,days});}return out;}

  return `<div class="head"><div><h1>Events and workshops</h1><p class="lede">Story days, phonics workshops, parent talks. Families register from their Help page.</p></div><button class="btn btn-primary" data-act="newEvent">${ic("plus")}New event</button></div>
  <section class="card panel"><h2>Coming up</h2>${up.length?`<div class="list">${up.map(row).join("")}</div>`:`<p class="muted">No events planned.</p>`}</section>${past.length?`<section class="card panel"><h2>Past</h2><div class="list">${past.slice(-10).reverse().map(row).join("")}</div></section>`:""}`;}
function eventForm(e={}){const d=e.start?new Date(e.start):(()=>{const t=new Date(Date.now()+7*864e5);t.setHours(11,0,0,0);return t})();
  return `<div class="field"><label for="ev-t">Title</label><input type="text" id="ev-t" name="title" required maxlength="100" data-label="Title" value="${esc(e.title||"")}" placeholder="e.g. Diwali story workshop"></div><div class="field"><label for="ev-d">Description</label><textarea id="ev-d" name="desc" rows="2" maxlength="800">${esc(e.desc||"")}</textarea></div>
  <div class="three"><div class="field"><label for="ev-s">Starts</label><input type="datetime-local" id="ev-s" name="start" required value="${esc(toLocalInput(d))}"></div><div class="field"><label for="ev-m">Minutes</label><input type="number" id="ev-m" name="dur" min="10" max="480" value="${esc(e.dur||60)}"></div><div class="field"><label for="ev-c">Places (0 = no limit)</label><input type="number" id="ev-c" name="cap" min="0" value="${esc(e.cap||0)}"></div></div>
  <div class="three"><div class="field"><label for="ev-l">For</label><select id="ev-l" name="stage">${opt("","All levels",!e.stage)}${STAGES.map(s=>opt(s.v,s.v,s.v===e.stage)).join("")}</select></div><div class="field"><label for="ev-f">Fee (optional)</label><input type="text" id="ev-f" name="fee" maxlength="40" value="${esc(e.fee||"")}" placeholder="e.g. ₹299"></div><div class="field"><label for="ev-u">Link</label><input type="url" id="ev-u" name="url" value="${esc(e.url||"")}" placeholder="https://…"></div></div>`;}
const eventData=f=>{const u=f.url.value.trim();if(u&&!safeUrl(u))throw userErr("The link must start with https://");const d=new Date(f.start.value);if(isNaN(d))throw userErr("Pick a start time.");return {title:f.title.value.trim(),desc:f.desc.value.trim(),start:d.toISOString(),dur:+f.dur.value||60,cap:+f.cap.value||0,stage:f.stage.value,fee:f.fee.value.trim(),url:safeUrl(u)};};
A.newEvent=()=>openModal("New event",eventForm(),{wide:true,submitLabel:"Create event",done:"Event created",onSubmit:async f=>{await S.db.collection("events").doc().set({...eventData(f),at:Date.now()});}});
A.editEvent=id=>{const e=byId(D.events,id);if(!e)return;openModal("Edit event",eventForm(e),{wide:true,done:"Saved",footerExtra:`<button type="button" class="btn btn-ghost" data-mact="del">${ic("trash")}Delete</button>`,actions:{del:async()=>{if(await save(()=>S.db.doc("events/"+id).delete(),"Event deleted"))closeModal();}},onSubmit:async f=>{await S.db.doc("events/"+id).update(eventData(f));}});};
function parentEventsHTML(){const ks=kidsList();const st=new Set(ks.map(k=>k.stage));const mine=((D.evr||{})[S.uid]||{}).regs||{};
  const evs=eventList().filter(e=>new Date(e.start).getTime()+(e.dur||60)*6e4>Date.now()&&(!e.stage||st.has(e.stage)));if(!evs.length)return "";
  return `<section class="card panel"><h2>Events and workshops</h2><div class="list">${evs.map(e=>{const rg=eventRegs(e.id),me=mine[e.id],full=e.cap&&rg.length>=e.cap&&!me;
    return `<div class="item" style="align-items:flex-start"><div class="when"><span>${esc(WD.format(new Date(e.start)))}</span><b class="num">${esc(DNUM.format(new Date(e.start)))}</b></div><div class="grow"><div class="t">${esc(e.title)}</div><div class="s">${esc(fmtTime(new Date(e.start)))} · ${e.dur||60} min${e.fee?` · ${esc(e.fee)}`:" · Free"}${e.cap?` · ${Math.max(0,e.cap-rg.length)} places left`:""}</div>${e.desc?`<div class="small">${esc(e.desc)}</div>`:""}</div>
      ${me?`<span class="pill p-good">Registered</span>${safeUrl(e.url)?`<a class="btn btn-ghost btn-sm" href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener">${ic("video")}Join</a>`:""}<button class="btn btn-ghost btn-sm" data-act="evUnreg" data-id="${esc(e.id)}">Cancel</button>`:full?`<span class="pill p-mute">Full</span>`:`<button class="btn btn-primary btn-sm" data-act="evReg" data-id="${esc(e.id)}">Register</button>`}</div>`}).join("")}</div></section>`;}
A.evReg=id=>{const e=D.events[id];if(!e)return;openModal("Register for "+e.title,kidSelect(),{submitLabel:"Register",done:"Registered!",onSubmit:async f=>{const cur=((D.evr||{})[S.uid]||{}).regs||{};await S.db.doc("evr/"+S.uid).set({regs:{...cur,[id]:{lid:f.kid.value,at:Date.now()}}});}});};
A.evUnreg=id=>save(async()=>{const cur={...(((D.evr||{})[S.uid]||{}).regs||{})};delete cur[id];await S.db.doc("evr/"+S.uid).set({regs:cur});},"Registration cancelled");

/* ---------- Analytics ---------- */
function activeAt(L,t){return (L.createdAt||0)<=t&&(L.active!==false||(L.leftAt&&L.leftAt>t));}
function monthEnd(m){const d=mDate(m);d.setMonth(d.getMonth()+1);return d.getTime()-1;}
const paidIn=(lid,m)=>Object.values((D.fees[lid]||{}).payments||{}).some(p=>p&&p.month===m&&+p.amount>0);
function barList(rows,fmt){const max=Math.max(1,...rows.map(r=>r[1]));return `<div class="hbars">${rows.map(([l,v,sub])=>`<div class="hbar"><span>${esc(l)}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b class="num">${fmt?fmt(v):v}</b>${sub?`<small>${esc(sub)}</small>`:""}</div>`).join("")}</div>`;}
function colChart(rows,fmt){const max=Math.max(1,...rows.map(r=>r[1]));return `<div class="cols6">${rows.map(([l,v])=>`<div class="col"><b class="num">${fmt?fmt(v):v}</b><div class="cbar"><i style="height:${Math.max(2,v/max*100)}%"></i></div><span>${esc(l)}</span></div>`).join("")}</div>`;}
function analyticsView(){const tab=S.atab||"business";const tabs=`<div class="seg" role="tablist" aria-label="Analytics">${[["business","Business"],["learning","Learning"],["engagement","Engagement"]].map(([k,l])=>`<button class="tog ${tab===k?"on":""}" role="tab" aria-selected="${tab===k}" data-act="atab" data-id="${k}">${l}</button>`).join("")}</div>`;
  const all=allLearners(),act=activeLearners(),m=thisMonth(),months=[5,4,3,2,1,0].map(i=>shiftMonth(m,-i));let body="";
  if(tab==="business"){const start=mDate(m).getTime();const actStart=all.filter(L=>activeAt(L,start-1)).length;const left=all.filter(L=>L.leftAt&&ym(new Date(L.leftAt))===m).length;const joined=all.filter(L=>L.createdAt&&ym(new Date(L.createdAt))===m).length;
    const prevPaid=act.filter(L=>paidIn(L.id,shiftMonth(m,-1)));const renewed=prevPaid.filter(L=>paidIn(L.id,m)).length;
    const byPlan={},byLang={};for(const L of all){const f=D.fees[L.id];if(!f)continue;let r=0;for(const p of Object.values(f.payments||{}))if(p&&p.date&&p.date.startsWith(m))r+=+p.amount||0;for(const x of Object.values(f.refunds||{}))if(x&&x.date&&x.date.startsWith(m))r-=+x.amount||0;if(!r)continue;const pk=f.plan||"No plan";byPlan[pk]=(byPlan[pk]||0)+r;const c=D.courses[learnerCourses(L)[0]];const lk=c?(c.lang||langCode(c)):"–";byLang[lk]=(byLang[lk]||0)+r;}
    body=`<div class="stats"><div class="stat f" style="background:var(--leafSoft)"><b class="num">${act.length}</b><span>Active learners</span><small>${joined} joined · ${left} left in ${esc(monthShort(m))}</small></div><div class="stat f" style="background:var(--peach)"><b class="num">${actStart?pctStr(left/actStart):"–"}</b><span>Churn · ${esc(monthShort(m))}</span><small>Retention ${actStart?pctStr(1-left/actStart):"–"}</small></div>
      <div class="stat f" style="background:var(--sunSoft)"><b class="num">${prevPaid.length?pctStr(renewed/prevPaid.length):"–"}</b><span>Renewal rate</span><small>${renewed} of ${prevPaid.length} who paid last month</small></div><div class="stat f" style="background:var(--petalSoft)"><b class="num">${money(revenueIn(m))}</b><span>Revenue · ${esc(monthShort(m))}</span><small>Net of refunds</small></div></div>
     <div class="cols even"><section class="card panel"><h2>Revenue, last 6 months</h2>${colChart(months.map(x=>[monthShort(x),revenueIn(x)]),v=>v>=1000?"₹"+Math.round(v/1000)+"k":money(v))}</section><section class="card panel"><h2>Active learners, last 6 months</h2>${colChart(months.map(x=>[monthShort(x),all.filter(L=>activeAt(L,Math.min(Date.now(),monthEnd(x)))).length]))}</section></div>
     <div class="cols even"><section class="card panel"><h2>Revenue by plan · ${esc(monthShort(m))}</h2>${Object.keys(byPlan).length?barList(Object.entries(byPlan).sort((a,b)=>b[1]-a[1]),money):`<p class="muted">No payments this month yet.</p>`}</section><section class="card panel"><h2>Revenue by language · ${esc(monthShort(m))}</h2>${Object.keys(byLang).length?barList(Object.entries(byLang).sort((a,b)=>b[1]-a[1]),money):`<p class="muted">No payments this month yet.</p>`}</section></div>`;}
  else if(tab==="learning"){const st={};for(const L of act)st[L.stage||"Seeds"]=(st[L.stage||"Seeds"]||0)+1;const comp=act.filter(L=>L.uid).map(overallPct);const words=act.map(L=>wordsOf(L.uid).length);
    let asg=0,ans=0;for(const L of act)for(const h of hwFor(L)){asg++;if(answerOf(L,h))ans++;}const sp=[];for(const L of act)if(L.uid)for(const x of kpItems(L.uid))if(x.kind==="audio"){const c=pcFor(x.id);if(c&&c.score)sp.push(+c.score);}
    const sk={};for(const L of act){const a=assessFor(L)[0];if(a&&a.skills)for(const [k,v] of Object.entries(a.skills)){(sk[k]=sk[k]||[]).push(+v);}}
    body=`<div class="stats"><div class="stat f" style="background:var(--sunSoft)"><b class="num">${comp.length?pctStr(comp.reduce((a,b)=>a+b,0)/comp.length):"–"}</b><span>Average course completion</span></div><div class="stat f" style="background:var(--leafSoft)"><b class="num">${words.reduce((a,b)=>a+b,0)}</b><span>Words learned</span><small>${act.length?Math.round(words.reduce((a,b)=>a+b,0)/act.length):0} per learner</small></div>
      <div class="stat f" style="background:var(--skySoft)"><b class="num">${asg?pctStr(ans/asg):"–"}</b><span>Homework completion</span><small>${ans} of ${asg} handed in</small></div><div class="stat f" style="background:var(--petalSoft)"><b class="num">${sp.length?(sp.reduce((a,b)=>a+b,0)/sp.length).toFixed(1)+"/5":"–"}</b><span>Speaking score</span><small>${sp.length} recording${sp.length===1?"":"s"} scored</small></div></div>
     <div class="cols even"><section class="card panel"><h2>Learners by level</h2>${barList(STAGES.map(s=>[s.v,st[s.v]||0,s.ages]))}</section><section class="card panel"><h2>Average skills (latest assessment)</h2>${Object.keys(sk).length?barList(SKILLS.map(([k,l])=>[l,sk[k]?sk[k].reduce((a,b)=>a+b,0)/sk[k].length:0]),v=>v.toFixed(1)+"/5"):`<p class="muted">No skill assessments yet.</p>`}</section></div>
     <section class="card panel"><h2>Course completion</h2>${courseList().length?barList(courseList().map(c=>{const ls=learnersInCourse(c.id).filter(L=>L.uid);return [c.title,ls.length?ls.reduce((a,L)=>a+coursePct(L.uid,c.id),0)/ls.length*100:0,`${ls.length} learners`];}),v=>Math.round(v)+"%"):`<p class="muted">No courses yet.</p>`}</section>`;}
  else{const wk=Date.now()-7*864e5,ps=parentAccounts().filter(p=>childrenOf(p.uid).length),actP=ps.filter(p=>(p.lastSeen||0)>=wk).length,wkK=weekKey(new Date()),dig=ps.filter(p=>(p.digest||{})[wkK]).length;
    const actK=act.filter(L=>L.uid&&[...activityDays(L.uid)].some(d=>new Date(d).getTime()>=wk-864e5)).length;const bk={"0 days":0,"1–2 days":0,"3–6 days":0,"7+ days":0};for(const L of act){if(!L.uid)continue;const s=streak(L.uid);bk[s===0?"0 days":s<3?"1–2 days":s<7?"3–6 days":"7+ days"]++;}
    const weeks=[3,2,1,0].map(i=>{const d=new Date();d.setDate(d.getDate()-7*i);return weekKey(d);});
    body=`<div class="stats"><div class="stat f" style="background:var(--leafSoft)"><b class="num">${actP}/${ps.length}</b><span>Parents active · 7 days</span></div><div class="stat f" style="background:var(--sunSoft)"><b class="num">${dig}/${ps.length}</b><span>Weekly digest opened</span><small>This week</small></div>
      <div class="stat f" style="background:var(--skySoft)"><b class="num">${actK}/${act.filter(L=>L.uid).length}</b><span>Learners active · 7 days</span></div><div class="stat f" style="background:var(--petalSoft)"><b class="num">${act.filter(L=>L.uid&&streak(L.uid)>=3).length}</b><span>On a 3+ day streak</span></div></div>
     <div class="cols even"><section class="card panel"><h2>Student streaks</h2>${barList(Object.entries(bk))}</section><section class="card panel"><h2>Digest opens by week</h2>${colChart(weeks.map(w=>[fmtDay(new Date(w+"T12:00")),ps.filter(p=>(p.digest||{})[w]).length]))}</section></div>`;}
  return `<div class="head"><div><h1>Analytics</h1><p class="lede">How the academy is doing: money, learning and engagement.</p></div></div>${tabs}${body}`;}
A.atab=v=>{S.atab=v;render(true);};

/* ---------- Settings ---------- */
const DEF_REWARDS={lesson:3,attend:1,badges:{garden5:5,garden20:20,words10:10,words50:50,streak3:3,streak7:7,hw5:5,class8:8}};
const RW=()=>{const r=CFG().rewards||{};return {...DEF_REWARDS,...r,badges:{...DEF_REWARDS.badges,...(r.badges||{})}};};
const CONSENT_V=1;
function adminSettings(){const tab=S.stab||"academy";const tabs=`<div class="seg wrap" role="tablist" aria-label="Settings">${[["academy","Academy"],["billing","Billing"],["rules","Rules"],["templates","Messages"],["privacy","Privacy"],["data","Import / export"]].map(([k,l])=>`<button class="tog ${tab===k?"on":""}" role="tab" aria-selected="${tab===k}" data-act="stab" data-id="${k}">${l}</button>`).join("")}</div>`;
  const c=CFG(),a=c.academy||{},s=AS();let body="";
  if(tab==="academy")body=`<form class="card panel" id="set-academy" novalidate><h2>Academy and branding</h2>
    <div class="two"><div class="field"><label for="sa-n">Academy name</label><input type="text" id="sa-n" name="name" maxlength="80" value="${esc(a.name||"Little Lingos")}"></div><div class="field"><label for="sa-tg">Tagline</label><input type="text" id="sa-tg" name="tagline" maxlength="80" value="${esc(a.tagline||"Plant a word. Watch it grow.")}"></div></div>
    <div class="three"><div class="field"><label for="sa-p">Phone</label><input type="tel" id="sa-p" name="phone" maxlength="20" value="${esc(a.phone||"")}"></div><div class="field"><label for="sa-e">Email</label><input type="email" id="sa-e" name="email" maxlength="120" value="${esc(a.email||"")}"></div><div class="field"><label for="sa-g">GSTIN</label><input type="text" id="sa-g" name="gstin" maxlength="20" value="${esc(a.gstin||"")}"></div></div>
    <div class="field"><label for="sa-a">Address (on invoices)</label><textarea id="sa-a" name="address" rows="2" maxlength="300">${esc(a.address||"")}</textarea></div>
    <div class="field"><label for="sa-u">Classroom link</label><input type="url" id="sa-u" name="url" value="${esc(c.classroomUrl||"")}" placeholder="https://classroom.your-site.com"><span class="hint">Used in invite messages to parents.</span></div>
    <div class="two"><div class="field"><label for="sa-l">Languages offered</label><input type="text" id="sa-l" name="langs" maxlength="200" value="${esc(OFFERED().join(", "))}" placeholder="English, Hindi, Spanish"></div><div class="field"><label for="sa-z">Main time zone</label><select id="sa-z" name="tz">${TZ_OPTS().map(([v,l])=>opt(v,l,v===DEF_TZ())).join("")}</select></div></div>
    <div class="field"><label for="sa-d">Class lengths (minutes)</label><input type="text" id="sa-d" name="durs" maxlength="60" value="${esc(DURATIONS().join(", "))}"><span class="hint">Shown when you set up batches.</span></div>
    <button class="btn btn-primary" type="submit" style="align-self:flex-start">Save</button></form>
   <section class="card panel"><div class="ph"><h2>Holidays</h2><button class="btn btn-ghost btn-sm" data-act="addHoliday">${ic("plus")}Add holiday</button></div>${HOLIDAYS().length?`<div class="list">${HOLIDAYS().slice().sort((x,y)=>x.date.localeCompare(y.date)).map(h=>`<div class="item"><div class="grow"><div class="t">${esc(h.name)}</div><div class="s">${esc(fmtDay(new Date(h.date+"T12:00")))}</div></div><button class="iconbtn" data-act="delHoliday" data-id="${esc(h.date)}" aria-label="Remove">${ic("trash")}</button></div>`).join("")}</div>`:`<p class="muted">Batches skip these dates, and parents see them on their calendar.</p>`}</section>`;
  else if(tab==="billing"){const R=s.reminders||{before:3,onDue:true,after:[3,7]};body=`<section class="card panel"><div class="ph"><h2>Plans</h2><button class="btn btn-ghost btn-sm" data-act="editPlan">${ic("plus")}Add plan</button></div>${(s.plans||[]).length?`<div class="list">${s.plans.map(p=>`<div class="item"><div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${p.type==="1:1"?"One-to-one":"Group"} · ${p.classes||"–"} classes a month · ${esc(p.lang||"Any language")}</div></div><b class="num">${money(p.price)}</b><button class="iconbtn" data-act="editPlan" data-id="${esc(p.id)}" aria-label="Edit">${ic("edit")}</button></div>`).join("")}</div>`:`<p class="muted">Add your plans, for example "Group · 8 classes · ₹2,199". Pick a plan when you set a learner's fee.</p>`}</section>
   <section class="card panel"><div class="ph"><h2>Coupons</h2><button class="btn btn-ghost btn-sm" data-act="editCoupon">${ic("plus")}Add coupon</button></div>${(s.coupons||[]).length?`<div class="list">${s.coupons.map((c2,i)=>`<div class="item"><div class="grow"><div class="t num">${esc(c2.code)}</div><div class="s">${c2.kind==="flat"?money(c2.value):c2.value+"%"} off${c2.until?` · until ${esc(fmtDay(new Date(c2.until+"T12:00")))}`:""}${c2.note?` · ${esc(c2.note)}`:""}</div></div>${c2.until&&c2.until<ymd(new Date())?`<span class="pill p-mute">Expired</span>`:`<span class="pill p-good">Active</span>`}<button class="iconbtn" data-act="delCoupon" data-id="${i}" aria-label="Delete">${ic("trash")}</button></div>`).join("")}</div>`:`<p class="muted">No coupons yet.</p>`}</section>
   <form class="card panel" id="set-billing" novalidate><h2>Discounts, tax and reminders</h2>
    <div class="three"><div class="field"><label for="sb-s">Sibling discount (%)</label><input type="number" id="sb-s" name="sib" min="0" max="100" value="${esc(s.siblingPct||0)}"><span class="hint">For the second child onwards.</span></div><div class="field"><label for="sb-g">GST rate (%)</label><input type="number" id="sb-g" name="gst" min="0" max="28" step=".5" value="${esc(a.gstRate||0)}"><span class="hint">Prices include GST. 0 = not shown.</span></div><div class="field"><label for="sb-r">Referral credit (₹)</label><input type="number" id="sb-r" name="ref" min="0" step="50" value="${esc(s.referralCredit||0)}"><span class="hint">Given to a parent when someone they refer enrols.</span></div></div>
    <p class="section-title">Fee reminders</p><div class="three"><div class="field"><label for="sb-b">Days before due</label><input type="number" id="sb-b" name="before" min="0" max="15" value="${esc(R.before??3)}"></div><label class="row" style="font-weight:700"><input type="checkbox" name="ondue" ${R.onDue!==false?"checked":""} style="width:20px;height:20px;accent-color:var(--leafMid)"> On the due date</label><div class="field"><label for="sb-a">Days after due</label><input type="text" id="sb-a" name="after" maxlength="30" value="${esc((R.after||[3,7]).join(", "))}"></div></div>
    <p class="small muted">Reminders show on your Today and Fees pages on these days, with a WhatsApp button. Nothing is sent automatically.</p><button class="btn btn-primary" type="submit" style="align-self:flex-start">Save</button></form>`;}
  else if(tab==="rules"){const r=RW(),ct=c.cert||{},rt=c.reportTpl||{},sla=s.sla||{};body=`<form class="card panel" id="set-rules" novalidate><h2>Stars and badges</h2>

A.exp=k=>{const d=ymd(new Date());
  if(k==="learners")return saveFile(`learners-${d}.csv`,toCSV([["Name","Level","Courses","Trainer","Active","Guardian","Phone","Email","Monthly fee","Plan","Joined"],...allLearners().map(L=>{const p=D.priv[L.id]||{},f=D.fees[L.id]||{};return [L.name,L.stage,learnerCourses(L).map(c=>D.courses[c].title).join("; "),trainerName(L.trainerId),L.active!==false?"Yes":"No",p.guardian,p.phone,p.email,f.monthly||"",f.plan||"",L.createdAt?ymd(new Date(L.createdAt)):""]})]));
  if(k==="classes")return saveFile(`classes-${d}.csv`,toCSV([["Date","Time","Minutes","Title","Course","Trainer","Batch","Topic","Link","Marked"],...entries(D.sessions).sort((a,b)=>String(a.startsAt).localeCompare(String(b.startsAt))).map(s=>[ymd(new Date(s.startsAt)),fmtTime(new Date(s.startsAt)),s.durationMin||45,s.title,D.courses[s.courseId]?.title||"",trainerName(s.trainerId),D.batches[s.batchId]?.name||"",s.topic||"",s.joinUrl||"",allMarks()[s.id]?"Yes":"No"])]));
  if(k==="payments"){const rows=[];for(const L of allLearners()){const f=D.fees[L.id];if(!f)continue;for(const p of Object.values(f.payments||{}))if(p)rows.push([p.date,L.name,"Payment",p.amount,p.month,p.method,p.note||""]);for(const r of Object.values(f.refunds||{}))if(r)rows.push([r.date,L.name,"Refund",-r.amount,r.month,r.method,r.reason||""]);}rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));return saveFile(`payments-${d}.csv`,toCSV([["Date","Learner","Type","Amount","For month","Method","Note"],...rows]));}
  if(k==="attendance"){const rows=[];for(const v of Object.values(allMarks()))for(const [lid,st] of Object.entries(v.m||{}))rows.push([ymd(new Date(v.date)),v.title||"",D.courses[v.courseId]?.title||"",learnerName(lid),ATT[st]||st,(v.notes||{})[lid]||""]);rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));return saveFile(`attendance-${d}.csv`,toCSV([["Date","Class","Course","Learner","Status","Note"],...rows]));}};

async function readFile(id){const el=document.getElementById(id);const f=el&&el.files&&el.files[0];if(!f){toast("Choose a CSV file first.",true);return null}if(f.size>2e6){toast("That file is too big.",true);return null}return await f.text();}
const findCourse=n=>courseList().find(c=>c.title.toLowerCase()===String(n||"").trim().toLowerCase());
const findTrainer=n=>activeTrainers().find(t=>t.name.toLowerCase()===String(n||"").trim().toLowerCase());

  await save(async()=>{for(const r of rows){const [name,stage,course,tr,guardian,phone,email,fee]=r.map(x=>(x||"").trim());if(!name){skip++;continue}const c=findCourse(course),T=findTrainer(tr);const ref=S.db.collection("learners").doc();
    await ref.set({name,stage:STAGES.some(s=>s.v===stage)?stage:"Seeds",courses:c?[c.id]:[],trainerId:T?T.id:null,assignedAt:T?Date.now():null,uid:null,parents:[],active:true,code:genCode(),createdAt:Date.now()});await S.db.doc("private/"+ref.id).set({guardian,phone,email,notes:""});if(+fee>0)await S.db.doc("fees/"+ref.id).set({monthly:+fee,start:thisMonth(),dueDay:10});n++;}
    await audit("Imported learners",`${n} added`);});toast(`${n} learner${n===1?"":"s"} imported${skip?`, ${skip} skipped`:""}`);};

A.exportFamily=()=>{const lid=document.getElementById("pv-l")?.value;const L=learner(lid);if(!L)return;const ps=parentsOf(L);

  openModal("Delete "+L.name+"'s data?",`<p>This permanently deletes ${esc(L.name)}'s record, contact details, fees and payments, garden progress and answers${ps.length?`, and the parent account${ps.length>1?"s":""} (${ps.map(u=>esc(D.profiles[u]?.displayName||"parent")).join(", ")}) with their messages and requests`:""}.</p><p class="small muted">Attendance rows inside class records are anonymised by removing ${esc(firstOf(L.name))}. This can't be undone.</p><div class="field"><label for="df-c">Type DELETE to confirm</label><input type="text" id="df-c" name="c" required autocomplete="off"></div>`,
  {danger:true,submitLabel:"Delete everything",done:"Deleted",onSubmit:async f=>{if(f.c.value.trim()!=="DELETE")throw userErr("Type DELETE to confirm.");
    for(const [uid,docs] of Object.entries(D.marks))for(const [sid,v] of Object.entries(docs||{}))if(v&&v.m&&v.m[lid]){const m={...v.m};delete m[lid];const notes={...(v.notes||{})};delete notes[lid];await S.db.doc(`tw/${uid}/x/m-${sid}`).update({m,notes}).catch(()=>{});}
    if(L.uid){await S.db.doc("progress/"+L.uid).delete().catch(()=>{});await S.db.doc("answers/"+L.uid).delete().catch(()=>{});await S.db.doc("profiles/"+L.uid).delete().catch(()=>{});}
    for(const u of ps){const snap=await S.db.collection(`pp/${u}/x`).get();for(const d of snap.docs)await S.db.doc(`pp/${u}/x/${d.id}`).delete();for(const p of ["ppi/","pf/","ptmb/","evr/","profiles/"])await S.db.doc(p+u).delete().catch(()=>{});}
    for(const p of ["fees/","private/","learners/"])await S.db.doc(p+lid).delete().catch(()=>{});
    for(const b of batchOfL(lid))await removeFromBatch(b.id,lid);
    await audit("Family data deleted",`${L.name}${ps.length?" + parent account":""}`);}});};

async function saveParent(f,form,old){

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw userErr("Check the email address.");
  const want=new Set([...form.querySelectorAll('input[name="kids"]:checked')].map(x=>x.value));
  if(!want.size)throw userErr("Tick at least one child.");
  const acct=S.acct[email];
  for(const L of activeLearners()){const pv=D.priv[L.id]||{};const in1=lowerEmail(pv.email)===email, in2=lowerEmail(pv.email2)===email;
    if(want.has(L.id)){
      if(in1)await upsert("private/"+L.id,{guardian:name,phone:phone||pv.phone||""});
      else if(in2)await upsert("private/"+L.id,{guardian2:name,phone2:phone||pv.phone2||""});
      else if(!pv.email)await upsert("private/"+L.id,{guardian:name,email,phone:phone||pv.phone||""});
      else if(!pv.email2)await upsert("private/"+L.id,{guardian2:name,email2:email,phone2:phone});
      else throw userErr(`${L.name} already has two parent emails. Edit ${firstOf(L.name)} to change one.`);
    }else if(in1||in2){
      await upsert("private/"+L.id,in1?(pv.email2?{email:pv.email2,guardian:pv.guardian2||"",phone:pv.phone2||"",email2:"",guardian2:"",phone2:""}:{email:""}):{email2:"",guardian2:"",phone2:""});

  S.acctKey="";
}

  const rr=realRole(), pk=new Set(), sk=new Set();
  if(rr==="parent"){pk.add("pp");pk.add("pf");} if(rr==="student")pk.add("kp"); if(rr==="teacher")pk.add("pay"); if(rr==="admin"||rr==="teacher")sk.add("ppi");
  syncSet(live.par,pk,k=>k==="pay"?S.db.doc(`contacts/${S.uid}/p/pay`).onSnapshot(d=>{D.pay=(d.exists&&d.data())||{};schedule();},()=>{}):k==="kp"?S.db.collection(`kp/${S.uid}/x`).onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.kp[S.uid]=o;schedule();},()=>{}):k==="pp"?S.db.collection(`pp/${S.uid}/x`).onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.pp[S.uid]=o;schedule();},()=>{}):S.db.doc("pf/"+S.uid).onSnapshot(d=>{D.pf=(d.exists&&d.data())||{};schedule();},()=>{}),k=>{if(k==="pf")D.pf={};else delete D.pp[S.uid];});
  syncSet(live.stf,sk,()=>S.db.collection("ppi").onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.ppi=o;refreshThreads();schedule();},()=>{}),()=>{D.ppi={};});
  syncSet(live.ts,keys,k=>S.db.collection(`timesheets/${k}/e`).onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.ts[k]=o;schedule();},()=>{}),k=>{delete D.ts[k];});
}
async function boot(){
  S.month=thisMonth();
  render(true);
  if(!window.claude||!window.claude.use){S.status="nodb";render(true);return}
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  if(!db||!user){S.status="nodb";render(true);return}
  S.db=db;S.user=user;
  const me=await user.me();
  S.uid=me.id;S.isOwner=me.isOwner;if(me.name&&S.uid)S.names[S.uid]=me.name;
  if(!S.uid){S.status="noid";render(true);return}
  const cols={profiles:"profiles",courses:"courses",lessons:"lessons",sessions:"sessions",progress:"progress",learners:"learners",trainers:"trainers",notices:"notices",answers:"answers",ptm:"ptm",ptmb:"ptmb",library:"library",batches:"batches",events:"events",evr:"evr"};
  if(S.isOwner){cols.fees="fees";cols.priv="private";}
  const need=new Set([...Object.keys(cols),"config"]);
  const markLoaded=k=>{S.loaded.add(k);if(S.status!=="ready"&&[...need].every(x=>S.loaded.has(x))){S.status="ready";render(true)}else schedule()};
  const onErr=k=>e=>{markLoaded(k);if(e&&e.code!=="revoked")console.warn("Little Lingos: "+k+" stopped updating",e);};
  for(const [k,path] of Object.entries(cols)){
    db.collection(path).onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D[k]=o;if(k==="trainers"||k==="learners"||k==="profiles")syncDynamic();if(k==="priv"||k==="courses")scheduleContactSync();if(["fees","learners","profiles"].includes(k))schedulePF();markLoaded(k)},onErr(k));
  }
  if(S.isOwner){for(const k of ["leads","obs","payouts","credits","audit"])db.collection(`ad/${k}/x`).onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.ad[k]=o;if(k==="credits")schedulePF();schedule();},()=>{});
    db.doc("ad/settings").onSnapshot(d=>{D.adset=(d.exists&&d.data())||{};schedule();},()=>{});}
  db.doc("config/app").onSnapshot(d=>{D.config=(d.exists&&d.data())||{};schedulePF();
    if(S.isOwner&&D.config.ownerUid!==S.uid)db.doc("config/app").set({...D.config,ownerUid:S.uid}).catch(()=>{});
    syncDynamic();markLoaded("config")},onErr("config"));
  setTimeout(()=>{if(S.status!=="ready"){S.status="ready";render(true)}},8000);
  setInterval(()=>{if(S.status==="ready")schedule()},60000);
}
setInterval(()=>{const now=Date.now();document.querySelectorAll("[data-since]").forEach(el=>{el.textContent=fmtDur(+(el.dataset.base||0)+now-new Date(el.dataset.since).getTime());});document.querySelectorAll("[data-now]").forEach(el=>{el.textContent=TIMESEC.format(new Date(now));});},1000);
boot();
})();
</script>
