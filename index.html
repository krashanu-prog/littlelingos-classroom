/* ================= Feature 8: share with family (parent-only private links) ================= */
const SHARE_KINDS=new Set(["audio","photo","draw","note"]);
const shareBase=()=>{const u=(CFG().classroomUrl||"").replace(/\/+$/,"");return (u||location.origin+location.pathname.replace(/[^/]*$/,"").replace(/\/+$/,""))+"/share.html";};
const shareLink=t=>shareBase()+"#t="+t;
const shareRpc=async(fn,args)=>{const r=await window.LL_sb.rpc(fn,args||{});if(r.error)throw userErr(r.error.message||"Something went wrong");return r.data;};
function shareMsg(first,kind,days){const what=kind==="audio"?`Hear ${first} speaking English! 🌱`:kind==="cert"?`${first} earned a certificate in English class! 🌱`:`See ${first}'s work from English class! 🌱`;
  return `${what}\nTap to see it (link works for ${days} days):`;}
const shareBtn=(id,kind)=>role()==="parent"&&(SHARE_KINDS.has(kind)||kind==="cert")?`<button type="button" class="iconbtn" data-act="${kind==="cert"?"shareCert":"shareItem"}" data-id="${esc(id)}" aria-label="Share with family" title="Share with family">${ic("share")}</button>`:"";
function shareModal(L,o){/* o: {kind, ref, title, sub, at} */
  if(realRole()!=="parent"){toast("Only parents can share.",true);return}const f=firstOf(L.name);let days=7;
  const draw=()=>openModal("Share with family",`<p>Make a private link to <b>this one ${o.kind==="audio"?"recording":o.kind==="cert"?"certificate":"piece of work"}</b> for grandparents and family. They don't need to sign in.</p>
    <div class="sharepv"><b>${esc(o.title||"")}</b><span class="small muted">Shows only ${esc(f)}'s first name and this item. No surname, school, location or other work.</span></div>
    <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl">Link works for</legend><div class="seg" role="radiogroup"><label><input type="radio" name="days" value="7" ${days===7?"checked":""} data-mchange="days">7 days</label><label><input type="radio" name="days" value="30" ${days===30?"checked":""} data-mchange="days">30 days</label></div></fieldset>
    <p class="small muted">You can switch the link off any time from “Shared with family”. Family can send a heart or a 30-second voice message, and you can hide any message.</p>`,
   {submitLabel:"Create private link",noFocus:true,actions:{days:v=>{days=+v===30?30:7;}},
    onSubmit:async()=>{const tok=await shareRpc("ll_share_create",{p_lid:L.id,p_kind:o.kind,p_ref:o.ref||null,p_title:o.title||"",p_sub:o.sub||"",p_at:o.at||null,p_days:days});
      setTimeout(()=>shareReady(f,o.kind,days,tok),250);}});
  draw();}
function shareReady(first,kind,days,tok){const link=shareLink(tok),msg=shareMsg(first,kind,days)+"\n"+link;
  openModal("Your private link is ready",`<p class="small muted">Send it to family on WhatsApp, or copy it.</p><textarea id="sh-msg" rows="4" maxlength="400" aria-label="Message">${esc(msg)}</textarea>`,
   {noFocus:true,submitLabel:"Done",footerExtra:`<button type="button" class="btn btn-ghost" data-mact="copy">${ic("copy")}Copy</button><button type="button" class="btn btn-leaf" data-mact="wa">${ic("wa")}Send on WhatsApp</button>`,
    actions:{copy:async()=>{const t=document.getElementById("sh-msg").value;try{await navigator.clipboard.writeText(t);toast("Copied");}catch(e){toast("Copy didn't work. Press and hold the message to copy it.",true);}},
      wa:()=>{const t=document.getElementById("sh-msg").value;window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank","noopener");}}});}
A.shareItem=id=>{const L=curKid();if(!L||!L.uid)return;const x=(D.kp[L.uid]||{})[id];if(!x||!SHARE_KINDS.has(x.kind)){toast("This item can't be shared.",true);return}

A.shareCert=cid=>{const L=curKid();if(!L)return;const ct=(pipTry(()=>certsOf(L))||[]).find(x=>x.cid===cid);if(!ct)return;

/* parent: everything they've shared */

const shareState=s=>!s.active?["Switched off","p-mute"]:new Date(s.expires)<=new Date()?["Ended","p-mute"]:["Live until "+fmtDay(new Date(s.expires)),"p-good"];
function sharesCardHTML(L){if(role()!=="parent")return "";sharesLoad();const xs=(SHARES||[]).filter(s=>!L||s.lid===L.id);const live=xs.filter(s=>s.active&&new Date(s.expires)>new Date()).length;

function sharesView(){if(role()!=="parent")return `<div class="head"><div><h1>Shared with family</h1><p class="lede">Only parents can share items.</p></div></div>`;sharesLoad();const xs=SHARES;

const WOD_TIP={Seeds:w=>`Point to something at home that matches “${w}” and say the word together.`,Sprouts:w=>`At dinner, ask your child to use “${w}” in a sentence about their day.`,Blooms:w=>`Ask your child to use “${w}” when they tell you about school today.`};
let wodSub=0;
function wodLoad(){if(wodSub||!S.db)return;wodSub=1;try{S.db.doc("config/wod").onSnapshot(d=>{D.wod=(d.exists&&d.data())||{};schedule();},()=>{wodSub=0;});}catch(e){wodSub=0;}}
const wodStageOf=L=>WOD_STAGES.includes(L&&L.stage)?L.stage:"Seeds";
function wodItems(stage){wodLoad();const it=(D.wod&&D.wod.items)||{};return Object.entries(it).filter(([,v])=>v&&v.word&&(!stage||v.stage===stage)).map(([id,v])=>({id,...v}));}
const wodDayNo=ds=>Math.floor(Date.UTC(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10))/864e5);
const wodStarterItems=stage=>(WOD_STARTER[stage]||WOD_STARTER.Seeds).map(([emo,word,phon,mean,ex],i)=>({id:"starter-"+i,stage,emo,word,phon,mean,ex}));
/* the day's word; a day with no word rotates an earlier one, never a blank */
function wodFor(stage,ds){ds=ds||ymd(new Date());const all=wodItems(stage);const exact=all.find(x=>x.date===ds);if(exact)return {...exact,ds,rot:false};
  let pool=all.filter(x=>!x.date||x.date<ds).sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))||String(a.word).localeCompare(String(b.word)));let src="list";
  if(!pool.length){pool=wodStarterItems(stage);src="starter";}else if(pool.length<7){pool=pool.concat(wodStarterItems(stage).filter(s=>!pool.some(x=>String(x.word).toLowerCase()===s.word)));src="mixed";}
  const x=pool[((wodDayNo(ds)%pool.length)+pool.length)%pool.length];return {...x,ds,rot:true,src};}
const wodRec=(uid,ds)=>((progOf(uid).wod||{})[ds||ymd(new Date())])||null;
const wodGold=uid=>Object.values(progOf(uid).wod||{}).filter(r=>r&&r.w).length;

    ${!sr&&!r?`<p class="small muted" style="margin:0">Say it out loud with a grown-up, then tap “I learned it!”.</p>`:""}</section>`;}
A.wodHear=()=>{const L=myLearner();if(!L)return;const word=wodFor(wodStageOf(L)).word,day=ymd(new Date());
  if(S.wodIntro===day){wodSay(word,true);return}S.wodIntro=day;pipPlay("seed").then(ok=>{if(ok!=="stop")setTimeout(()=>wodSay(word,true),150);});};
A.wodSayIt=()=>{const L=myLearner();if(!L||!SR)return;if(timeUp()){render();return}const x=wodFor(wodStageOf(L));const ui=S.wodUI=S.wodUI||{};if(ui.listening)return;ui.listening=true;ui.msg="";render(true);
  const fail=m=>{ui.listening=false;ui.tries=(ui.tries||0)+1;ui.msg=m;render(true);};
  try{const r=new SR();r.lang="en-IN";r.maxAlternatives=5;let got=false;
    r.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript);const sc=sayScore(x.word,alts);
      if(sc.stars>=2){ui.listening=false;wodDone(L,x,"said");}else fail(sc.heard?`Nice try! Pip heard “${esc(sc.heard)}”. Tap Hear it, then say it once more.`:"Pip couldn't hear you. Try a little louder, close to the phone.");};
    r.onerror=()=>{if(!got)fail("Pip couldn't hear you that time. Try again, or tap “I learned it!”.");};
    r.onend=()=>{if(!got&&ui.listening)fail("Pip couldn't hear you. Try a little louder, close to the phone.");};
    pipPlay("sayit").then(ok=>ok==="stop"?"stop":pipSpeak(x.word)).then(ok=>ok==="stop"?"stop":pipPlay("turn")).then(()=>{try{r.start();setTimeout(()=>{try{r.stop()}catch(e){}},6000);}catch(e){fail("Pip can't listen on this phone. Say it out loud, then tap “I learned it!”.");}});}catch(e){fail("Pip can't listen on this phone. Say it out loud, then tap “I learned it!”.");}};

async function wodDone(L,x,how){const ds=ymd(new Date());if(wodRec(L.uid,ds))return;

  render(true);toast("🌼 Golden flower planted!");pipPlay("yay");try{await earn({wod:{[ds]:rec}});wkLog(x.word,true);}catch(e){toast("That didn't save. Check your internet and try again.",true);}}

    <div class="field"><label for="ws-t">My sentence</label><textarea id="ws-t" name="t" rows="3" maxlength="200" placeholder="Write your sentence here">${esc(S.wodDraft||"")}</textarea></div>

    <p class="small muted" style="margin:0">Your teacher can read or listen to it and may send you a star.</p>`,
   {noFocus:true,submitLabel:"Send to my teacher",done:"Sent!",
    actions:{rec:async(_,b,f)=>{if(f&&f.t)S.wodDraft=f.t.value;if(rec){stopRec();return}const ok=await startRec(lim,u=>{rec=false;clip=u;draw();});if(ok){rec=true;draw();}}},

/* CSV: date,stage,word,phonetic,meaning,example,emoji,tip */
function wodParseCSV(txt){const rows=[];let row=[],f="",q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===","){row.push(f);f="";}else if(c==="\n"||c==="\r"){if(c==="\r"&&txt[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}else f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>String(x).trim()));}
function wodDate(v){v=String(v||"").trim();if(!v)return "";let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;return null;}
const WOD_COLS=["date","stage","word","phonetic","meaning","example","emoji","tip"];
A.wodImport=()=>{if(role()!=="admin")return;let parsed=null;

    ${note?`<p class="small" aria-live="polite">${note}</p>`:""}`,
   {wide:true,noFocus:true,submitLabel:"Import words",done:"Imported",
    actions:{tpl:()=>saveFile("word-of-the-day-template.csv","date,stage,word,phonetic,meaning,example,emoji,tip\n2026-11-03,Seeds,apple,AP-ul,A round crunchy fruit.,I eat an apple.,🍎,\n,Sprouts,curious,KYOOR-ee-us,Wanting to know or learn about something.,Pip is curious about the clouds.,🔍,\n"),
      file:(_,el)=>{const fl=el.files&&el.files[0];if(!fl)return;if(fl.size>1e6){toast("That file is too big (1MB max).",true);return}fl.text().then(t=>{parsed=wodRows(t);const ta=document.getElementById("wi-t");if(ta)ta.value=t.slice(0,20000);draw(parsed.msg);});},

    onSubmit:async f=>{if(!parsed||!parsed.items)parsed=wodRows(f.t.value);if(!parsed.n)throw userErr(parsed.msg||"No rows to import.");await upsert("config/wod",{items:parsed.items});toast(`${parsed.n} word${parsed.n===1?"":"s"} imported`);}});

function wodRows(txt){const rows=wodParseCSV(String(txt||""));if(!rows.length)return {n:0,msg:"No rows found."};let cols=WOD_COLS,start=0;
  const h=rows[0].map(x=>String(x).trim().toLowerCase());if(h.includes("word")){cols=h.map(x=>x==="phonetics"?"phonetic":x==="picture"?"emoji":x);start=1;}
  const items={},bad=[];let n=0;const taken=new Set(wodItems().filter(x=>x.date).map(x=>x.stage+"|"+x.date));
  for(let i=start;i<rows.length;i++){const o={};cols.forEach((c,j)=>o[c]=rows[i][j]);const w=wodClean(o.word,40),m=wodClean(o.meaning,160);let st=wodClean(o.stage,10);st=WOD_STAGES.find(s=>s.toLowerCase()===st.toLowerCase())||S.wodStage||"Seeds";const d=wodDate(o.date);
    if(!w||!m||d===null){bad.push(i+1);continue}if(d&&taken.has(st+"|"+d)){bad.push(i+1);continue}if(d)taken.add(st+"|"+d);
    items["c"+Date.now().toString(36)+i]={stage:st,date:d||"",word:w,phon:wodClean(o.phonetic,60),mean:m,ex:wodClean(o.example,160),emo:wodClean(o.emoji,8),tip:wodClean(o.tip,200),at:Date.now()};n++;}
  return {n,items,msg:`${n} word${n===1?"":"s"} ready to import.${bad.length?` Skipped row${bad.length===1?"":"s"} ${bad.slice(0,8).join(", ")}${bad.length>8?"…":""} (missing word or meaning, a date we couldn't read, or a day that already has a word).`:""}`};}

function wodWrap(g,t,x,y,w,lh){const ws=String(t||"").split(/\s+/);let line="";for(const word of ws){const test=line?line+" "+word:word;if(g.measureText(test).width>w&&line){g.fillText(line,x,y);y+=lh;line=word;}else line=test;}if(line){g.fillText(line,x,y);y+=lh;}return y;}

/* ================= Pip's voice: the same voice everywhere ================= */
/* Pip's real voice is Kokoro "af_heart" at speed 0.88 (US English, natural pitch), processed with an
   80 Hz high-pass, +2.5 dB at 3 kHz, light compression and -16 LUFS loudness (the academy's own recordings).
   1) The academy's recordings (pip-*.mp3) play for Pip's own lines and words.
   2) Every other word the app reads aloud plays from Pip's built-in voice library (pv/*.mp3, listed in
      pv.json), made with the same voice and the same processing.
   3) Words added later can be recorded by the admin (Pip's voice page, config/pv + file store).

(function(){const synth=window.speechSynthesis;if(!synth||synth.__pipVoice)return;let voices=[];
  const load=()=>{try{voices=synth.getVoices()||[];}catch(e){voices=[];}};load();
  try{synth.addEventListener("voiceschanged",load);}catch(e){try{synth.onvoiceschanged=load;}catch(e2){}}
  const WARM=/(Samantha|Ava|Allison|Susan|Aria|Jenny|Michelle|Emma|Zira|Google US English|Female)/i;
  const pick=lang=>{const l=String(lang||"en-US"),base=l.slice(0,2).toLowerCase();if(!voices.length)load();
    if(base==="en"){const us=voices.filter(x=>/^en[-_]US/i.test(x.lang));return us.find(x=>WARM.test(x.name))||us[0]||voices.find(x=>/^en[-_](GB|AU|IN)/i.test(x.lang)&&WARM.test(x.name))||voices.find(x=>/^en/i.test(x.lang))||null;}
    return voices.find(x=>x.lang&&x.lang.toLowerCase().replace("_","-")===l.toLowerCase())||voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith(base))||null;};
  const orig=synth.speak.bind(synth),origCancel=synth.cancel.bind(synth);
  const device=u=>{try{const slow=u.rate&&u.rate<.7;const v=pick(u.lang);if(v){u.voice=v;if(!u.lang||/^en/i.test(u.lang))u.lang=v.lang;}u.pitch=PIP_VOICE.pitch;u.rate=slow?u.rate:PIP_VOICE.rate;}catch(e){}try{orig(u);}catch(e){}};
  try{synth.__origCancel=origCancel;

    synth.speak=u=>{if(!u||u.__pipDone)return orig(u);u.__pipDone=1;
      try{const en=!u.lang||/^en/i.test(u.lang),slow=!!(u.rate&&u.rate<.7);
        if(en){const fin=ok=>{if(ok===true){try{u.onend&&u.onend(new Event("end"));}catch(e){}}else if(!ok)device(u);};
          const clip=pipClipFor(u.text,slow);if(clip){pipPlay(clip).then(fin);return;}

          if(PVS===null||(!pvsUrl(k)&&D.pv===undefined&&S.db)){Promise.race([pvsP,new Promise(r=>setTimeout(r,1500))]).then(()=>pvsUrl(k)?0:pvWait(1200)).then(()=>{if(!go())device(u);});return;}

function pvGather(){const out=new Map();

  try{for(const l of Object.values(D.lessons||{})){if(!l)continue;const c=D.courses[l.courseId];for(const [w] of parseVocab(l.vocab))add(w,langOf(c));}}catch(e){}
  try{for(const s of Object.values(D.sessions||{})){if(!s||!s.vocab)continue;const c=D.courses[s.courseId];for(const [w] of parseVocab(s.vocab))add(w,langOf(c));}}catch(e){}
  try{for(const st of Object.keys(STARTER))for(const [w] of STARTER[st])add(w);}catch(e){}
  try{for(const x of wodItems())add(x.word);for(const st of WOD_STAGES)for(const x of wodStarterItems(st))add(x.word);}catch(e){}

/* the same finishing as the academy's recordings: 80 Hz high-pass, +2.5 dB at 3 kHz, light compression,

  return y;}
function pvMp3(f32,sr){let i=0,j=f32.length-1;while(i<j&&Math.abs(f32[i])<.01)i++;while(j>i&&Math.abs(f32[j])<.01)j--;

A.pvRecord=async()=>{if(role()!=="admin"||(S.pvJob&&S.pvJob.run))return;const miss=pvMissing();if(!miss.length){toast("Every line is already in Pip's voice");return}

  let sq="";
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){const r=flip?7-i:i,c=flip?7-j:j,name="abcdefgh"[c]+(8-r),p=b[r][c],dark=(r+c)%2===1;
    const cls=["chsq",dark?"dk":"lt",CH.sel===name?"sel":"",targets.has(name)?(p?"cap":"tgt"):"",CH.last&&CH.last.includes(name)?"lastmv":"",CH.last&&CH.last[1]===name?"landed":"",kingSq===name?"chk":"",CH.hint&&CH.hint.includes(name)?"hint":""].filter(Boolean).join(" ");
    sq+=`<button type="button" class="${cls}" data-act="chTap" data-id="${name}" aria-label="${name}${p?` ${p.color==="w"?"white":"black"} ${PNAME[p.type]}`:""}">${p?pieceSvg(p.type,p.color):""}${j===0?`<i class="rk">${8-r}</i>`:""}${i===7?`<i class="fl">${"abcdefgh"[c]}</i>`:""}</button>`;}
  const me=two?"w":CH.me,op=me==="w"?"b":"w",won=over&&g.in_checkmate()&&!two&&g.turn()!==CH.me;
  const chip=(act,v,cur,label)=>`<button class="chchip ${v===cur?"on":""}" data-act="${act}" data-id="${v}" aria-pressed="${v===cur}">${label}</button>`;
  return `<section class="card panel chx ${won?"won":""}">
    <div class="chhead"><h2>${kid?"Pip's Chess":"Chess"}</h2><div class="chchips" role="group" aria-label="Opponent">${chip("chModeB","easy",CH.mode,"Easy")}${chip("chModeB","medium",CH.mode,"Tricky")}${chip("chModeB","two",CH.mode,"With a friend")}</div>
      ${two?"":`<div class="chchips" role="group" aria-label="Your colour">${chip("chSideB","w",CH.me,'<i class="chdot w"></i>White')}${chip("chSideB","b",CH.me,'<i class="chdot b"></i>Black')}</div>`}</div>
    <div class="chgame"><div class="chboardcol">
      ${chPlayer(op,two?"friend":"pip")}
      <div class="chframe"><div class="board" role="grid" aria-label="Chess board">${sq}</div>${won?`<div class="chconfetti" aria-hidden="true">${Array.from({length:24},(_,k)=>`<i style="left:${(k*37)%100}%;animation-delay:${(k%8)*.15}s;background:${["#E8492F","#FFC94A","#7CC243","#4BA3E3","#F7A8C4"][k%5]}"></i>`).join("")}</div>`:""}</div>
      ${chPlayer(me,two?"friend":"me")}</div>
      <div class="chside">
        <div class="chbubble ${over?"over":""}">${art(won?"bloom":"pip",64,won?"Bloom":"Pip")}<p aria-live="polite">${esc(chStatus())}</p></div>
        <div class="chbtns">${!over&&!two?`<button class="btn btn-ghost btn-sm" data-act="chHint" ${CH.busy?"disabled":""}>${stIc('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>')}Hint</button>`:""}<button class="btn btn-ghost btn-sm" data-act="chUndo" ${g.history().length&&!CH.busy?"":"disabled"}>${stIc('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>')}Undo</button><button class="btn ${over?"btn-primary":"btn-ghost"} btn-sm" data-act="chReset">${over?"Play again":"New game"}</button></div>
        <p class="small muted">Tap a piece, then tap a dot to move. Pawns that reach the end become queens.</p></div></div></section>`;}
A.chTap=sq=>{const g=CH.g;if(!g||CH.busy||g.game_over())return;const turnOk=CH.mode==="two"||g.turn()===CH.me;if(!turnOk)return;const p=g.get(sq);
  if(CH.sel){const mv=g.moves({square:CH.sel,verbose:true}).find(m=>m.to===sq);
    if(mv){const done=g.move({from:CH.sel,to:sq,promotion:"q"});CH.last=[done.from,done.to];CH.sel=null;CH.hint=null;
      if(CH.mode!=="two"){CH.msg=done.captured?chPick("cap",done.captured):g.in_check()?"Ooh, check! Let me get out of this…":"Hmm, let me think…";}
      render();if(CH.mode!=="two"&&!g.game_over()){CH.busy=true;render();setTimeout(()=>{chAiMove();CH.busy=false;render();},650);}return;}}
  CH.sel=p&&p.color===g.turn()&&CH.sel!==sq?sq:null;render();};
A.chHint=()=>{const g=CH.g;if(!g||CH.busy||g.game_over()||g.turn()!==CH.me)return;const m=chBest(g);if(m){CH.hint=[m.from,m.to];CH.sel=null;CH.msg=`Try moving your ${PNAME[m.piece]} to ${m.to}.`;}render();};
A.chUndo=()=>{const g=CH.g;if(!g||CH.busy)return;g.undo();if(CH.mode!=="two"&&g.turn()!==CH.me)g.undo();CH.sel=null;CH.last=null;CH.hint=null;CH.msg="Let's try that again.";render();};
A.chReset=()=>{chNewGame(CH.mode,CH.me);render();};
A.chModeB=v=>{chNewGame(v,CH.me);render();};
A.chSideB=v=>{chNewGame(CH.mode,v);render();};

/* ---------- classes with no learners: list them, fix them ---------- */
function noKidsUpcoming(){return (role()==="admin"?entries(D.sessions):scopedSessions()).filter(s=>sessEnd(s)>Date.now()&&noKidsClass(s)).sort((a,b)=>String(a.startsAt).localeCompare(String(b.startsAt)));}
A.noKidsList=()=>{const xs=noKidsUpcoming();
  if(!xs.length){toast("Every upcoming class has its learners picked.");render();return;}
  openModal(`${xs.length} class${xs.length===1?"":"es"} with no learners`,`<p class="small">Children only see classes they are picked for. Pick the learners for each class, or cancel classes that aren't needed.</p>
   <div class="list nklist">${xs.map(s=>{const d=new Date(s.startsAt),c=D.courses[s.courseId];return `<div class="item"><div class="when"><span>${esc(WD.format(d))}</span><b class="num">${esc(DNUM.format(d))}</b></div><div class="grow"><div class="t">${esc(s.title||"Live class")}</div><div class="s">${esc(fmtDay(d))}, ${esc(fmtTime(d))} · ${esc(c?c.title:"Course removed")} · ${esc(s.trainerId&&D.trainers[s.trainerId]?trainerName(s.trainerId):"No trainer")}</div></div><div class="acts wrap"><button type="button" class="btn btn-leaf btn-sm" data-mact="pick" data-id="${esc(s.id)}">Pick learners</button><button type="button" class="btn btn-ghost btn-sm" data-mact="del" data-id="${esc(s.id)}">Cancel class</button></div></div>`;}).join("")}</div>`,
  {wide:true,actions:{pick:id=>{closeModal();A.editSession(id,true);},del:id=>{closeModal();A.delSession(id);}}});};

/* ================= events ================= */
document.addEventListener("click",e=>{
  if(e.target.closest("#modal-root"))return;
  const a=e.target.closest("[data-act]");
  if(a&&!a.disabled){e.preventDefault();const fn=A[a.dataset.act];if(fn)fn(a.dataset.id,a);return}
  const g=e.target.closest("[data-go]");
  if(g){e.preventDefault();const [v,id]=g.dataset.go.split(":");go(v,id);}
});
document.addEventListener("change",e=>{const el=e.target.closest("[data-change]");if(el&&A[el.dataset.change]){A[el.dataset.change](el.dataset.id,el.value);el.blur();}});
document.addEventListener("input",e=>{if(e.target.id==="q")filterRows(e.target.value);});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&!e.target.closest("#modal-root")){const t=e.target;if(t.matches&&t.matches('[role="link"],[role="button"]')&&t.tagName!=="BUTTON"&&t.tagName!=="A"){e.preventDefault();t.click();}}
});

/* ================= boot ================= */
const live={marks:new Map(),ts:new Map(),ct:new Map(),par:new Map(),stf:new Map()};
function syncSet(map,want,make,drop){for(const [k,un] of [...map]){if(!want.has(k)){try{un()}catch{}map.delete(k);drop(k)}}for(const k of want)if(!map.has(k))map.set(k,make(k));}
function syncDynamic(){
  if(!S.db)return;
  const trusted=new Set();if(D.config.ownerUid)trusted.add(D.config.ownerUid);if(S.isOwner&&S.uid)trusted.add(S.uid);
  for(const t of Object.values(D.trainers))if(t&&t.uid)trusted.add(t.uid);
  syncSet(live.marks,trusted,uid=>S.db.collection(`tw/${uid}/x`).onSnapshot(snap=>{const mk={},hw={},tn={},sk={},tx={};for(const d of snap.docs){const v=d.data();if(!v)continue;if(v.kind==="mark"&&v.sid)mk[v.sid]=v;else if(v.kind==="hw")hw[d.id]=v;else if(v.kind==="note")tn[d.id]=v;else if(v.kind==="sticker")sk[d.id]=v;else if(v.kind==="voice"&&v.hw&&v.lid)D.vn[v.hw+"|"+v.lid]=v;else tx[d.id]=v;}D.stk[uid]=sk;D.tx[uid]=tx;D.marks[uid]=mk;D.hw[uid]=hw;D.tn[uid]=tn;markCache=null;schedulePF();schedule();},()=>{}),uid=>{delete D.marks[uid];delete D.hw[uid];delete D.tn[uid];delete D.tx[uid];markCache=null;});
  const keys=new Set();
  if(S.isOwner){for(const [id,t] of Object.entries(D.trainers)){if(!t)continue;keys.add("t-"+id);if(t.uid)keys.add(t.uid);}}
  else if(trainerByUid(S.uid))keys.add(S.uid);
  const ck=new Set();if(!S.isOwner&&trainerByUid(S.uid))ck.add(S.uid);
  syncSet(live.ct,ck,k=>S.db.collection(`contacts/${k}/l`).onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.contacts=o;schedule();},()=>{}),()=>{D.contacts={};});
  scheduleContactSync();schedulePF();
  const rr=realRole(), pk=new Set(), sk=new Set();
  if(rr==="parent"){pk.add("pp");pk.add("pf");} if(rr==="student")pk.add("kp"); if(rr==="teacher")pk.add("pay"); if(rr==="admin"||rr==="teacher")sk.add("ppi");
  syncSet(live.par,pk,k=>k==="pay"?S.db.doc(`contacts/${S.uid}/p/pay`).onSnapshot(d=>{D.pay=(d.exists&&d.data())||{};schedule();},()=>{}):k==="kp"?S.db.collection(`kp/${S.uid}/x`).onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.kp[S.uid]=o;schedule();},()=>{}):k==="pp"?S.db.collection(`pp/${S.uid}/x`).onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.pp[S.uid]=o;schedule();},()=>{}):S.db.doc("pf/"+S.uid).onSnapshot(d=>{D.pf=(d.exists&&d.data())||{};schedule();},()=>{}),k=>{if(k==="pf")D.pf={};else delete D.pp[S.uid];});
  syncSet(live.stf,sk,()=>S.db.collection("ppi").onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.ppi=o;refreshThreads();schedule();},()=>{}),()=>{D.ppi={};});
  syncSet(live.ts,keys,k=>S.db.collection(`timesheets/${k}/e`).onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.ts[k]=o;schedule();},()=>{}),k=>{delete D.ts[k];});
}
async function boot(){
  S.month=thisMonth();
  render(true);
  if(!window.claude||!window.claude.use){S.status="nodb";render(true);return}
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  if(!db||!user){S.status="nodb";render(true);return}
  S.db=db;S.user=user;
  const me=await user.me();
  S.uid=me.id;S.isOwner=me.isOwner;if(me.name&&S.uid)S.names[S.uid]=me.name;
  if(!S.uid){S.status="noid";render(true);return}
  const cols={profiles:"profiles",courses:"courses",lessons:"lessons",sessions:"sessions",progress:"progress",learners:"learners",trainers:"trainers",notices:"notices",answers:"answers",ptm:"ptm",ptmb:"ptmb",library:"library",batches:"batches",events:"events",evr:"evr"};
  if(S.isOwner){cols.fees="fees";cols.priv="private";}
  const need=new Set([...Object.keys(cols),"config"]);
  const markLoaded=k=>{S.loaded.add(k);if(S.status!=="ready"&&[...need].every(x=>S.loaded.has(x))){S.status="ready";render(true)}else schedule()};
  const onErr=k=>e=>{markLoaded(k);if(e&&e.code!=="revoked")console.warn("Little Lingos: "+k+" stopped updating",e);};
  for(const [k,path] of Object.entries(cols)){
    db.collection(path).onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D[k]=o;if(k==="trainers"||k==="learners"||k==="profiles")syncDynamic();if(k==="priv"||k==="courses")scheduleContactSync();if(["fees","learners","profiles"].includes(k))schedulePF();markLoaded(k)},onErr(k));
  }
  if(S.isOwner){for(const k of ["leads","obs","payouts","credits","audit"])db.collection(`ad/${k}/x`).onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.ad[k]=o;if(k==="credits")schedulePF();schedule();},()=>{});
    db.doc("ad/settings").onSnapshot(d=>{D.adset=(d.exists&&d.data())||{};schedule();},()=>{});}
  db.doc("config/app").onSnapshot(d=>{D.config=(d.exists&&d.data())||{};schedulePF();
    if(S.isOwner&&D.config.ownerUid!==S.uid)db.doc("config/app").set({...D.config,ownerUid:S.uid}).catch(()=>{});
    syncDynamic();markLoaded("config")},onErr("config"));
  setTimeout(()=>{if(S.status!=="ready"){S.status="ready";render(true)}},8000);
  setInterval(()=>{if(S.status==="ready")schedule()},60000);
}
setInterval(()=>{const now=Date.now();document.querySelectorAll("[data-since]").forEach(el=>{el.textContent=fmtDur(+(el.dataset.base||0)+now-new Date(el.dataset.since).getTime());});document.querySelectorAll("[data-now]").forEach(el=>{el.textContent=TIMESEC.format(new Date(now));});},1000);
boot();
})();
</script>
