<title>Little Lingos Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: app shell — left rail on desktop, scrollable bottom tab bar on phones, content column ~1080px.
   Word Garden (brand Concept B): one bright daylight look on purpose, so there is no dark variant. */
:root{
  --ground:#F5FAEE; --card:#FFFFFF; --soft:#EEF2E8; --line:#D5E8BE;
  --soil:#2E2219; --muted:#5C4F45;
  --leaf:#22703A; --leafMid:#2F8F46; --leafSoft:#DDEFC4; --sprout:#A6DB5C; --grass:#7CC243;
  --tomato:#E8492F; --cta:#D23C24; --ctaInk:#FFFFFF;
  --sky:#BFE3FA; --skySoft:#D7ECFA; --skyText:#1F6FA8; --skyDeep:#4BA3E3;
  --petal:#F7A8C4; --petalSoft:#FBE0EA; --sun:#FFC94A; --sunSoft:#FFF4D1; --peach:#FFE3D9;
  --good:#22703A; --goodSoft:#E5F4D3; --warn:#8A5A2B; --bad:#B83A24; --badSoft:#FFE3D9;
  --c0:#22703A; --c0s:#DDEFC4; --c1:#B83A24; --c1s:#FFE3D9; --c2:#1F6FA8; --c2s:#D7ECFA; --c3:#A83B67; --c3s:#FBE0EA; --c4:#8A5A2B; --c4s:#FFF4D1;
  --b0:#2F8F46; --b1:#E8492F; --b2:#4BA3E3; --b3:#D9789E; --b4:#E0A52A;
  --display:"Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--soil);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,1.5rem + 1.6vw,2.6rem)}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
a{color:var(--leaf)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--skyDeep);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf)}

/* top bar + shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:64px}
.brand{--ls:34px;display:flex;align-items:center;gap:calc(var(--ls)*.2);text-decoration:none;color:var(--soil);margin-right:auto}
.brand .lg-pip{width:calc(var(--ls)*1.3);height:calc(var(--ls)*1.6);flex:none}
.wm{display:inline-flex;align-items:baseline;gap:calc(var(--ls)*.13);font-family:var(--display);line-height:1;white-space:nowrap}
.wm b{font-weight:700;font-size:calc(var(--ls)*.46);color:var(--soil)}
.wm span{position:relative;font-weight:800;font-size:var(--ls);color:#22703A;letter-spacing:-.01em}
.wm .lg-leaf{position:absolute;right:-.16em;top:-.02em;width:.3em;height:.3em}
.brand:hover .lg-pip{transform:rotate(-6deg)}.brand .lg-pip{transition:transform .2s}
.viewas{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);font-weight:700;white-space:nowrap}
.viewas select{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;color:var(--soil);min-height:40px}
.me{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:4px;border-radius:999px;min-height:44px}
.me .av{width:40px;height:40px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.me span.nm{font-weight:700;font-size:.92rem}
.rolechip{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunSoft);color:var(--warn)}
.bell{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--leaf)}
.bell svg{width:20px;height:20px}
.bell .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--cta);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 5px}

.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 56px}
.nav{position:sticky;top:calc(90px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:700;min-height:46px}
.nav a:hover{background:var(--soft);color:var(--soil)}
.nav a[aria-current="page"]{background:var(--leafSoft);color:var(--leaf)}
.nav svg{width:22px;height:22px;flex:none}
main{min-width:0;display:flex;flex-direction:column;gap:24px}

@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);padding-block:18px calc(100px + env(safe-area-inset-bottom,0px))}
  .nav{position:fixed;inset:auto 0 0 0;top:auto;z-index:25;flex-direction:row;gap:2px;background:var(--card);border-top:2px solid var(--line);overflow-x:auto;scrollbar-width:none;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:1 0 74px;flex-direction:column;gap:2px;font-size:.7rem;padding:6px 4px;text-align:center;border-radius:18px;min-height:52px;justify-content:center}
  .me span.nm,.viewas label{display:none}
  .brand{--ls:29px}
}

/* building blocks */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head .lede{margin-top:6px}
.lede{color:var(--muted);max-width:64ch}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:20px}
.panel{display:flex;flex-direction:column;gap:12px}
.panel > .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.cols{display:grid;gap:22px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1020px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:999px;padding:10px 20px;font-family:var(--display);font-weight:800;font-size:1.08rem;line-height:1.15;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:48px;transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--cta);color:var(--ctaInk)}
.btn-primary:hover{background:#BC3520}
.btn-leaf{background:var(--leaf);color:#fff}
.btn-sun{background:var(--sun);color:var(--soil)}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--soil)}
.btn-ghost:hover{background:var(--soft)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:6px 14px;font-size:.95rem;min-height:40px}
.btn-wa{background:#1E7F45;color:#fff;border-color:#1E7F45}.btn-wa:hover{background:#176638}
.sharebox{background:var(--soft);border-radius:14px;padding:12px 14px;white-space:pre-wrap;font-size:.95rem;margin:0 0 12px}
.sharerow{display:flex;gap:8px;flex-wrap:wrap}
.btn-big{font-size:1.3rem;padding:14px 26px;min-height:60px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;color:var(--leaf);flex:none}
.iconbtn:hover{background:var(--leafSoft)}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}
.iconbtn svg{width:17px;height:17px}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap}
.p-good{background:var(--goodSoft);color:var(--good)}
.p-warn{background:var(--sunSoft);color:var(--warn)}
.p-bad{background:var(--badSoft);color:var(--bad)}
.p-info{background:var(--skySoft);color:var(--skyText)}
.p-mute{background:var(--soft);color:var(--muted)}
.p-sun{background:var(--sun);color:var(--soil)}
.chip{font-weight:700;font-size:.88rem;padding:5px 12px;border-radius:999px}

.stamp{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:24px 4px 24px 4px;flex:none;
  color:var(--c,var(--c0));background:var(--cs,var(--c0s));font-family:var(--display);font-weight:800;font-size:1rem}
.stamp.sm{width:34px;height:34px;border-radius:17px 3px 17px 3px;font-size:.74rem}
.stamp.lg{width:70px;height:70px;border-radius:35px 6px 35px 6px;font-size:1.4rem;background:var(--card)}
.h0{--c:var(--c0);--cs:var(--c0s);--b:var(--b0)}.h1{--c:var(--c1);--cs:var(--c1s);--b:var(--b1)}.h2{--c:var(--c2);--cs:var(--c2s);--b:var(--b2)}.h3{--c:var(--c3);--cs:var(--c3s);--b:var(--b3)}.h4{--c:var(--c4);--cs:var(--c4s);--b:var(--b4)}

.course{display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease}
.course:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(46,34,25,.08)}
.course .band{background:var(--cs);padding:16px 18px;display:flex;gap:12px;align-items:center}
.course .band .stamp{background:var(--card)}
.course .cmeta{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}
.course .cbody{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.course p.desc{color:var(--muted);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--b,var(--leafMid))}
.barrow{display:flex;align-items:center;gap:10px}
.barrow .bar{flex:1;min-width:50px}
.barrow b{font-size:.85rem;min-width:3.2ch;text-align:right}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1.5px solid var(--soft);min-height:60px;flex-wrap:wrap}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:150px}
.item .t{font-weight:700}
.item .s{color:var(--muted);font-size:.87rem}
.item.click{cursor:pointer;border-radius:16px;padding-inline:10px;margin-inline:-8px}
.item.click:hover{background:var(--soft)}
.when{flex:none;width:58px;text-align:center;border-radius:18px;background:var(--skySoft);padding:6px 0;line-height:1.05}
.when b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:800}
.when span{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--skyText)}

.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{border-radius:22px;padding:14px 16px;background:var(--card);border:2px solid var(--line)}
.stat.f{border:0}
.stat b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:800;line-height:1.05}
.stat span{font-size:.84rem;color:var(--muted);font-weight:700}
.stat small{display:block;font-size:.78rem;color:var(--muted);margin-top:4px;line-height:1.3}
.stat.go{cursor:pointer;transition:transform .12s ease}.stat.go:hover{transform:translateY(-2px)}

/* garden */
.garden{position:relative;background:var(--sky);border-radius:28px;overflow:hidden;height:270px;flex:none}
.hill{position:absolute;left:-30px;right:-30px;bottom:0;height:70px;background:var(--grass);border-radius:600px 600px 0 0}
.garden .sun{position:absolute;right:14px;top:8px;width:74px;height:74px}
.garden .cloud{position:absolute;right:110px;top:34px;width:84px;height:40px}
.garden .cloud2{position:absolute;left:44%;top:16px;width:64px;height:30px}
.fl{position:absolute;bottom:34px}
.garden .pip{position:absolute;left:calc(50% - 60px);bottom:16px;width:120px;height:120px}
.bubble{position:absolute;background:#fff;font-family:var(--display);font-weight:800;font-size:1.08rem;line-height:1.15;padding:9px 14px;border-radius:18px 18px 18px 4px;max-width:60%}
.bubble.static{position:static;align-self:flex-start;max-width:none}
.skycard{background:var(--sky);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:10px}
.skycard .eyebrow{color:var(--skyText)}
.suncard{background:var(--sunSoft);border-radius:26px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px;border:2px dashed var(--line);border-radius:26px;background:var(--card)}
.empty svg.m{width:88px;height:88px}
.empty p{color:var(--muted);max-width:52ch}

.prose{max-width:66ch;display:flex;flex-direction:column;gap:14px;font-size:1.12rem;line-height:1.7}
.vocab{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.flip{border:2px solid transparent;border-radius:24px;min-height:108px;cursor:pointer;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .12s ease}
.flip:active{transform:scale(.97)}
.flip b{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1}
.flip span{font-size:.75rem;color:var(--muted)}
.flip.on{background:#fff!important;border-color:var(--leafMid)}
.flip.on b{font-family:var(--body);font-weight:700;font-size:1.15rem}
.bloomed{position:relative;background:var(--sky);border-radius:28px;overflow:hidden;padding:24px 20px 104px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;animation:pop .5s ease}
.bloomed .fl{bottom:30px}
@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:none;opacity:1}}

table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1.5px solid var(--soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.off td{opacity:.6}
.tablewrap{overflow-x:auto;margin:0 -4px}
.tablewrap table{min-width:720px}
td .nm{white-space:nowrap;font-weight:700;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--soil);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
td .nm:hover{text-decoration-color:var(--leafMid)}
select.inline{min-width:130px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;min-height:38px;font-weight:700;font-size:.88rem;max-width:180px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;min-height:44px;min-width:0;flex:1 1 220px;max-width:340px}
.monthnav{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.monthnav b{font-family:var(--display);font-weight:800;font-size:1.05rem;min-width:9.5ch;text-align:center}
.monthnav .iconbtn{border:0;width:38px;height:38px}

.clock{background:var(--sky);border-radius:28px;padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center}
.clock .timer{display:block;font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,2rem + 2.5vw,3.6rem);line-height:1;letter-spacing:.01em;margin:6px 0 4px}
.clock .eyebrow{color:var(--skyText)}
.clock .live{display:inline-flex;align-items:center;gap:8px}
.clock .live::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--leafMid);box-shadow:0 0 0 4px rgba(47,143,70,.25);animation:pulse 1.6s ease-in-out infinite}
.clock .acts{flex-direction:column;align-items:stretch;gap:8px}
.clock .shifts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.shift{background:rgba(255,255,255,.7);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700}
.shift.on{background:#fff;color:var(--leaf)}
@media (max-width:620px){.clock{grid-template-columns:1fr}.clock .acts{flex-direction:row;flex-wrap:wrap}}
.clockchip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:44px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--soil);white-space:nowrap}
.clockchip svg{width:18px;height:18px;color:var(--leaf)}
.clockchip.on{background:var(--leafSoft);border-color:var(--leafMid);color:var(--leaf)}
.clockchip.on::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--leafMid);animation:pulse 1.6s ease-in-out infinite}
@media (max-width:760px){.clockchip .lbl{display:none}.top .rolechip{display:none}}
.msgitem{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1.5px solid var(--soft)}
.msgitem:first-child{border-top:0;padding-top:0}
.msgitem .body{white-space:pre-wrap;font-size:.95rem}
.tog{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted);min-height:40px;cursor:pointer}
.tog.on{background:var(--leafMid);color:#fff}
.hwcard{display:flex;flex-direction:column;gap:10px}

/* ================= fees ================= */
function feeInfo(lid,m){
  const f=D.fees[lid]; if(!f||!(+f.monthly>0)||!isMonth(f.start))return null;
  const pays=Object.entries(f.payments||{}).filter(([,p])=>p&&+p.amount>0).map(([id,p])=>({id,...p})).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const paidFor=mm=>pays.filter(p=>p.month===mm).reduce((s,p)=>s+(+p.amount),0);
  const monthly=+f.monthly, dueDay=+f.dueDay||10;
  const months=m>=f.start?monthsFromTo(f.start,m):[];
  const expected=months.length*monthly;
  const paidTo=pays.filter(p=>p.month<=m).reduce((s,p)=>s+(+p.amount),0);
  const balance=Math.max(0,expected-paidTo);
  const owedM=m>=f.start?monthly:0, paidM=paidFor(m);
  let status;
  if(!owedM)status={k:"none",cls:"p-mute",label:"Starts "+monthShort(f.start)};
  else if(paidM>=owedM)status={k:"paid",cls:"p-good",label:"Paid"};
  else{const cur=thisMonth();const late=m<cur||(m===cur&&new Date().getDate()>dueDay);
    status=paidM>0?{k:"part",cls:"p-warn",label:"Part paid"}:late?{k:"overdue",cls:"p-bad",label:"Overdue"}:{k:"due",cls:"p-info",label:`Due ${dueDay} ${monthShort(m)}`};}
  return {f,monthly,dueDay,pays,paidM,owedM,balance,status,remainingM:Math.max(0,owedM-paidM)};
}

function entriesOf(tid){

  const out=[];for(const k of keys)for(const [id,e] of Object.entries(D.ts[k]||{}))if(e&&e.date)out.push({id,key:k,...e});
  return out.sort((a,b)=>String(b.date+(b.startAt||"")).localeCompare(String(a.date+(a.startAt||""))));

function trainerMonth(tid,m){
  const es=entriesOf(tid).filter(e=>e.date.startsWith(m));
  const days=st=>new Set(es.filter(e=>(e.status||"present")===st).map(e=>e.date)).size;
  return {es,present:days("present"),leave:days("leave"),absent:days("absent"),hours:es.filter(e=>(e.status||"present")==="present").reduce((s,e)=>s+hoursOf(e),0)};
}
function trainerToday(tid){
  const d=ymd(new Date());const es=entriesOf(tid).filter(e=>e.date===d);
  const open=es.find(e=>(e.status||"present")==="present"&&e.startAt&&!e.endAt);
  return {es,open,hours:es.filter(e=>(e.status||"present")==="present").reduce((s,e)=>s+hoursOf(e),0),leave:es.some(e=>e.status==="leave"),absent:es.some(e=>e.status==="absent"),in:es.some(e=>(e.status||"present")==="present")};
}

async function saveLearner(f,form,id){
  if(lfBusy)return false;
  const name=f.name.value.trim().replace(/\s+/g," "); if(!name)throw userErr("Add the child's name.");
  const courses=[...form.querySelectorAll('input[name="courses"]:checked')].map(x=>x.value);
  const fee=+f.fee.value||0, start=f.start.value, due=Math.min(28,Math.max(1,+f.due.value||10));
  if(fee>0&&!isMonth(start))throw userErr("Pick the month fees start from (for example 2026-10).");
  const acct=f.acct.value||null;
  if(acct){const other=activeLearners().find(l=>l.uid===acct&&l.id!==id);if(other)throw userErr(`That account is already connected to ${other.name}.`);}
  /* check everything before saving anything, so a fix-and-retry never makes a second copy */
  const priv={guardian:f.guardian.value.trim(),phone:f.phone.value.trim(),guardian2:f.guardian2.value.trim(),phone2:f.phone2.value.trim(),email:chkEmail(f.email.value,"parent's email"),email2:chkEmail(f.email2.value,"second parent's email"),studentEmail:chkEmail(f.semail.value,"child's email"),notes:f.notes.value.trim()};
  const newId=!id&&f.lid?f.lid.value:null;
  if(!id){const dup=sameChild(name,priv.phone,priv.email,newId);const box=form.querySelector(".lfdup");
    if(dup&&!(f.dupok&&f.dupok.checked)){if(box){box.hidden=false;box.querySelector("p").textContent=`${dup.name} is already on your list${dup.active===false?" (not attending now)":""}${dup.createdAt?`, added ${fmtDay(new Date(dup.createdAt))}`:""}${(D.priv[dup.id]||{}).guardian?`, parent ${(D.priv[dup.id]||{}).guardian}`:""}.`;}
      throw userErr(`${dup.name} is already on your list. Open them from Learners instead, or tick the box if this is a different child.`);}}
  const rec={name,stage:f.stage.value,courses,...assignPatch(id?learner(id):null,f.trainer.value),uid:acct,parents:[...form.querySelectorAll('input[name="parents"]:checked')].map(x=>x.value)};
  lfBusy=true;
  try{
    let lid=id;
    if(id){rec.active=f.active?f.active.checked:true;const was=D.learners[id];if(was&&was.active!==false&&!rec.active)rec.leftAt=Date.now();if(was&&was.active===false&&rec.active)rec.leftAt=null;await S.db.doc("learners/"+id).update(rec);}
    else{lid=newId||S.db.collection("learners").doc().id;const was=D.learners[lid];await S.db.doc("learners/"+lid).set({...rec,active:true,code:(was&&was.code)||(f.code&&f.code.value)||genCode(),createdAt:(was&&was.createdAt)||Date.now()});}
    await upsert("private/"+lid,priv);
    if(fee>0)await upsert("fees/"+lid,{monthly:fee,start,dueDay:due});
    else if(D.fees[lid])await S.db.doc("fees/"+lid).update({monthly:0});
    if(!form.dataset.logged){form.dataset.logged="1";await audit(id?"Learner edited":"Learner added",name);}
  }finally{lfBusy=false;}
}

async function saveHw(f,form,h){

  const file=f.sheetfile&&f.sheetfile.files&&f.sheetfile.files[0];

  const body=`${fresh?`<p><b>Class scheduled.</b> Let families know:</p>`:""}

let ctSig={},ctT=null,ctUids=null;
function scheduleContactSync(){if(!S.isOwner||!S.db)return;clearTimeout(ctT);ctT=setTimeout(()=>syncContacts().catch(e=>console.warn("Little Lingos: contacts sync",e)),1500);}
async function syncContacts(){
  if(!["learners","trainers","priv","courses","batches"].every(k=>S.loaded.has(k)))return scheduleContactSync();
  if(!ctUids){const ix=await S.db.doc("contacts/index").get();ctUids=new Set((ix.exists&&ix.data().uids)||[]);}
  const want={};
  for(const t of activeTrainers()){if(!t.uid||t.uid===S.uid)continue;const o={};
    for(const L of teacherLearners(t.id)){const pv=D.priv[L.id]||{};if(pv.phone||pv.email)o[L.id]={name:L.name,guardian:pv.guardian||"",phone:pv.phone||"",email:pv.email||""};}
    want[t.uid]=o;}
  for(const uid of ctUids)if(!(uid in want))want[uid]={};
  for(const [uid,o] of Object.entries(want)){
    const sig=JSON.stringify(o); if(ctSig[uid]===sig)continue;
    const col=S.db.collection(`contacts/${uid}/l`); const snap=await col.get(); const have={};for(const d of snap.docs)have[d.id]=d.data();
    for(const [lid,v] of Object.entries(o))if(JSON.stringify(have[lid])!==JSON.stringify(v))await col.doc(lid).set(v);
    for(const lid of Object.keys(have))if(!o[lid])await col.doc(lid).delete();
    ctSig[uid]=sig;
  }
  const next=Object.keys(want).filter(u=>Object.keys(want[u]).length).sort();
  if(JSON.stringify(next)!==JSON.stringify([...ctUids].sort()))await S.db.doc("contacts/index").set({uids:next});
  ctUids=new Set(next);
  await syncPay();
}

function chatBubble(x){const mine=x.by===S.uid;const who=mine?"You":(x.from==="staff"?(x.name||byWho(x.by)):accountName(x.by));
  return `<div class="bub ${mine?"me":""}"><div class="bt">${x.hidden?`<i class="muted">Message hidden by the academy</i>`:esc(x.text)}</div><div class="bm">${esc(who)} · ${esc(x.at?fmtDay(new Date(x.at))+", "+fmtTime(new Date(x.at)):"")}</div></div>`;}

async function bumpPPI(uid,extra){await upsert("ppi/"+uid,{at:Date.now(),...(extra||{})});}
document.addEventListener("submit",async e=>{
  const f=e.target; if(f.id!=="pchat"&&f.id!=="schat")return; e.preventDefault();
  const t=f.elements.t.value.trim(); if(!t){f.elements.t.focus();return}
  const btn=f.querySelector("button[type=submit]");btn.disabled=true;
  const staff=f.id==="schat", uid=staff?f.dataset.uid:S.uid, lid=f.dataset.lid;
  const ok=await save(async()=>{
    await S.db.collection(`pp/${uid}/x`).doc().set({kind:"chat",lid,text:t,by:S.uid,from:staff?"staff":"parent",name:myName(),at:Date.now()});
    await bumpPPI(uid,staff?{staffAt:Date.now()}:{name:myName(),parentAt:Date.now()});
  });
  btn.disabled=false; if(ok){f.elements.t.value="";document.activeElement.blur();if(staff)refreshThread(uid);render(true);setTimeout(()=>{const th=document.getElementById("thread");if(th)th.scrollTop=th.scrollHeight;},50);}
});

const ppFetched={};
async function refreshThread(uid){try{const snap=await S.db.collection(`pp/${uid}/x`).get();const o={};for(const d of snap.docs)o[d.id]=d.data();D.pp[uid]=o;schedule();}catch(e){}}

function visibleFamilies(){
  const uids=new Set([...Object.keys(D.ppi),...Object.keys(D.pp)].filter(u=>u!==S.uid));
  if(role()==="admin")return [...uids];
  const mine=new Set(teacherLearners(myTid()).map(L=>L.id));
  return [...uids].filter(u=>childrenOf(u).some(id=>mine.has(id))||Object.values(D.pp[u]||{}).some(x=>x&&x.lid&&mine.has(x.lid)));
}
function famItems(kind){const out=[];for(const uid of visibleFamilies())for(const [id,x] of Object.entries(D.pp[uid]||{}))if(x&&(!kind||x.kind===kind))out.push({...x,id,uid});return out;}
function threads(){const map=new Map();for(const x of famItems("chat")){const k=x.uid+"|"+(x.lid||"");if(!map.has(k))map.set(k,[]);map.get(k).push(x);}
  const mine=role()==="admin"?null:new Set(teacherLearners(myTid()).map(L=>L.id));
  return [...map].filter(([k])=>!mine||mine.has(k.split("|")[1])).map(([k,ms])=>{ms.sort((a,b)=>(a.at||0)-(b.at||0));const last=ms[ms.length-1];return {k,uid:k.split("|")[0],lid:k.split("|")[1],ms,last,needs:last.from==="parent"};}).sort((a,b)=>(b.last.at||0)-(a.last.at||0));}
function openReqs(){const mine=role()==="admin"?null:new Set(teacherLearners(myTid()).map(L=>L.id));return famItems("req").filter(x=>!mine||(x.lid&&mine.has(x.lid))||x.type==="ticket"&&!x.lid);}

function staffInbox(){

/* ---------- admin keeps each parent's fee summary in sync ---------- */
const pfSig={}; let pfT=null;
function schedulePF(){if(!S.isOwner||!S.db)return;clearTimeout(pfT);pfT=setTimeout(()=>syncPF().catch(e=>console.warn("Little Lingos: fee sync",e)),2000);}
async function syncPF(){
  if(!["learners","profiles","fees","config"].every(k=>S.loaded.has(k)))return schedulePF();
  const cur=thisMonth(), acad=ACAD();
  for(const [uid,p] of Object.entries(D.profiles)){
    if(!p||p.role!=="parent")continue;
    const kids={};
    for(const lid of childrenOf(uid)){const fi=feeInfo(lid,cur);const f=D.fees[lid];if(!fi||!f)continue;
      const used=attendanceOf(lid,cur).t;
      const paidCur=fi.paidM>=fi.owedM;const nd=paidCur?shiftMonth(cur,1):cur;
      const months=monthsFromTo(f.start,cur).slice(-12).reverse();
      const paidFor=m=>fi.pays.filter(x=>x.month===m).reduce((s,x)=>s+(+x.amount),0);
      kids[lid]={plan:f.plan||"",monthly:fi.monthly,classes:+f.classes||0,start:f.start,dueDay:fi.dueDay,used,statusK:fi.status.k,statusLabel:fi.status.label,statusCls:fi.status.cls,balance:fi.balance,remainingM:fi.remainingM,
        nextDue:fi.owedM?`${nd}-${pad(fi.dueDay)}`:`${f.start}-${pad(fi.dueDay)}`,invoices:months.map(m=>({month:m,amount:fi.monthly,paid:paidFor(m)})),
        pays:fi.pays.slice(0,24).map(x=>({id:x.id,amount:+x.amount,month:x.month,date:x.date||"",method:x.method||"",note:x.note||""}))};}
    const body={kids,academy:acad,credits:creditBal(uid)}; const sig=JSON.stringify(body);
    if(pfSig[uid]===sig)continue;
    if(pfSig[uid]===undefined){const d=await S.db.doc("pf/"+uid).get();const ex=d.exists?d.data():null;if(ex&&JSON.stringify({kids:ex.kids,academy:ex.academy,credits:ex.credits})===sig){pfSig[uid]=sig;continue;}}
    await S.db.doc("pf/"+uid).set({...body,at:Date.now()}); pfSig[uid]=sig;
  }
}

/* recorder */
const REC={mr:null,stream:null,t:null};
const canRecord=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
async function startRec(maxSec,onDone){
  try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});}catch(e){toast("Pip can't hear you. Allow the microphone for this page, then try again.",true);return false}
  let opts={};for(const m of ["audio/webm;codecs=opus","audio/mp4","audio/ogg;codecs=opus"]){if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)){opts={mimeType:m,audioBitsPerSecond:24000};break}}
  const chunks=[];const mr=new MediaRecorder(REC.stream,opts);REC.mr=mr;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{clearTimeout(REC.t);recPillOff();try{REC.stream.getTracks().forEach(t=>t.stop())}catch{}REC.mr=null;const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});const fr=new FileReader();fr.onload=()=>onDone(fr.result,blob.size);fr.readAsDataURL(blob);};
  mr.start();recPill(maxSec);REC.t=setTimeout(()=>{if(mr.state==="recording")mr.stop()},maxSec*1000);return true;
}
const stopRec=()=>{if(REC.mr&&REC.mr.state==="recording")REC.mr.stop();};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const norm=t=>String(t||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^\p{L}\p{N} ]/gu,"").trim();
function say(w,lang){if(!canSpeak())return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang=lang||"en-IN";u.rate=.8;speechSynthesis.speak(u);}catch{}}

  else ws=wordsWithMeaning(L.uid).length?wordsWithMeaning(L.uid):courseVocab(L);
  if(!ws.length){toast("No words to practise yet.",true);return}
  S.drill={ws,i:0,clip:null,heard:null,keep:false,recording:false};drillModal();};
function drillModalOld(){const d=S.drill;if(!d)return;const x=d.ws[d.i];
  openModal("Repeat after me",`<div class="drill"><span class="pill p-mute">Word ${d.i+1} of ${d.ws.length}</span><b class="dword">${esc(x.w)}</b><span class="dmean">${esc(x.m||"")}</span>

    ${d.clip?`<label class="row" style="font-weight:700"><input type="checkbox" data-mact="keep" ${d.keep?"checked":""} style="width:22px;height:22px;accent-color:var(--leafMid)"> Keep this in my portfolio</label>`:""}
    ${!canRecord()?`<p class="small muted">This device can't record here, so just say the word out loud after Pip.</p>`:""}</div>`,
  {noFocus:true,footerExtra:`${d.i>0?`<button type="button" class="btn btn-ghost" data-mact="prev">${ic("back")}Back</button>`:""}<button type="button" class="btn btn-leaf" data-mact="next">${d.i<d.ws.length-1?"Next word":"Finish"} ${ic("fwd")}</button>`,
  actions:{listen:()=>say(x.w,x.lang),
    rec:async()=>{if(d.recording){stopRec();return}
      d.clip=null;d.heard=null;
      const ok=await startRec(6,async(url,size)=>{d.recording=false;d.clip=url;d.size=size;drillModal();earn({recs:(+progOf(S.uid).recs||0)+1}).catch(()=>{});});
      if(!ok)return; d.recording=true;drillModal();
      if(SR){try{const r=new SR();r.lang=x.lang||"en-IN";r.maxAlternatives=3;r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);d.heard=alts.find(a=>norm(a)===norm(x.w))||alts[0]||"";wkLog(x.w,norm(d.heard)===norm(x.w));if(!d.recording)drillModal();};r.onerror=()=>{};r.start();setTimeout(()=>{try{r.stop()}catch{}},6000);}catch{}}},
    keep:()=>{d.keep=!d.keep;drillModal();},
    prev:()=>{saveDrillClip();d.i--;d.clip=null;d.heard=null;d.keep=false;drillModal();},
    next:()=>{saveDrillClip();if(d.i<d.ws.length-1){d.i++;d.clip=null;d.heard=null;d.keep=false;drillModal();}else{S.drill=null;closeModal();toast("Great speaking! 🎤");}}}});}

/* ---------- Games, quizzes, daily challenge ---------- */
function buildQs(pool,n,r,kinds){const qs=[];for(const x of shuffle(pool.slice(),r).slice(0,Math.min(n,pool.length))){const others=shuffle(pool.filter(y=>y.m!==x.m&&y.w!==x.w),r).slice(0,3);const k=kinds[Math.floor(r()*kinds.length)];
  if(k==="listen")qs.push({k,say:x.w,lang:x.lang,prompt:"Listen! Which word did Pip say?",opts:shuffle([x,...others],r).map(o=>o.w),ans:x.w});
  else qs.push({k:"mean",say:x.w,lang:x.lang,prompt:`What does “${x.w}” mean?`,opts:shuffle([x,...others],r).map(o=>o.m),ans:x.m});}return qs;}
A.startGame=type=>{const L=myLearner();if(!L)return;const pool=gamePool(L);
  if(type==="revise"){const qs=reviseGame(L);if(!qs){toast("Nothing to practise right now. Lovely work!");return}S.game={type,qs,i:0,score:0,pick:null};if(S.view!=="play")go("play");else render(true);if(qs[0].k==="listen")setTimeout(()=>say(qs[0].say,qs[0].lang),400);return;}
  if(pool.length<4){toast("Learn a few more words first! You need 4.",true);return}
  if(type==="daily"){if((progOf(S.uid).daily||{})[ymd(new Date())]!=null){toast("You've done today's challenge! 🎉");return}const r=rng(ymd(new Date())+S.uid);S.game={type,qs:buildQs(pool,5,r,["mean","listen"]),i:0,score:0,pick:null};}
  else if(type==="memory"){const ws=shuffle(pool.slice()).slice(0,6);const cards=shuffle(ws.flatMap((x,i)=>[{t:x.w,k:i,w:1},{t:x.m,k:i}]));S.game={type,cards,open:[],done:new Set(),moves:0};}
  else S.game={type,qs:buildQs(pool,8,Math.random,type==="listen"?["listen"]:["mean"]),i:0,score:0,pick:null};
  if(S.view!=="play")go("play");else render(true);
  const q=S.game.qs&&S.game.qs[0];if(q&&q.k==="listen")setTimeout(()=>say(q.say,q.lang),400);};
A.answer=v=>{const g=S.game;if(!g||g.pick!=null)return;const q=g.qs[g.i];g.pick=+v;if(q.opts[+v]===q.ans){g.score++;}wkLog(q.say,q.opts[+v]===q.ans);render(true);};
A.nextQ=async()=>{const g=S.game;if(!g)return;g.i++;g.pick=null;
  if(g.i>=g.qs.length){g.over=true;render(true);const perfect=g.score===g.qs.length;const stars=g.type==="daily"?g.score:Math.round(g.score/g.qs.length*3);
    const extra=g.type==="daily"?{daily:{[ymd(new Date())]:g.score}}:{pts:{["g"+Date.now().toString(36)]:stars}};if(perfect)extra.perfect=true;await save(()=>earn(extra));g.stars=stars;render(true);return}
  render(true);const q=g.qs[g.i];if(q.k==="listen")setTimeout(()=>say(q.say,q.lang),300);};
A.memTap=v=>{const g=S.game;if(!g||g.type!=="memory"||g.lock)return;const i=+v;if(g.done.has(i)||g.open.includes(i))return;g.open.push(i);
  if(g.open.length===2){g.moves++;const [a,b]=g.open;if(g.cards[a].k===g.cards[b].k){g.done.add(a);g.done.add(b);g.open=[];if(g.done.size===g.cards.length){g.over=true;const pairs=g.cards.length/2;g.stars=g.moves<=pairs+2?3:g.moves<=pairs+5?2:1;save(()=>earn({pts:{["m"+Date.now().toString(36)]:g.stars},...(g.moves===pairs?{perfect:true}:{})}));}}
    else{g.lock=true;setTimeout(()=>{g.open=[];g.lock=false;render(true)},900);}}
  render(true);};
A.endGame=()=>{S.game=null;render(true);};
A.sayQ=()=>{const g=S.game;if(g&&g.qs){const q=g.qs[g.i];say(q.say,q.lang);}};
function playView(){
  const L=myLearner(); if(!L)return pendingHTML(); const g=S.game;
  if(g&&g.over)return `<div class="center"><div class="card" style="align-items:center;text-align:center">${art("bloom",110,"Bloom")}<h1>${g.type==="memory"?"All pairs found!":`${g.score} of ${g.qs.length} right!`}</h1><p class="bigstars">${"⭐".repeat(g.stars||0)}${"☆".repeat(Math.max(0,(g.type==="daily"?5:3)-(g.stars||0)))}</p><p class="lede">You earned ${g.stars||0} star${g.stars===1?"":"s"}${g.type==="memory"?` in ${g.moves} moves`:""}.</p><div class="row" style="justify-content:center">${g.type!=="daily"?`<button class="btn btn-primary" data-act="startGame" data-id="${g.type}">Play again</button>`:""}<button class="btn btn-ghost" data-act="endGame">More games</button></div></div></div>`;
  if(g&&g.type==="memory")return `<div class="head"><div><h1>Memory pairs</h1><p class="lede">Find each word and its meaning. Moves: ${g.moves}</p></div><button class="btn btn-ghost btn-sm" data-act="endGame">Stop</button></div>
    <div class="memgrid">${g.cards.map((c,i)=>{const open=g.done.has(i)||g.open.includes(i);return `<button class="mem ${open?"open":""} ${g.done.has(i)?"done":""} ${c.w?"isw":""}" data-act="memTap" data-id="${i}" aria-label="${open?esc(c.t):"Hidden card"}">${open?esc(c.t):"🌱"}</button>`}).join("")}</div>`;
  if(g&&g.qs){const q=g.qs[g.i];const ansI=q.opts.indexOf(q.ans);
    return `<div class="head"><div><h1>${g.type==="daily"?"Daily challenge":g.type==="listen"?"Listen and pick":"Word quiz"}</h1><p class="lede">Question ${g.i+1} of ${g.qs.length} · ⭐ ${g.score}</p></div><button class="btn btn-ghost btn-sm" data-act="endGame">Stop</button></div>
    <section class="quiz"><div class="bar"><i style="width:${pctStr(g.i/g.qs.length)}"></i></div><h2>${esc(q.prompt)}</h2>${q.k==="listen"?`<button class="btn btn-sun btn-big" data-act="sayQ" style="align-self:center">${ic("sound",24)}Hear it again</button>`:canSpeak()?`<button class="iconbtn big" data-act="sayQ" aria-label="Hear the word" style="align-self:center">${ic("sound")}</button>`:""}
      <div class="qopts">${q.opts.map((o,i)=>`<button class="qopt ${g.pick!=null?(i===ansI?"right":i===g.pick?"wrong":""):""}" data-act="answer" data-id="${i}" ${g.pick!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>
      ${g.pick!=null?`<div class="qfb ${g.pick===ansI?"ok":""}">${g.pick===ansI?"🎉 Yes! Well done!":`The answer is “${esc(q.ans)}”.`}<button class="btn btn-primary" data-act="nextQ">${g.i<g.qs.length-1?"Next":"Finish"} ${ic("fwd")}</button></div>`:""}</section>`;}
  const dDone=(progOf(L.uid).daily||{})[ymd(new Date())]!=null, n=gamePool(L).length;
  return `<div class="head"><div><h1>Games</h1><p class="lede">Play with your words and win stars. ⭐ ${starsOf(L)} so far!</p></div></div>
  ${n<4?`<section class="alert a-sun"><b>Finish a lesson with word cards to unlock the games.</b></section>`:""}
  <div class="gamegrid">
    <button class="gamecard g0" data-act="startGame" data-id="daily" ${n<4?"disabled":""}><span>${dDone?"✅":"🎯"}</span><b>Daily challenge</b><i>${dDone?"Done today!":"5 questions · up to 5 stars"}</i></button>
    <button class="gamecard g1" data-act="startGame" data-id="quiz" ${n<4?"disabled":""}><span>❓</span><b>Word quiz</b><i>What does it mean?</i></button>
    <button class="gamecard g2" data-act="startGame" data-id="listen" ${n<4||!canSpeak()?"disabled":""}><span>👂</span><b>Listen and pick</b><i>Hear a word, find it</i></button>
    <button class="gamecard g3" data-act="startGame" data-id="memory" ${n<4?"disabled":""}><span>🃏</span><b>Memory pairs</b><i>Match words and meanings</i></button>
    <button class="gamecard g4" data-act="drill" ${n<1?"disabled":""}><span>🎤</span><b>Repeat after me</b><i>Listen, say it, hear yourself</i></button>
  </div>`;
}

function shrinkImage(src,maxW){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,maxW/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);let q=.8,out=cv.toDataURL("image/jpeg",q);while(out.length>230000&&q>.3){q-=.1;out=cv.toDataURL("image/jpeg",q);}res(out);};img.onerror=rej;img.src=src;});}

  <div class="padfoot"><div class="field" style="flex:1;min-width:0"><label for="pd-t">Name your picture</label><input type="text" id="pd-t" name="t" maxlength="60" placeholder="Name your picture"></div><button type="button" class="btn btn-ghost" data-mact="dl">Download</button></div>

  {wide:true,noFocus:true,submitLabel:"Save to my portfolio",done:"Saved to your portfolio!",
   actions:{
     col:(c,b,form)=>{PAD.c=c;PAD.tool="pen";padRefresh(form);},
     tool:(t,b,form)=>{PAD.tool=t;padRefresh(form);},
     size:(w,b,form)=>{PAD.w=+w;padRefresh(form);},
     undo:()=>{const cv=document.getElementById("pad");const h=PAD.hist.pop();if(h)cv.getContext("2d").putImageData(h,0,0);else toast("Nothing to undo.");},
     wipe:()=>{const cv=document.getElementById("pad");const cx=cv.getContext("2d");PAD.hist.push(cx.getImageData(0,0,cv.width,cv.height));if(PAD.hist.length>25)PAD.hist.shift();cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);},

   onOpen:()=>{const cv=document.getElementById("pad");const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.lineCap="round";cx.lineJoin="round";let down=false,last=null;
     const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
     const dot=p=>{cx.fillStyle=PAD.tool==="eraser"?"#fff":PAD.c;cx.beginPath();cx.arc(p[0],p[1],(PAD.tool==="eraser"?PAD.w*2.5:PAD.w)*(cv.width/cv.getBoundingClientRect().width)/2,0,Math.PI*2);cx.fill();};
     cv.addEventListener("pointerdown",e=>{e.preventDefault();down=true;last=pt(e);cv.setPointerCapture(e.pointerId);PAD.hist.push(cx.getImageData(0,0,cv.width,cv.height));if(PAD.hist.length>25)PAD.hist.shift();PAD.used=true;dot(last);});
     cv.addEventListener("pointermove",e=>{if(!down)return;const p=pt(e);cx.strokeStyle=PAD.tool==="eraser"?"#fff":PAD.c;cx.lineWidth=(PAD.tool==="eraser"?PAD.w*2.5:PAD.w)*(cv.width/cv.getBoundingClientRect().width);cx.beginPath();cx.moveTo(...last);cx.lineTo(...p);cx.stroke();last=p;});
     const up=()=>{down=false};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);cv.addEventListener("pointerleave",up);},
   onSubmit:async f=>{if(!PAD.used)throw userErr("Draw something first!");const cv=document.getElementById("pad");const sm=document.createElement("canvas");sm.width=800;sm.height=560;sm.getContext("2d").drawImage(cv,0,0,800,560);const out=await shrinkTo(sm.toDataURL("image/png"),1280,150000);PAD.used=false;await savePort("draw",f.t.value.trim()||"My drawing",out);}});};

    </div>

        <div class="stat f go" style="background:var(--sunSoft)" data-go="inbox" role="link" tabindex="0"><b class="num">${rq.length}</b><span>Reschedule requests</span></div>

/* ---------- Roster: each child's history before class ---------- */

A.availability=()=>{const st=settingsOf(S.uid),av=st.avail||{},rp=st.reply||{days:[1,2,3,4,5,6],from:"10:00",to:"18:00"};const order=[1,2,3,4,5,6,0];

  <div class="availgrid">${order.map(d=>{const r=av[d]||{};return `<label class="row" style="font-weight:700;flex-wrap:nowrap"><input type="checkbox" name="ad_${d}" ${r.from?"checked":""} style="width:20px;height:20px;accent-color:var(--leafMid)"> ${WDN[d]}</label><input type="time" name="af_${d}" value="${esc(r.from||"16:00")}" aria-label="${WDN[d]} from"><input type="time" name="at_${d}" value="${esc(r.to||"19:00")}" aria-label="${WDN[d]} to">`}).join("")}</div>

  <div class="two"><div class="field"><label for="rp-f">From</label><input type="time" id="rp-f" name="rf" value="${esc(rp.from||"10:00")}"></div><div class="field"><label for="rp-t">To</label><input type="time" id="rp-t" name="rt" value="${esc(rp.to||"18:00")}"></div></div>`,
  {wide:true,noFocus:true,done:"Saved",onSubmit:async f=>{const avail={};for(const d of order)if(f["ad_"+d].checked){if(f["af_"+d].value>=f["at_"+d].value)throw userErr(`${WDN[d]}: the end time must be after the start time.`);avail[d]={from:f["af_"+d].value,to:f["at_"+d].value};}

A.approveReq=v=>{const [uid,id]=v.split("|");const x=(D.pp[uid]||{})[id];if(!x)return;const s=x.sid&&D.sessions[x.sid];const L=learner(x.lid);
  const d=s?new Date(s.startsAt):new Date(Date.now()+864e5);
  openModal(`Approve reschedule · ${L?firstOf(L.name):"learner"}`,`<p class="small muted">${esc(reqSummary({...x,uid}))}${x.text?` · “${esc(x.text)}”`:""}</p>${availText(S.uid)?`<p class="small">Your availability: ${esc(availText(S.uid))}</p>`:""}
   <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">How?</legend><div class="choice"><label><input type="radio" name="how" value="makeup" checked><b>Make-up class</b><span>A separate class just for ${esc(L?firstOf(L.name):"this learner")}</span></label>${s?`<label><input type="radio" name="how" value="move"><b>Move the whole class</b><span>Everyone in “${esc(s.title||"the class")}” moves</span></label>`:""}</div></fieldset>
   <div class="two"><div class="field"><label for="ap-d">New start</label><input type="datetime-local" id="ap-d" name="d" required data-label="New start" value="${esc(toLocalInput(d))}"></div><div class="field"><label for="ap-m">Minutes</label><input type="number" id="ap-m" name="m" min="10" max="240" step="5" value="${esc((s&&s.durationMin)||40)}"></div></div>
   <div class="field"><label for="ap-r">Message to the parent</label><textarea id="ap-r" name="r" rows="2" maxlength="600"></textarea></div>`,
  {wide:true,submitLabel:"Approve",done:"Approved. The parent can see the new time.",onSubmit:async f=>{const nd=new Date(f.d.value);if(isNaN(nd))throw userErr("Pick the new time.");const mins=+f.m.value||40;
    let msg;
    if(f.how.value==="move"&&s){await S.db.doc("sessions/"+x.sid).update({startsAt:nd.toISOString(),durationMin:mins});msg=`Moved “${s.title||"the class"}” to ${fmtDay(nd)}, ${fmtTime(nd)}.`;}
    else{const base=s||{courseId:L&&learnerCourses(L)[0],title:"Make-up class"};await S.db.collection("sessions").doc().set({courseId:base.courseId,trainerId:(s&&s.trainerId)||myTid()||null,title:`Make-up: ${base.title||"class"}`,startsAt:nd.toISOString(),durationMin:mins,joinUrl:(s&&s.joinUrl)||"",notes:"",topic:(s&&s.topic)||"",forLids:(()=>{if(!x.lid)throw userErr("This request has no learner, so a make-up class can't be booked. Move the class instead.");return [x.lid];})(),makeup:true,createdBy:S.uid,createdAt:Date.now()});msg=`Make-up class booked for ${fmtDay(nd)}, ${fmtTime(nd)}.`;}
    const r=f.r.value.trim();await S.db.doc(`pp/${uid}/x/${id}`).update({status:"done",reply:(r?r+" ":"")+msg,replyBy:S.uid,replyName:myName(),replyAt:Date.now()});await bumpPPI(uid,{staffAt:Date.now()});refreshThread(uid);}});};

A.newLeave=sid=>{const tid=myTid();if(!tid){toast("Only trainers can request leave.",true);return}const s=sid&&D.sessions[sid];const d0=s?ymd(new Date(s.startsAt)):ymd(new Date(Date.now()+864e5));

   <div class="two"><div class="field"><label for="lv-f">From</label><input type="date" id="lv-f" name="from" required data-label="From" value="${esc(d0)}"></div><div class="field"><label for="lv-t">To</label><input type="date" id="lv-t" name="to" required data-label="To" value="${esc(d0)}"></div></div>
   <div class="field"><label for="lv-r">Reason</label><input type="text" id="lv-r" name="reason" maxlength="160" required data-label="Reason" placeholder="e.g. Family wedding"></div>

    await S.db.collection(`tw/${S.uid}/x`).doc().set({kind:"leave",type:f.kind.value,tid,from:f.from.value,to:f.to.value,reason:f.reason.value.trim(),sids,status:"pending",at:Date.now()});}});};
function leaveCard(){const ls=txAll("leave").filter(l=>l.to>=ymd(new Date(Date.now()-7*864e5))).sort((a,b)=>(a.status==="pending"?0:1)-(b.status==="pending"?0:1)||String(a.from).localeCompare(String(b.from)));if(!ls.length)return "";
  return `<section class="card panel"><h2>Leave and substitute requests</h2><div class="list">${ls.map(l=>`<div class="item"><div class="grow"><div class="t">${esc(trainerName(l.tid))} · ${l.type==="sub"?"Substitute":"Leave"}</div><div class="s">${esc(fmtDay(new Date(l.from+"T12:00")))}${l.to!==l.from?` – ${esc(fmtDay(new Date(l.to+"T12:00")))}`:""} · ${esc(l.reason||"")} · ${(l.sids||[]).length} class${(l.sids||[]).length===1?"":"es"}</div></div><span class="pill ${l.status==="approved"?"p-good":l.status==="declined"?"p-bad":"p-warn"}">${esc(l.status==="approved"?"Approved":l.status==="declined"?"Declined":"Pending")}</span>${l.status==="pending"&&S.isOwner?`<button class="btn btn-primary btn-sm" data-act="decideLeave" data-id="${esc(l.uid+"|"+l.id)}">Review</button>`:""}</div>`).join("")}</div></section>`;}
A.decideLeave=v=>{const [uid,id]=v.split("|");const l=txOf(uid,id);if(!l)return;const ss=(l.sids||[]).map(sid=>byId(D.sessions,sid)).filter(Boolean);const others=activeTrainers().filter(t=>t.id!==l.tid);
  openModal(`${trainerName(l.tid)} · ${l.type==="sub"?"substitute":"leave"}`,`<p>${esc(fmtDay(new Date(l.from+"T12:00")))}${l.to!==l.from?` – ${esc(fmtDay(new Date(l.to+"T12:00")))}`:""} · ${esc(l.reason||"")}</p>
   ${ss.length?`<p class="section-title">Substitutes</p>${ss.map(s=>`<div class="field"><label for="sb-${esc(s.id)}">${esc(fmtDay(new Date(s.startsAt)))}, ${esc(fmtTime(new Date(s.startsAt)))} · ${esc(s.title||"Class")}</label><select id="sb-${esc(s.id)}" name="sb_${esc(s.id)}">${opt("","No substitute (cancel or keep)")}${others.map(t=>{const a=availText(t.uid);return opt(t.id,`${t.name}${a?` · ${a}`:""}`)}).join("")}</select></div>`).join("")}`:`<p class="small muted">No classes in these dates.</p>`}
   <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">Decision</legend><div class="choice"><label><input type="radio" name="dec" value="approved" checked><b>Approve</b><span>${l.type==="sub"?"Assign substitutes":"Marks leave on the timesheet"}</span></label><label><input type="radio" name="dec" value="declined"><b>Decline</b><span>Explain below</span></label></div></fieldset>
   <div class="field"><label for="lv-n">Note to ${esc(firstOf(trainerName(l.tid)))}</label><input type="text" id="lv-n" name="n" maxlength="160"></div>`,
  {wide:true,submitLabel:"Save decision",done:"Decision saved",onSubmit:async f=>{const dec=f.dec.value,subs={};
    if(dec==="approved"){for(const s of ss){const t=f["sb_"+s.id]&&f["sb_"+s.id].value;if(t){subs[s.id]=t;await S.db.doc("sessions/"+s.id).update({trainerId:t,subFor:l.tid});}}
      if(l.type!=="sub"){const key=tsKeyOf(l.tid);let d=new Date(l.from+"T12:00");const end=new Date(l.to+"T12:00");let n=0;while(d<=end&&n<60){await S.db.collection(`timesheets/${key}/e`).doc().set({date:ymd(d),status:"leave",startAt:null,endAt:null,at:Date.now(),by:S.uid,note:l.reason||""});d.setDate(d.getDate()+1);n++;}}}
    await S.db.doc(`tw/${uid}/x/${id}`).update({status:dec,subs,reply:f.n.value.trim(),decidedAt:Date.now()});}});};

function reportData(L,from,to){const inR=d=>{const k=ymd(new Date(d));return k>=from&&k<=to;};
  const hist=kidHistory(L).filter(h=>inR(h.date)),att=hist.filter(h=>h.st!=="absent").length;
  const words=wordsWithMeaning(L.uid).filter(w=>w.ts&&inR(w.ts));
  const hs=hwFor(L).filter(h=>{const a=answerOf(L,h);return a&&inR(a.at)});const stars=hs.map(h=>+(replyOf(L,h)||{}).stars||0).filter(Boolean);
  const as=assessFor(L).filter(a=>inR(a.at))[0]||assessFor(L)[0]||null;const lessons=doneList(L.uid).filter(x=>inR(x.ts)).length;
  return {classes:hist.length,attended:att,rate:hist.length?att/hist.length:null,words:words.length,wordList:words.slice(0,30).map(w=>w.w),hw:hs.length,hwStars:stars.length?(stars.reduce((a,b)=>a+b,0)/stars.length).toFixed(1):null,lessons,skills:as&&as.skills||null,level:as&&as.level||"",badges:badgesOf(L).filter(b=>b.ok).map(b=>b.e+" "+b.t).concat(awardsFor(L).filter(a=>a.badge&&inR(a.at)).map(a=>a.badge.join(" ")))};}

}

function parseCSV(text){const rows=[];let row=[],cur="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c;}else if(c==='"')q=true;else if(c===","){row.push(cur);cur="";}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);if(row.some(x=>x.trim()))rows.push(row);row=[];cur="";}else cur+=c;}row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows;}

function zonedDate(dateStr,timeStr,tz){const [y,mo,d]=dateStr.split("-").map(Number),[h,mi]=timeStr.split(":").map(Number);const want=Date.UTC(y,mo-1,d,h,mi);let t=want;
  for(let i=0;i<3;i++){let p;try{p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date(t)).map(x=>[x.type,x.value]));}catch{return new Date(`${dateStr}T${timeStr}`)}
    const got=Date.UTC(+p.year,+p.month-1,+p.day,(+p.hour)%24,+p.minute);t+=want-got;if(want===got)break;}return new Date(t);}
const tzShort=tz=>{try{return (new Intl.DateTimeFormat("en-US",{timeZone:tz,timeZoneName:"short"}).formatToParts(new Date()).find(p=>p.type==="timeZoneName")||{}).value||tz}catch{return tz}};

function suggestStage(age,skills){const base=stageForAge(age);const vals=Object.values(skills||{}).map(Number).filter(Boolean);if(!vals.length)return base;const avg=vals.reduce((a,b)=>a+b,0)/vals.length;const order=["Seeds","Sprouts","Blooms"];let i=order.indexOf(base);if(avg<2.2&&i>0)i--;else if(avg>=4.6&&i<2)i++;return order[i];}

const batchSessions=bid=>entries(D.sessions).filter(s=>s.batchId===bid).sort((a,b)=>String(a.startsAt).localeCompare(String(b.startsAt)));
function batchWhen(b){const days=(b.days||[]).slice().sort((x,y)=>WD_ORDER.indexOf(x)-WD_ORDER.indexOf(y)).map(d=>WDN[d]).join(", ");const any=batchSessions(b.id).find(s=>sessEnd(s)>Date.now());
  return `${days||"No days"} · ${fmtHM(b.time)} ${tzShort(b.tz||DEF_TZ())}${any?` (your time ${fmtTime(new Date(any.startsAt))})`:""}`;}
function batchesView(){
  const bs=batchList();
  return `<div class="head"><div><h1>Batches</h1><p class="lede">Group and one-to-one batches: the trainer, the learners and a weekly time in the family's time zone. Classes are created for the weeks ahead.</p></div><button class="btn btn-primary" data-act="newBatch">${ic("plus")}New batch</button></div>
  ${bs.length?`<section class="card panel"><div class="tablewrap"><table><thead><tr><th>Batch</th><th>Schedule</th><th>Trainer</th><th>Learners</th><th>Classes ahead</th><th></th></tr></thead><tbody>${bs.map(b=>{const fut=batchSessions(b.id).filter(s=>sessEnd(s)>Date.now());const c=D.courses[b.courseId];
    return `<tr><td><b>${esc(b.name)}</b><div class="small muted">${b.type==="1:1"?"One-to-one":"Group"} · ${esc(c?c.title:"No course")} · ${b.dur||40} min</div></td><td class="small">${esc(batchWhen(b))}</td>
     <td><select class="inline" data-change="batchTrainer" data-id="${esc(b.id)}" aria-label="Trainer for ${esc(b.name)}">${opt("","Unassigned",!b.tid)}${activeTrainers().map(t=>opt(t.id,t.name,t.id===b.tid)).join("")}</select></td>
     <td class="small">${(b.learners||[]).filter(id=>D.learners[id]).map(id=>esc(firstOf(learnerName(id)))).join(", ")||'<span class="muted">None</span>'}</td>
     <td class="num">${fut.length}${fut[0]?`<div class="small muted">Next ${esc(fmtDay(new Date(fut[0].startsAt)))}</div>`:""}</td>
     <td><div class="acts"><button class="btn btn-ghost btn-sm" data-act="genBatch" data-id="${esc(b.id)}">Add weeks</button><button class="iconbtn" data-act="editBatch" data-id="${esc(b.id)}" aria-label="Edit batch">${ic("edit")}</button></div></td></tr>`}).join("")}</tbody></table></div>
    <p class="small muted">Changing a batch's trainer moves all its future classes to the new trainer. Holidays from Settings are skipped.</p></section>`
    :emptyBox("No batches yet","Create a batch: pick the course, trainer, learners and weekly time. Little Lingos creates the classes for you.",`<button class="btn btn-primary" data-act="newBatch">${ic("plus")}New batch</button>`,"bloom")}`;
}
function batchForm(b={}){const tz=b.tz||DEF_TZ();const mine=new Set(b.learners||[]);const start=b.start||ymd(new Date(Date.now()+864e5));
  return `<div class="two"><div class="field"><label for="bt-n">Batch name</label><input type="text" id="bt-n" name="name" required maxlength="60" data-label="Name" value="${esc(b.name||"")}" placeholder="e.g. Sprouts · Mon/Wed 5 pm"></div>
   <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">Type</legend><div class="seg"><label><input type="radio" name="type" value="group" ${b.type!=="1:1"?"checked":""}><span class="present">Group</span></label><label><input type="radio" name="type" value="1:1" ${b.type==="1:1"?"checked":""}><span class="present">One-to-one</span></label></div></fieldset></div>
  <div class="two"><div class="field"><label for="bt-c">Course</label><select id="bt-c" name="cid" required>${courseList().map(c=>opt(c.id,c.title,c.id===b.courseId)).join("")}</select></div><div class="field"><label for="bt-t">Trainer</label><select id="bt-t" name="tid">${opt("","Unassigned",!b.tid)}${activeTrainers().map(t=>opt(t.id,`${t.name}${availText(t.uid)?` · ${availText(t.uid)}`:""}`,t.id===b.tid)).join("")}</select></div></div>
  <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">Days</legend><div class="row">${WD_ORDER.map(d=>`<label class="row" style="gap:4px;font-weight:700"><input type="checkbox" name="d_${d}" ${(b.days||[]).includes(d)?"checked":""} style="width:20px;height:20px;accent-color:var(--leafMid)">${WDN[d]}</label>`).join("")}</div></fieldset>
  <div class="three"><div class="field"><label for="bt-h">Start time</label><input type="time" id="bt-h" name="time" required value="${esc(b.time||"17:00")}"></div><div class="field"><label for="bt-z">In time zone</label><select id="bt-z" name="tz">${TZ_OPTS().map(([v,l])=>opt(v,l,v===tz)).join("")}</select></div><div class="field"><label for="bt-m">Length</label><select id="bt-m" name="dur">${DURATIONS().map(n=>opt(n,`${n} minutes`,+n===+(b.dur||40))).join("")}</select></div></div>
  <div class="three"><div class="field"><label for="bt-s">First week from</label><input type="date" id="bt-s" name="start" required value="${esc(start)}"></div><div class="field"><label for="bt-w">Weeks to create</label><input type="number" id="bt-w" name="weeks" min="0" max="26" value="${b.id?0:8}"></div><div class="field"><label for="bt-u">Meeting link</label><input type="url" id="bt-u" name="url" value="${esc(b.url||"")}" placeholder="https://…"></div></div>
  <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">Learners</legend><div class="checks">${activeLearners().map(L=>`<label><input type="checkbox" name="lids" value="${esc(L.id)}" ${mine.has(L.id)?"checked":""}>${esc(L.name)}<span class="small muted">${esc(L.stage||"")}</span></label>`).join("")}</div><span class="hint">Learners are added to the course, and only they (and their parents) see the batch's classes.</span></fieldset>
  ${b.id?`<label class="row" style="font-weight:700;flex-wrap:nowrap"><input type="checkbox" name="rebuild" style="width:20px;height:20px;accent-color:var(--leafMid)"> Rebuild future classes with this day and time</label>`:""}`;}
function batchData(f,form){const days=WD_ORDER.filter(d=>f["d_"+d].checked);if(!days.length)throw userErr("Pick at least one day.");const u=f.url.value.trim();if(u&&!safeUrl(u))throw userErr("The meeting link must start with https://");
  const lids=[...form.querySelectorAll('input[name="lids"]:checked')].map(x=>x.value);if(!lids.length)throw userErr("Pick at least one learner for this batch. Its classes only reach the learners in it.");if(f.type.value==="1:1"&&lids.length>1)throw userErr("A one-to-one batch has one learner.");
  return {name:f.name.value.trim(),type:f.type.value,courseId:f.cid.value,tid:f.tid.value||null,days,time:f.time.value,tz:f.tz.value,dur:+f.dur.value||40,start:f.start.value,url:safeUrl(u),learners:lids};}
async function genBatchClasses(bid,b,fromDate,weeks){if(!weeks)return 0;if(!(b.learners||[]).length)throw userErr("Add learners to this batch before adding classes.");const have=new Set(batchSessions(bid).map(s=>new Date(s.startsAt).getTime()));let n=0;const [y,m,d]=fromDate.split("-").map(Number);
  for(let i=0;i<weeks*7;i++){const dt=new Date(Date.UTC(y,m-1,d+i));const key=dt.toISOString().slice(0,10);if(!b.days.includes(dt.getUTCDay())||holidayOn(key))continue;const at=zonedDate(key,b.time,b.tz);if(at.getTime()<Date.now()||have.has(at.getTime()))continue;
    await S.db.collection("sessions").doc().set({courseId:b.courseId,trainerId:b.tid,title:b.name,startsAt:at.toISOString(),durationMin:b.dur,joinUrl:b.url||"",notes:"",batchId:bid,forLids:b.learners.slice(),createdBy:S.uid,createdAt:Date.now()});n++;}return n;}
async function syncBatchLearners(b,oldTid){for(const id of b.learners||[]){const L=learner(id);if(!L)continue;const up={};if(b.courseId&&!(L.courses||[]).includes(b.courseId))up.courses=[...(L.courses||[]),b.courseId];
  if(b.tid&&(!L.trainerId||(oldTid&&L.trainerId===oldTid&&oldTid!==b.tid)))Object.assign(up,assignPatch(L,b.tid));if(Object.keys(up).length)await S.db.doc("learners/"+id).update(up);}}
async function addToBatch(bid,lid){const b=D.batches[bid];if(!b)return;const ls=[...new Set([...(b.learners||[]),lid])];await S.db.doc("batches/"+bid).update({learners:ls});
  for(const s of batchSessions(bid))if(sessEnd(s)>Date.now())await S.db.doc("sessions/"+s.id).update({forLids:ls});const L=learner(lid);if(L){const up={};if(!(L.courses||[]).includes(b.courseId))up.courses=[...(L.courses||[]),b.courseId];if(b.tid&&!L.trainerId)Object.assign(up,assignPatch(L,b.tid));if(Object.keys(up).length)await S.db.doc("learners/"+lid).update(up);}}
async function removeFromBatch(bid,lid){const b=D.batches[bid];if(!b)return;const ls=(b.learners||[]).filter(x=>x!==lid);if(!ls.length)throw userErr("A batch needs at least one learner. Add another learner first, or delete the batch.");await S.db.doc("batches/"+bid).update({learners:ls});for(const s of batchSessions(bid))if(sessEnd(s)>Date.now())await S.db.doc("sessions/"+s.id).update({forLids:ls});}
A.newBatch=()=>{if(!courseList().length){toast("Create a course first.",true);return}openModal("New batch",batchForm(),{wide:true,submitLabel:"Create batch",onSubmit:async(f,form)=>{const b=batchData(f,form);const ref=S.db.collection("batches").doc();await ref.set({...b,at:Date.now()});await syncBatchLearners(b);const n=await genBatchClasses(ref.id,b,b.start,+f.weeks.value||0);await audit("Batch created",b.name);toast(`Batch created with ${n} class${n===1?"":"es"}`);}});};
A.editBatch=id=>{const b0=byId(D.batches,id);if(!b0)return;openModal("Edit "+b0.name,batchForm(b0),{wide:true,submitLabel:"Save batch",footerExtra:`<button type="button" class="btn btn-ghost" data-mact="del">${ic("trash")}Delete batch</button>`,
  actions:{del:()=>{closeModal();openModal("Delete "+b0.name+"?",`<p>Its future classes are cancelled. Past classes and attendance stay.</p>`,{danger:true,submitLabel:"Delete batch",done:"Batch deleted",onSubmit:async()=>{for(const s of batchSessions(id))if(new Date(s.startsAt).getTime()>Date.now())await S.db.doc("sessions/"+s.id).delete();await S.db.doc("batches/"+id).delete();await audit("Batch deleted",b0.name);}});}},
  onSubmit:async(f,form)=>{const b=batchData(f,form);const oldTid=D.batches[id]?.tid||null;await S.db.doc("batches/"+id).update(b);await syncBatchLearners(b,oldTid);const fut=batchSessions(id).filter(s=>new Date(s.startsAt).getTime()>Date.now());
    if(f.rebuild.checked){for(const s of fut)await S.db.doc("sessions/"+s.id).delete();const n=await genBatchClasses(id,{...b,id},ymd(new Date()),Math.max(1,Math.ceil(fut.length/Math.max(1,b.days.length))));toast(`Rebuilt ${n} future class${n===1?"":"es"}`);}
    else{for(const s of fut)await S.db.doc("sessions/"+s.id).update({trainerId:b.tid,forLids:b.learners,joinUrl:b.url||s.joinUrl||"",durationMin:b.dur,title:b.name,courseId:b.courseId});const n=await genBatchClasses(id,{...b,id},b.start,+f.weeks.value||0);toast(n?`Saved and added ${n} class${n===1?"":"es"}`:"Batch saved");}}});};
A.genBatch=id=>{const b=byId(D.batches,id);if(!b)return;const last=batchSessions(id).slice(-1)[0];const from=last?ymd(new Date(new Date(last.startsAt).getTime()+864e5)):ymd(new Date());
  openModal("Add weeks · "+b.name,`<div class="two"><div class="field"><label for="gw-f">From</label><input type="date" id="gw-f" name="from" value="${esc(from)}"></div><div class="field"><label for="gw-w">Weeks</label><input type="number" id="gw-w" name="weeks" min="1" max="26" value="4"></div></div>`,{submitLabel:"Create classes",onSubmit:async f=>{const n=await genBatchClasses(id,b,f.from.value,+f.weeks.value||1);toast(`${n} class${n===1?"":"es"} added`);}});};
A.batchTrainer=(id,v)=>save(async()=>{const oldTid=D.batches[id]?.tid||null;await S.db.doc("batches/"+id).update({tid:v||null});await syncBatchLearners({...D.batches[id],tid:v||null},oldTid);for(const s of batchSessions(id))if(new Date(s.startsAt).getTime()>Date.now())await S.db.doc("sessions/"+s.id).update({trainerId:v||null});await audit("Batch trainer changed",`${D.batches[id]?.name}: ${trainerName(v)}`);},`Future classes moved to ${v?trainerName(v):"no trainer"}`);

/* ---------- Approvals: batch change and teacher change ---------- */
A.approveBatch=v=>{const [uid,id]=v.split("|");const x=(D.pp[uid]||{})[id];if(!x)return;const L=learner(x.lid);if(!L)return;const cur=batchOfL(L.id);
  openModal("Batch change · "+L.name,`<p class="small muted">${esc(x.prefer||"")}${x.text?` · “${esc(x.text)}”`:""}</p><p>Now in: <b>${cur.map(b=>esc(b.name)).join(", ")||"no batch"}</b></p>
   <div class="field"><label for="ab-b">Move to</label><select id="ab-b" name="to">${batchList().filter(b=>!cur.some(c=>c.id===b.id)).map(b=>opt(b.id,`${b.name} · ${batchWhen(b)}`)).join("")}</select></div>
   ${cur.length?`<label class="row" style="font-weight:700;flex-wrap:nowrap"><input type="checkbox" name="leave" checked style="width:20px;height:20px;accent-color:var(--leafMid)"> Remove from ${cur.map(b=>esc(b.name)).join(", ")}</label>`:""}
   <div class="field"><label for="ab-r">Message to the parent</label><textarea id="ab-r" name="r" rows="2" maxlength="600"></textarea></div>`,
  {wide:true,submitLabel:"Approve and move",done:"Moved. The parent can see the new batch.",onSubmit:async f=>{const to=f.to&&f.to.value;if(!to)throw userErr("Create another batch first.");if(f.leave&&f.leave.checked)for(const b of cur)await removeFromBatch(b.id,L.id);await addToBatch(to,L.id);
    const b=D.batches[to];await S.db.doc(`pp/${uid}/x/${id}`).update({status:"done",reply:`${f.r.value.trim()?f.r.value.trim()+" ":""}${firstOf(L.name)} is now in ${b.name} (${batchWhen({...b,id:to})}).`,replyBy:S.uid,replyName:myName(),replyAt:Date.now()});await bumpPPI(uid,{staffAt:Date.now()});refreshThread(uid);await audit("Batch change approved",`${L.name} → ${b.name}`);}});};
A.approveTeacher=v=>{const [uid,id]=v.split("|");const x=(D.pp[uid]||{})[id];if(!x)return;const L=learner(x.lid);if(!L)return;
  openModal("Teacher change · "+L.name,`<p class="small muted">Now: ${esc(trainerName(L.trainerId))}${x.text?` · “${esc(x.text)}”`:""}</p><div class="field"><label for="at-t">New teacher</label><select id="at-t" name="tid">${activeTrainers().filter(t=>t.id!==L.trainerId).map(t=>opt(t.id,t.name)).join("")}</select></div>
   <div class="field"><label for="at-r">Message to the parent</label><textarea id="at-r" name="r" rows="2" maxlength="600"></textarea></div>`,
  {submitLabel:"Approve",done:"Teacher changed",onSubmit:async f=>{const t=f.tid.value;if(!t)throw userErr("Add another trainer first.");await S.db.doc("learners/"+L.id).update(assignPatch(L,t));
    await S.db.doc(`pp/${uid}/x/${id}`).update({status:"done",reply:`${f.r.value.trim()?f.r.value.trim()+" ":""}${firstOf(L.name)}'s teacher is now ${trainerName(t)}.`,replyBy:S.uid,replyName:myName(),replyAt:Date.now()});await bumpPPI(uid,{staffAt:Date.now()});refreshThread(uid);await audit("Teacher change approved",`${L.name} → ${trainerName(t)}`);}});};
A.assignReq=v=>{const [uid,id]=v.split("|");const x=(D.pp[uid]||{})[id];if(!x)return;
  openModal("Assign and prioritise",`<div class="two"><div class="field"><label for="ar-a">Assigned to</label><select id="ar-a" name="who">${opt("","Me (admin)",!x.assignee)}${activeTrainers().filter(t=>t.uid).map(t=>opt(t.uid,t.name,t.uid===x.assignee)).join("")}</select></div><div class="field"><label for="ar-p">Priority</label><select id="ar-p" name="pr">${["low","normal","high","urgent"].map(p=>opt(p,p[0].toUpperCase()+p.slice(1),p===(x.priority||"normal"))).join("")}</select></div></div>
   <label class="row" style="font-weight:700;flex-wrap:nowrap"><input type="checkbox" name="esc" ${x.escalated?"checked":""} style="width:20px;height:20px;accent-color:var(--leafMid)"> Escalate (shows on your Today page until it's closed)</label>`,
  {submitLabel:"Save",done:"Saved",onSubmit:async f=>{await S.db.doc(`pp/${uid}/x/${id}`).update({assignee:f.who.value||null,priority:f.pr.value,escalated:f.esc.checked});await bumpPPI(uid,{staffAt:Date.now()});refreshThread(uid);}});};
A.hideMsg=v=>{const [uid,id]=v.split("|");const x=(D.pp[uid]||{})[id];if(!x)return;save(async()=>{await S.db.doc(`pp/${uid}/x/${id}`).update({hidden:!x.hidden,hiddenBy:S.uid});await bumpPPI(uid,{staffAt:Date.now()});await refreshThread(uid);await audit(x.hidden?"Chat message restored":"Chat message hidden",`${accountName(uid)}: ${String(x.text).slice(0,60)}`);},x.hidden?"Message restored":"Message hidden");};
function reqRowAdmin(x){const due=slaOf(x),late=x.status==="open"&&due<Date.now(),k=x.uid+"|"+x.id;
  const appr=x.status!=="open"?"":x.type==="reschedule"?`<button class="btn btn-primary btn-sm" data-act="approveReq" data-id="${esc(k)}">Approve</button>`:x.type==="batch"?`<button class="btn btn-primary btn-sm" data-act="approveBatch" data-id="${esc(k)}">Approve</button>`:x.type==="teacher"?`<button class="btn btn-primary btn-sm" data-act="approveTeacher" data-id="${esc(k)}">Approve</button>`:"";
  return `<div class="item" style="align-items:flex-start"><div class="grow"><div class="t">${esc(REQ_LABEL[x.type]||"Request")} · ${esc(accountName(x.uid))}${x.lid?` <span class="small muted">· ${esc(learnerName(x.lid))}</span>`:""}</div>
    <div class="s">${esc(reqSummary(x))} · ${esc(fmtDay(new Date(x.at)))}${x.assignee?` · assigned to ${esc(trainerByUid(x.assignee)?.name||"admin")}`:""}</div>${x.text?`<div class="small" style="white-space:pre-wrap;margin-top:4px">${esc(x.text)}</div>`:""}${x.reply?`<div class="reply small" style="margin-top:6px"><b>${esc(x.replyName||"Staff")}:</b> ${esc(x.reply)}</div>`:""}
    <div class="row" style="margin-top:6px;gap:6px">${reqPill(x)}${x.priority&&x.priority!=="normal"?`<span class="pill ${x.priority==="urgent"||x.priority==="high"?"p-bad":"p-mute"}">${esc(x.priority)}</span>`:""}${x.escalated?`<span class="pill p-bad">Escalated</span>`:""}${x.status==="open"?`<span class="pill ${late?"p-bad":"p-info"}">${late?"Response overdue":"Reply by "+esc(fmtDay(new Date(due)))+", "+esc(fmtTime(new Date(due)))}</span>`:""}</div></div>
    <div class="acts wrap">${appr}<button class="btn btn-ghost btn-sm" data-act="replyReq" data-id="${esc(k)}">${x.status==="open"?"Reply":"Edit reply"}</button>${role()==="admin"?`<button class="btn btn-ghost btn-sm" data-act="assignReq" data-id="${esc(k)}">Assign</button>`:""}</div></div>`;}

/* ---------- Trainers: profiles, quality, pay ---------- */
const ONBOARD=[["docs","ID and documents"],["bg","Background check"],["train","Training done"],["demo","Demo class passed"],["contract","Contract signed"]];
const onboardDone=t=>ONBOARD.filter(([k])=>((D.priv[t.id]||{}).onboard||{})[k]).length;
function workload(t){const wk=Date.now()+7*864e5,now=Date.now();const ss=entries(D.sessions).filter(s=>(s.trainerId===t.id||(!s.trainerId&&D.courses[s.courseId]?.teacherId===t.id)));
  return {learners:activeLearners().filter(l=>l.trainerId===t.id).length,week:ss.filter(s=>{const x=new Date(s.startsAt).getTime();return x>=now&&x<wk}).length,mins:ss.filter(s=>{const x=new Date(s.startsAt).getTime();return x>=now&&x<wk}).reduce((a,s)=>a+(s.durationMin||45),0),batches:batchList().filter(b=>b.tid===t.id).length};}
function ratingsFor(t){const rs=famItems("rating").filter(r=>r.tid===t.id);return {n:rs.length,avg:rs.length?rs.reduce((a,r)=>a+(+r.teacherStars||0),0)/rs.length:null};}
function obsFor(t){const os=adList("obs").filter(o=>o.tid===t.id);const sc=os.map(o=>{const v=Object.values(o.scores||{}).map(Number).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}).filter(x=>x!=null);return {n:os.length,avg:sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null,last:os[0]||null};}
function noteRate(t){if(!t.uid)return null;const ms=Object.values(D.marks[t.uid]||{});if(!ms.length)return null;return ms.filter(m=>m.note||Object.keys(m.notes||{}).length).length/ms.length;}
function hwRate(t){if(!t.uid)return null;let a=0,r=0;for(const h of allHw().filter(h=>h.uid===t.uid))for(const L of hwLearners(h))if(answerOf(L,h)){a++;if(replyOf(L,h))r++;}return a?r/a:null;}
function replyStats(){const by={};for(const th of threads()){const ms=th.ms;for(let i=0;i<ms.length;i++){if(ms[i].from!=="parent"||ms[i].hidden)continue;if(i>0&&ms[i-1].from==="parent")continue;const nx=ms.slice(i+1).find(m=>m.from==="staff");if(!nx)continue;const k=nx.by;(by[k]=by[k]||[]).push((nx.at-ms[i].at)/36e5);}}return by;}
const fmtHrs=h=>h==null?"–":h<1?`${Math.round(h*60)} min`:`${h.toFixed(h<10?1:0)} h`;
function trainersTabs(){const t=S.ttab||"team";return `<div class="seg" role="tablist" aria-label="Trainers">${[["team","Team & hours"],["profiles","Profiles & workload"],["quality","Quality"],["pay","Pay"]].map(([k,l])=>`<button class="tog ${t===k?"on":""}" role="tab" aria-selected="${t===k}" data-act="ttab" data-id="${k}">${l}</button>`).join("")}</div>`;}

/* ---------- Fees: plans, coupons, sibling discount, refunds, reminders ---------- */
function couponValid(code){const c=(AS().coupons||[]).find(x=>x.code===String(code||"").trim().toUpperCase());if(!c)return null;if(c.until&&c.until<ymd(new Date()))return null;return c;}
function pricePlan(planId,coupon,lid){const p=(AS().plans||[]).find(x=>x.id===planId);if(!p)throw userErr("Pick a plan.");const base=+p.price||0;let off=0,code="";
  if(String(coupon||"").trim()){const c=couponValid(coupon);if(!c)throw userErr("That coupon code isn't valid or has expired.");code=c.code;off=c.kind==="flat"?+c.value:Math.round(base*(+c.value)/100);}
  const L=learner(lid);const sibs=L?siblingsOf(L).filter(s=>D.fees[s.id]&&+D.fees[s.id].monthly>0&&(s.createdAt||0)<=(L.createdAt||Date.now())):[];const sp=+AS().siblingPct||0;const sib=sibs.length&&sp?Math.round((base-off)*sp/100):0;
  return {planId:p.id,plan:p.name,classes:+p.classes||0,base,coupon:code,couponOff:off,siblingOff:sib,monthly:Math.max(0,base-off-sib)};}
function remindersToday(){const R=AS().reminders||{before:3,onDue:true,after:[3,7]};const today=new Date(new Date().toDateString());const out=[];
  for(const L of activeLearners()){const fi=feeInfo(L.id,thisMonth());if(!fi||!fi.remainingM)continue;const due=new Date(`${thisMonth()}-${pad(fi.dueDay)}T00:00`);const days=Math.round((due-today)/864e5);
    const hit=(R.before&&days===+R.before)||(R.onDue&&days===0)||(days<0&&(R.after||[]).map(Number).includes(-days));if(!hit)continue;if(((D.fees[L.id]||{}).reminded||{})[ymd(new Date())])continue;out.push({L,fi,due,days});}return out;}
function reminderRow({L,fi,due,days}){const pv=D.priv[L.id]||{};const msg=fill(tpl(days<0?"feeOverdue":"feeDue"),{parent:pv.guardian||"there",child:firstOf(L.name),amount:money(fi.remainingM),month:monthLabel(thisMonth()),due:fmtDay(due),academy:ACAD().name});const wa=waLinkTo(pv.phone,msg);
  return `<div class="item"><div class="grow"><div class="t">${esc(L.name)}</div><div class="s">${money(fi.remainingM)} · ${days>0?`due in ${days} day${days===1?"":"s"}`:days===0?"due today":`${-days} day${days===-1?"":"s"} overdue`}</div></div>${wa?`<a class="btn btn-wa btn-sm" href="${esc(wa)}" target="_blank" rel="noopener">${ic("wa")}WhatsApp</a>`:`<button class="btn btn-ghost btn-sm" data-act="copyText" data-id="${esc(msg)}">${ic("copy")}Copy</button>`}<button class="btn btn-ghost btn-sm" data-act="markReminded" data-id="${esc(L.id)}">Mark sent</button></div>`;}
A.markReminded=lid=>save(()=>upsert("fees/"+lid,{reminded:{[ymd(new Date())]:true}}),"Marked as sent");

/* ---------- Announcements targeting ---------- */
function noticeTargetLabel(n){if(n.audience==="lang")return `${n.target} learners`;if(n.audience==="batch")return D.batches[n.target]?.name||"A batch";if(n.audience==="student")return learnerName(n.target);return null;}
function noticeHitsKids(n,kids){if(n.audience==="everyone"||n.audience==="families")return true;if(n.audience==="lang")return kids.some(L=>learnerCourses(L).some(c=>(D.courses[c]?.lang||langCode(D.courses[c]))===n.target));if(n.audience==="batch")return kids.some(L=>(D.batches[n.target]?.learners||[]).includes(L.id));if(n.audience==="student")return kids.some(L=>L.id===n.target);return false;}
