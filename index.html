/* ---------- Analytics ---------- */
function activeAt(L,t){return (L.createdAt||0)<=t&&(L.active!==false||(L.leftAt&&L.leftAt>t));}
function monthEnd(m){const d=mDate(m);d.setMonth(d.getMonth()+1);return d.getTime()-1;}
const paidIn=(lid,m)=>Object.values((D.fees[lid]||{}).payments||{}).some(p=>p&&p.month===m&&+p.amount>0);
function barList(rows,fmt){const max=Math.max(1,...rows.map(r=>r[1]));return `<div class="hbars">${rows.map(([l,v,sub])=>`<div class="hbar"><span>${esc(l)}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b class="num">${fmt?fmt(v):v}</b>${sub?`<small>${esc(sub)}</small>`:""}</div>`).join("")}</div>`;}
function colChart(rows,fmt){const max=Math.max(1,...rows.map(r=>r[1]));return `<div class="cols6">${rows.map(([l,v])=>`<div class="col"><b class="num">${fmt?fmt(v):v}</b><div class="cbar"><i style="height:${Math.max(2,v/max*100)}%"></i></div><span>${esc(l)}</span></div>`).join("")}</div>`;}
function analyticsView(){const tab=S.atab||"business";const tabs=`<div class="seg" role="tablist" aria-label="Analytics">${[["business","Business"],["learning","Learning"],["engagement","Engagement"]].map(([k,l])=>`<button class="tog ${tab===k?"on":""}" role="tab" aria-selected="${tab===k}" data-act="atab" data-id="${k}">${l}</button>`).join("")}</div>`;
  const all=allLearners(),act=activeLearners(),m=thisMonth(),months=[5,4,3,2,1,0].map(i=>shiftMonth(m,-i));let body="";
  if(tab==="business"){const start=mDate(m).getTime();const actStart=all.filter(L=>activeAt(L,start-1)).length;const left=all.filter(L=>L.leftAt&&ym(new Date(L.leftAt))===m).length;const joined=all.filter(L=>L.createdAt&&ym(new Date(L.createdAt))===m).length;
    const prevPaid=act.filter(L=>paidIn(L.id,shiftMonth(m,-1)));const renewed=prevPaid.filter(L=>paidIn(L.id,m)).length;
    const byPlan={},byLang={};for(const L of all){const f=D.fees[L.id];if(!f)continue;let r=0;for(const p of Object.values(f.payments||{}))if(p&&p.date&&p.date.startsWith(m))r+=+p.amount||0;for(const x of Object.values(f.refunds||{}))if(x&&x.date&&x.date.startsWith(m))r-=+x.amount||0;if(!r)continue;const pk=f.plan||"No plan";byPlan[pk]=(byPlan[pk]||0)+r;const c=D.courses[learnerCourses(L)[0]];const lk=c?(c.lang||langCode(c)):"–";byLang[lk]=(byLang[lk]||0)+r;}
    body=`<div class="stats"><div class="stat f" style="background:var(--leafSoft)"><b class="num">${act.length}</b><span>Active learners</span><small>${joined} joined · ${left} left in ${esc(monthShort(m))}</small></div><div class="stat f" style="background:var(--peach)"><b class="num">${actStart?pctStr(left/actStart):"–"}</b><span>Churn · ${esc(monthShort(m))}</span><small>Retention ${actStart?pctStr(1-left/actStart):"–"}</small></div>
      <div class="stat f" style="background:var(--sunSoft)"><b class="num">${prevPaid.length?pctStr(renewed/prevPaid.length):"–"}</b><span>Renewal rate</span><small>${renewed} of ${prevPaid.length} who paid last month</small></div><div class="stat f" style="background:var(--petalSoft)"><b class="num">${money(revenueIn(m))}</b><span>Revenue · ${esc(monthShort(m))}</span><small>Net of refunds</small></div></div>
     <div class="cols even"><section class="card panel"><h2>Revenue, last 6 months</h2>${colChart(months.map(x=>[monthShort(x),revenueIn(x)]),v=>v>=1000?"₹"+Math.round(v/1000)+"k":money(v))}</section><section class="card panel"><h2>Active learners, last 6 months</h2>${colChart(months.map(x=>[monthShort(x),all.filter(L=>activeAt(L,Math.min(Date.now(),monthEnd(x)))).length]))}</section></div>
     <div class="cols even"><section class="card panel"><h2>Revenue by plan · ${esc(monthShort(m))}</h2>${Object.keys(byPlan).length?barList(Object.entries(byPlan).sort((a,b)=>b[1]-a[1]),money):`<p class="muted">No payments this month yet.</p>`}</section><section class="card panel"><h2>Revenue by language · ${esc(monthShort(m))}</h2>${Object.keys(byLang).length?barList(Object.entries(byLang).sort((a,b)=>b[1]-a[1]),money):`<p class="muted">No payments this month yet.</p>`}</section></div>`;}
  else if(tab==="learning"){const st={};for(const L of act)st[L.stage||"Seeds"]=(st[L.stage||"Seeds"]||0)+1;const comp=act.filter(L=>L.uid).map(overallPct);const words=act.map(L=>wordsOf(L.uid).length);
    let asg=0,ans=0;for(const L of act)for(const h of hwFor(L)){asg++;if(answerOf(L,h))ans++;}const sp=[];for(const L of act)if(L.uid)for(const x of kpItems(L.uid))if(x.kind==="audio"){const c=pcFor(x.id);if(c&&c.score)sp.push(+c.score);}
    const sk={};for(const L of act){const a=assessFor(L)[0];if(a&&a.skills)for(const [k,v] of Object.entries(a.skills)){(sk[k]=sk[k]||[]).push(+v);}}
    body=`<div class="stats"><div class="stat f" style="background:var(--sunSoft)"><b class="num">${comp.length?pctStr(comp.reduce((a,b)=>a+b,0)/comp.length):"–"}</b><span>Average course completion</span></div><div class="stat f" style="background:var(--leafSoft)"><b class="num">${words.reduce((a,b)=>a+b,0)}</b><span>Words learned</span><small>${act.length?Math.round(words.reduce((a,b)=>a+b,0)/act.length):0} per learner</small></div>
      <div class="stat f" style="background:var(--skySoft)"><b class="num">${asg?pctStr(ans/asg):"–"}</b><span>Homework completion</span><small>${ans} of ${asg} handed in</small></div><div class="stat f" style="background:var(--petalSoft)"><b class="num">${sp.length?(sp.reduce((a,b)=>a+b,0)/sp.length).toFixed(1)+"/5":"–"}</b><span>Speaking score</span><small>${sp.length} recording${sp.length===1?"":"s"} scored</small></div></div>
     <div class="cols even"><section class="card panel"><h2>Learners by level</h2>${barList(STAGES.map(s=>[s.v,st[s.v]||0,s.ages]))}</section><section class="card panel"><h2>Average skills (latest assessment)</h2>${Object.keys(sk).length?barList(SKILLS.map(([k,l])=>[l,sk[k]?sk[k].reduce((a,b)=>a+b,0)/sk[k].length:0]),v=>v.toFixed(1)+"/5"):`<p class="muted">No skill assessments yet.</p>`}</section></div>
     <section class="card panel"><h2>Course completion</h2>${courseList().length?barList(courseList().map(c=>{const ls=learnersInCourse(c.id).filter(L=>L.uid);return [c.title,ls.length?ls.reduce((a,L)=>a+coursePct(L.uid,c.id),0)/ls.length*100:0,`${ls.length} learners`];}),v=>Math.round(v)+"%"):`<p class="muted">No courses yet.</p>`}</section>`;}
  else{const wk=Date.now()-7*864e5,ps=parentAccounts().filter(p=>childrenOf(p.uid).length),actP=ps.filter(p=>(p.lastSeen||0)>=wk).length,wkK=weekKey(new Date()),dig=ps.filter(p=>(p.digest||{})[wkK]).length;
    const actK=act.filter(L=>L.uid&&[...activityDays(L.uid)].some(d=>new Date(d).getTime()>=wk-864e5)).length;const bk={"0 days":0,"1–2 days":0,"3–6 days":0,"7+ days":0};for(const L of act){if(!L.uid)continue;const s=streak(L.uid);bk[s===0?"0 days":s<3?"1–2 days":s<7?"3–6 days":"7+ days"]++;}
    const weeks=[3,2,1,0].map(i=>{const d=new Date();d.setDate(d.getDate()-7*i);return weekKey(d);});
    body=`<div class="stats"><div class="stat f" style="background:var(--leafSoft)"><b class="num">${actP}/${ps.length}</b><span>Parents active · 7 days</span></div><div class="stat f" style="background:var(--sunSoft)"><b class="num">${dig}/${ps.length}</b><span>Weekly digest opened</span><small>This week</small></div>
      <div class="stat f" style="background:var(--skySoft)"><b class="num">${actK}/${act.filter(L=>L.uid).length}</b><span>Learners active · 7 days</span></div><div class="stat f" style="background:var(--petalSoft)"><b class="num">${act.filter(L=>L.uid&&streak(L.uid)>=3).length}</b><span>On a 3+ day streak</span></div></div>
     <div class="cols even"><section class="card panel"><h2>Student streaks</h2>${barList(Object.entries(bk))}</section><section class="card panel"><h2>Digest opens by week</h2>${colChart(weeks.map(w=>[fmtDay(new Date(w+"T12:00")),ps.filter(p=>(p.digest||{})[w]).length]))}</section></div>`;}
  return `<div class="head"><div><h1>Analytics</h1><p class="lede">How the academy is doing: money, learning and engagement.</p></div></div>${tabs}${body}`;}

const lowerEmail=v=>String(v||"").trim().toLowerCase();
S.acct=S.acct||{};
function parentsOnFile(){
  const m=new Map();
  for(const L of activeLearners()){const pv=D.priv[L.id]||{};
    for(const [ek,gk,pk] of [["email","guardian","phone"],["email2","guardian2","phone2"]]){const e=lowerEmail(pv[ek]);if(!e)continue;
      if(!m.has(e))m.set(e,{email:e,name:"",phone:"",kids:[]});const x=m.get(e);if(!x.name&&pv[gk])x.name=pv[gk];if(!x.phone&&pv[pk])x.phone=pv[pk];x.kids.push(L.id);}}
  return [...m.values()].sort((a,b)=>(a.name||a.email).localeCompare(b.name||b.email));
}
let acctReq=0;
function loadParentAccounts(){
  const emails=parentsOnFile().map(x=>x.email);if(!emails.length||!window.LL_sb)return;
  const key=emails.join(",");if(S.acctKey===key&&Date.now()-(S.acctAt||0)<30000)return;S.acctKey=key;S.acctAt=Date.now();const my=++acctReq;
  LL_sb.rpc("ll_accounts",{emails}).then(({data})=>{if(my!==acctReq||!data)return;const o={};for(const r of data)o[r.email]={uid:r.uid,last:r.last_sign_in};S.acct=o;schedule();},()=>{});
}

async function saveParent(f,form,old){
  const name=f.name.value.trim(), phone=f.phone.value.trim(), email=lowerEmail(f.email.value);
  if(!name)throw userErr("Add the parent's name.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw userErr("Check the email address.");
  const want=new Set([...form.querySelectorAll('input[name="kids"]:checked')].map(x=>x.value));
  if(!want.size)throw userErr("Tick at least one child.");
  const acct=S.acct[email];
  for(const L of activeLearners()){const pv=D.priv[L.id]||{};const in1=lowerEmail(pv.email)===email, in2=lowerEmail(pv.email2)===email;
    if(want.has(L.id)){
      if(in1)await upsert("private/"+L.id,{guardian:name,phone:phone||pv.phone||""});
      else if(in2)await upsert("private/"+L.id,{guardian2:name,phone2:phone||pv.phone2||""});
      else if(!pv.email)await upsert("private/"+L.id,{guardian:name,email,phone:phone||pv.phone||""});
      else if(!pv.email2)await upsert("private/"+L.id,{guardian2:name,email2:email,phone2:phone});
      else throw userErr(`${L.name} already has two parent emails. Edit ${firstOf(L.name)} to change one.`);
    }else if(in1||in2){
      await upsert("private/"+L.id,in1?(pv.email2?{email:pv.email2,guardian:pv.guardian2||"",phone:pv.phone2||"",email2:"",guardian2:"",phone2:""}:{email:""}):{email2:"",guardian2:"",phone2:""});
      if(acct&&(L.parents||[]).includes(acct.uid))await S.db.doc("learners/"+L.id).update({parents:(L.parents||[]).filter(u=>u!==acct.uid)});
    }}
  await audit(old?"Parent children changed":"Parent added",`${name} <${email}>: ${[...want].map(learnerName).join(", ")}`);
  S.acctKey="";
}
A.addParent=()=>{if(!activeLearners().length){toast("Add a learner first.",true);return}openModal("Add parent",parentForm(null),{wide:true,submitLabel:"Add parent",done:"Parent added. They can sign in now.",onSubmit:(f,form)=>saveParent(f,form,null)});};
A.editParentEmail=email=>{const x=parentsOnFile().find(p=>p.email===email);if(!x)return;openModal("Parent · "+(x.name||x.email),parentForm(x),{wide:true,done:"Saved",onSubmit:(f,form)=>saveParent(f,form,x)});};

const BANK_SKILLS=[["phonics","Phonics"],["vocabulary","Vocabulary"],["speaking","Speaking"],["listening","Listening"],["reading","Reading"],["writing","Writing"],["grammar","Grammar"]];

function bankLoad(){
  if(bankSub||!S.db)return; bankSub=true;
  try{S.db.collection("bank").onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();D.bank=o;bankRender();},()=>{D.bank=D.bank||{};});}catch(e){D.bank=D.bank||{};}
}
function bankAll(){
  const open=(window.LL_BANK||[]).map(x=>({...x,src:"open"}));
  const ours=entries(D.bank||{}).map(x=>({...x,src:"academy"}));
  return ours.sort((a,b)=>(b.at||0)-(a.at||0)).concat(open);
}
function bankStageFor(ids){

  const task=st==="Seeds"?"Say each word out loud with a grown-up. Draw a picture for each one."

const PVAL={p:100,n:320,b:330,r:500,q:900,k:0};
function chEval(g){ // from white's view
  if(g.in_checkmate())return g.turn()==="w"?-99999:99999;
  if(g.in_draw()||g.in_stalemate())return 0;
  let s=0;const b=g.board();
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;let v=PVAL[p.type];
    if(p.type==="p"||p.type==="n"){const cd=Math.abs(3.5-c)+Math.abs(3.5-r);v+=Math.round((7-cd)*4);}
    if(p.type==="p")v+=(p.color==="w"?(6-r):(r-1))*6;
    s+=p.color==="w"?v:-v;}
  return s;
}
function chSearch(g,d,a,b){
  if(d===0||g.game_over())return chEval(g);
  const ms=g.moves();
  if(g.turn()==="w"){let best=-1e9;for(const m of ms){g.move(m);best=Math.max(best,chSearch(g,d-1,a,b));g.undo();a=Math.max(a,best);if(a>=b)break;}return best;}
  let best=1e9;for(const m of ms){g.move(m);best=Math.min(best,chSearch(g,d-1,a,b));g.undo();b=Math.min(b,best);if(a>=b)break;}return best;
}

  <div class="field"><label for="tj-t">Title (optional)</label><input type="text" id="tj-t" name="t" maxlength="100" value="${esc(x.title||"")}" placeholder="e.g. Great phonics class with the Sprouts batch"></div>
  <div class="field"><span class="lbl">Need a start? Tap a prompt</span><div class="row" style="flex-wrap:wrap">${TJ_PROMPTS.map((p,i)=>`<button type="button" class="btn btn-ghost btn-sm" data-mact="prompt" data-id="${i}">${esc(p)}</button>`).join("")}</div></div>
  <div class="field"><label for="tj-x">Journal</label><textarea id="tj-x" name="x" rows="9" maxlength="8000" placeholder="Write freely. This is just for you.">${esc(x.text||"")}</textarea></div>`;}
const tjActs={prompt:(i,b,form)=>{const ta=form.querySelector("#tj-x");ta.value=(ta.value.trim()?ta.value.trim()+"\n\n":"")+TJ_PROMPTS[+i]+"\n";ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}};
async function tjSave(f,id){const text=f.x.value.trim();if(!text)throw userErr("Write something first.");const data={date:f.d.value||ymd(new Date()),mood:f.m.value,title:f.t.value.trim(),text,updatedAt:Date.now()};
  if(id)await S.db.doc(`tj/${S.uid}/x/${id}`).update(data);else await S.db.collection(`tj/${S.uid}/x`).doc().set({...data,at:Date.now()});}
A.tjNew=()=>openModal("New journal entry",tjForm(),{wide:true,submitLabel:"Save entry",done:"Saved to your journal",actions:tjActs,onSubmit:f=>tjSave(f,null)});
A.tjEdit=id=>{const x=(D.tj||{})[id];if(x)openModal("Edit journal entry",tjForm(x),{wide:true,submitLabel:"Save",done:"Saved",actions:tjActs,onSubmit:f=>tjSave(f,id)});};
A.tjDel=id=>openModal("Delete this entry?","<p>It will be removed from your journal.</p>",{danger:true,submitLabel:"Delete",done:"Deleted",onSubmit:async()=>{await S.db.doc(`tj/${S.uid}/x/${id}`).delete();}});
A.mySpaceTab=t=>{S.mys=t||"journal";if(S.mys==="chess")A.chOpen();render();};
function mySpaceView(){
  tjLoad();

  const tabs=`<div class="row" role="tablist"><button class="btn ${t==="journal"?"btn-leaf":"btn-ghost"} btn-sm" role="tab" aria-selected="${t==="journal"}" data-act="mySpaceTab" data-id="journal">My journal</button><button class="btn ${t==="chess"?"btn-leaf":"btn-ghost"} btn-sm" role="tab" aria-selected="${t==="chess"}" data-act="mySpaceTab" data-id="chess">Play chess</button></div>`;

    ${D.tj==null?`<div class="skel"></div>`:xs.length?`<div class="list">${xs.map(x=>`<div class="item tj"><span class="mood m-${esc(x.mood||"good")}">${esc((MOODS.find(m=>m[0]===x.mood)||MOODS[1])[1])}</span><div class="grow"><div class="t">${esc(x.title||fmtDay(new Date(x.date+"T00:00")))}</div><div class="s">${x.title?esc(fmtDay(new Date(x.date+"T00:00")))+" · ":""}${esc(String(x.text||"").slice(0,160))}${String(x.text||"").length>160?"…":""}</div></div><button class="btn btn-ghost btn-sm" data-act="tjEdit" data-id="${esc(x.id)}">${ic("edit")}Open</button><button class="iconbtn" data-act="tjDel" data-id="${esc(x.id)}" aria-label="Delete entry">${ic("trash")}</button></div>`).join("")}</div>`

/* ================= Ask Pip: helper on every dashboard (updates, mood check-in, AI chat) ================= */
const PIPM=[["great","Great",-8],["happy","Happy",-5],["okay","Okay",0],["tired","Tired",3],["sad","Sad or worried",7]];
const PIPMCOL={great:"#FFC94A",happy:"#A6DB5C",okay:"#BFE3FA",tired:"#F7A8C4",sad:"#4BA3E3"};
function moodFace(m,size){const f=PIPM.find(x=>x[0]===m)||PIPM[2],c=f[2];
  return `<svg viewBox="0 0 40 40" width="${size||34}" height="${size||34}" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="${PIPMCOL[f[0]]}"/>${m==="tired"?`<path d="M11 17h6M23 17h6" stroke="#2E2219" stroke-width="2.5" stroke-linecap="round"/>`:`<circle cx="14" cy="16" r="2.4" fill="#2E2219"/><circle cx="26" cy="16" r="2.4" fill="#2E2219"/>`}<path d="M12 ${26+c/3} Q20 ${26-c} 28 ${26+c/3}" fill="none" stroke="#2E2219" stroke-width="2.5" stroke-linecap="round"/></svg>`;}
const PIPST={open:false,tab:"updates",chat:[],busy:false,off:false,log:null};
const pipRole=()=>{const r=role();return r==="student"?"learner":r==="teacher"?"trainer":r||"";};
const todayKey=()=>ymd(new Date());
function moodOf(uid,day){const p=D.progress[uid];const m=p&&p.moods&&p.moods[day||todayKey()];return m&&m.m||"";}
function pipTry(f){try{return f()}catch(e){return null}}
function pipUpdates(){
  const r=pipRole(), out=[], add=(t,go,urgent)=>out.push({t,go,urgent:!!urgent});
  if(r==="learner"){const L=myLearner();if(L){
      const hw=pipTry(()=>hwFor(L).filter(h=>!answerOf(L,h)))||[];if(hw.length)add(`${hw.length} homework to do`,"homework");
      const today=pipTry(()=>sessionsOf(learnerCourses(L)).filter(s=>dayKey(new Date(s.startsAt))===dayKey(new Date())&&sessEnd(s)>Date.now()))||[];
      for(const s of today.slice(0,2))add(`Class today at ${fmtTime(new Date(s.startsAt))}: ${s.title||"Live class"}`,"schedule",true);
      const un=pipTry(()=>unreadCount())||0;if(un)add(`${un} new message${un===1?"":"s"}`,"notices");
      if(!moodOf(S.uid))add("Tell Pip how you feel today","@mood");
      const ad=pipTry(()=>adaptFor(L));if(ad&&ad.mode==="revise"&&ad.words.length)add("Let's practise a few words again","home");}}
  else if(r==="parent"){
    const un=pipTry(()=>unreadCount())||0;if(un)add(`${un} unread notice${un===1?"":"s"}`,"messages");
    const ch=pipTry(()=>chatUnread().length)||0;if(ch)add(`${ch} new chat message${ch===1?"":"s"} from the teacher`,"messages",true);
    const K=pipTry(()=>curKid());if(K){const hw=pipTry(()=>hwFor(K).filter(h=>!answerOf(K,h)))||[];if(hw.length)add(`${firstOf(K.name)} has ${hw.length} homework to do`,"homework");
      const m=K.uid&&moodOf(K.uid);if(m)add(`${firstOf(K.name)} is feeling ${(PIPM.find(x=>x[0]===m)||[])[1].toLowerCase()} today`,"@mood",m==="sad");}}
  else if(r==="trainer"||r==="admin"){
    const rv=pipTry(()=>toReview().length)||0;if(rv)add(`${rv} homework answer${rv===1?"":"s"} waiting for your reply`,"homework");
    const sp=pipTry(()=>speakingQueue().length)||0;if(sp)add(`${sp} speaking practice to review`,"review");
    for(const L of (pipTry(()=>confFlagList())||[]).slice(0,3))add(`${firstOf(L.name)}'s speaking confidence has dipped two months running. A gentle boost could help.`,"learners",true);
    const cd=pipTry(()=>capDueList().length)||0;if(cd)add(`${cd} learner${cd===1?"":"s"} due a time-capsule recording this term`,"learners");
    const wa=pipTry(()=>wallAskedCount())||0;if(wa)add(`${wa} learner${wa===1?"":"s"} asked to share work on the Garden wall`,"review");
    const ib=pipTry(()=>inboxCount())||0;if(ib)add(`${ib} family conversation${ib===1?" needs":"s need"} a reply`,"inbox",true);
    if(r==="admin"){const wp=pipTry(()=>waitingParents().length)||0;if(wp)add(`${wp} account${wp===1?"":"s"} waiting to be connected`,"parents",true);
      const rm=pipTry(()=>remindersToday().length)||0;if(rm)add(`${rm} fee reminder${rm===1?"":"s"} due today`,"fees");
      const rp=pipTry(()=>reportsPending().length)||0;if(rp)add(`${rp} report${rp===1?"":"s"} to approve`,"reports");
      const lv=pipTry(()=>txAll("leave").filter(l=>l.status==="pending").length)||0;if(lv)add(`${lv} leave request${lv===1?"":"s"} to approve`,"trainers");
      {const md=ymd(new Date()).slice(5);if((md>="05-15"&&md<="06-10")||md>="12-15"||md<="01-02")add("Holidays soon? Free Supabase databases pause after 7 days unused. Open the classroom once a week.","settings");}
      const up=pipTry(()=>upiPending().length)||0;if(up)add(`${up} UPI payment${up===1?"":"s"} to confirm`,"fees",true);
      const ld=pipTry(()=>adList("leads").filter(x=>x.status==="new").length)||0;if(ld)add(`${ld} new lead${ld===1?"":"s"}`,"leads");}
    if(r==="admin"&&PIPST.flagN)add(`${PIPST.flagN} child chat${PIPST.flagN===1?"":"s"} with Pip flagged for safety this week`,"@log",true);
    const sad=(pipTry(()=>scopedLearners())||[]).filter(L=>L.uid&&moodOf(L.uid)==="sad");
    for(const L of sad.slice(0,3))add(`${firstOf(L.name)} said they feel sad or worried today. A kind check-in could help.`,"@mood",true);}
  return out;
}
function pipBadge(){const n=pipUpdates().length;const b=document.getElementById("pipfab");if(!b)return;const s=b.querySelector(".pfb");if(s){s.textContent=n>9?"9+":String(n);s.hidden=!n;}b.setAttribute("aria-label",`Ask Pip${n?`, ${n} update${n===1?"":"s"}`:""}`);}
function pipEnsure(){
  const ok=S.status==="ready"&&!!pipRole()&&!document.getElementById("ll-gate");
  let b=document.getElementById("pipfab");
  if(!ok){if(b)b.hidden=true;return;}
  if(!b){b=document.createElement("button");b.id="pipfab";b.type="button";b.innerHTML=`<svg viewBox="24 12 152 186" aria-hidden="true"><use href="#pip" x="0" y="0" width="200" height="200"/></svg><span class="pfl">Ask Pip</span><span class="pfb" hidden></span>`;b.addEventListener("click",()=>pipOpen());document.body.appendChild(b);}
  b.hidden=PIPST.open;pipBadge();
}
setInterval(pipEnsure,1500);
function pipFlagCount(){if(pipRole()!=="admin"||!window.LL_sb)return;window.LL_sb.from("pip_chats").select("id",{count:"exact",head:true}).eq("flagged",true).gte("at",new Date(Date.now()-7*864e5).toISOString()).then(r=>{const n=r&&!r.error?r.count||0:0;if(n!==PIPST.flagN){PIPST.flagN=n;pipDraw();pipBadge();}},()=>{});}
function pipOpen(tab){PIPST.open=true;if(tab)PIPST.tab=tab;pipFlagCount();let p=document.getElementById("pippanel");
  if(!p){p=document.createElement("aside");p.id="pippanel";p.setAttribute("role","dialog");p.setAttribute("aria-label","Ask Pip");document.body.appendChild(p);
    p.addEventListener("click",pipClick);p.addEventListener("submit",pipSubmit);p.addEventListener("keydown",e=>{if(e.key==="Escape")pipClose();});}
  p.hidden=false;pipDraw();pipEnsure();setTimeout(()=>{const i=p.querySelector("#pip-q")||p.querySelector(".pip-x");if(i)i.focus();},60);}
function pipClose(){PIPST.open=false;const p=document.getElementById("pippanel");if(p)p.hidden=true;pipEnsure();const b=document.getElementById("pipfab");if(b)b.focus();}
function pipTabs(){const r=pipRole(),n=pipUpdates().length;const tabs=[["updates",`Updates${n?` (${n})`:""}`],["mood","Mood"],["ask","Ask Pip"]];if(r==="admin")tabs.push(["log","Safety log"]);
  return `<div class="pip-tabs" role="tablist">${tabs.map(([k,t])=>`<button type="button" role="tab" aria-selected="${PIPST.tab===k}" class="${PIPST.tab===k?"on":""}" data-pip="tab" data-id="${k}">${t}</button>`).join("")}</div>`;}
function pipHead(){const kid=pipRole()==="learner";return `<div class="pip-head"><svg viewBox="24 12 152 186" class="pip-av" aria-hidden="true"><use href="#pip" x="0" y="0" width="200" height="200"/></svg><div class="grow"><b>Pip</b><span>${kid?"Your garden helper":"Your Little Lingos helper"}</span></div><button type="button" class="iconbtn pip-x" data-pip="close" aria-label="Close Pip">${ic("x")}</button></div>`;}
function pipDraw(){const p=document.getElementById("pippanel");if(!p||p.hidden)return;let body="";
  if(PIPST.tab==="updates"){const u=pipUpdates();const kid=pipRole()==="learner";
    body=u.length?`<p class="pip-say">${kid?"Here's what's new in your garden!":"Here's what needs your attention."}</p><div class="pip-list">${u.map(x=>`<button type="button" class="pip-up ${x.urgent?"urgent":""}" data-pip="go" data-id="${esc(x.go)}">${esc(x.t)}<span aria-hidden="true">›</span></button>`).join("")}</div>`
      :`<p class="pip-say">${kid?"All done! Your garden is looking lovely today.":"You're all caught up. Nothing needs your attention right now."}</p>`;}
  else if(PIPST.tab==="mood"){const mine=moodOf(S.uid),r=pipRole();
    body=`<p class="pip-say">${r==="learner"?"How are you feeling today?":"How are you feeling today? Only you and the academy team see this."}</p>
    <div class="pip-moods">${PIPM.map(([k,t])=>`<button type="button" class="pip-mood ${mine===k?"on":""}" data-pip="mood" data-id="${k}" aria-pressed="${mine===k}">${moodFace(k,40)}<span>${t}</span></button>`).join("")}</div>
    ${mine?`<p class="pip-note">${esc(pipMoodReply(mine))}</p>`:""}${pipMoodOthers()}`;}
  else if(PIPST.tab==="ask"){const kid=pipRole()==="learner";
    const sugg=kid?["What does 'curious' mean?","Give me a fun word for today","How do I hand in homework?","Tell me a riddle"]:pipRole()==="parent"?["How can I help my child read at home?","How do I see my child's homework?","How do I set a password?"]:pipRole()==="trainer"?["A 10-minute phonics game for Seeds","How do I set homework?","Write a friendly note to a parent about missed homework"]:["Write a notice about the Diwali holiday","How do I add a trainer?","Ideas to keep parents engaged"];
    body=`<div class="pip-chat" id="pip-chat" aria-live="polite">${PIPST.chat.length?PIPST.chat.map(m=>`<div class="pip-msg ${m.role==="user"?"me":"pip"}">${esc(m.content).replace(/\n/g,"<br>")}</div>`).join(""):`<p class="pip-say">${kid?"Hi! I'm Pip. Ask me about words, stories or how to use your garden!":"Hi! I'm Pip. Ask me anything about teaching English, Little Lingos or using this app."}</p><div class="pip-sugg">${sugg.map(s=>`<button type="button" data-pip="sugg">${esc(s)}</button>`).join("")}</div>`}${PIPST.busy?`<div class="pip-msg pip typing"><i></i><i></i><i></i></div>`:""}</div>
    <form class="pip-form" novalidate><label for="pip-q" class="sr">Ask Pip</label><input id="pip-q" name="q" type="text" maxlength="500" autocomplete="off" placeholder="${kid?"Type your question…":"Ask Pip anything…"}" ${PIPST.busy?"disabled":""}><button class="btn btn-primary btn-sm" type="submit" ${PIPST.busy?"disabled":""}>Send</button></form>
    <p class="pip-fine">${kid?"Pip is a computer helper, not a person. Never share your address, phone number or passwords. Your chats help keep you safe: the academy can read them.":"Pip is an AI helper and can make mistakes. Check important facts."}</p>`;}
  else if(PIPST.tab==="log"){body=pipLogHTML();}
  p.innerHTML=pipHead()+pipTabs()+`<div class="pip-body">${body}</div>`;
  const ch=p.querySelector("#pip-chat");if(ch)ch.scrollTop=ch.scrollHeight;
}
function pipMoodReply(m){const kid=pipRole()==="learner";
  if(m==="great"||m==="happy")return kid?"Yay! I love that. Let's make today a great learning day!":"Wonderful. Thanks for checking in!";
  if(m==="okay")return kid?"Thanks for telling me. Maybe a fun game can make it even better!":"Thanks for checking in. Small wins count too.";
  if(m==="tired")return kid?"It's okay to feel tired. Take a little rest, drink some water, and try again later.":"Rest matters. Take a short break if you can.";
  return kid?"Thank you for telling me. It's okay to feel sad or worried sometimes. Talking to a grown-up you trust can really help. Your teacher will see how you feel so they can check in on you.":"Thanks for being honest. Be kind to yourself today, and reach out to someone you trust if it would help.";}
function pipMoodOthers(){const r=pipRole();let ls=[];
  if(r==="trainer"||r==="admin")ls=pipTry(()=>scopedLearners())||[];else if(r==="parent")ls=pipTry(()=>childrenOf(S.uid).map(learner))||[];
  ls=ls.filter(L=>L&&L.uid);if(!ls.length)return "";
  const rows=ls.map(L=>{const m=moodOf(L.uid);return {L,m};}).sort((a,b)=>(b.m==="sad")-(a.m==="sad")||(!!b.m)-(!!a.m));
  return `<h4 class="pip-h4">${r==="parent"?"Your child today":"Your learners today"}</h4><div class="pip-mlist">${rows.map(({L,m})=>`<div class="pip-mrow ${m==="sad"?"sad":""}">${m?moodFace(m,26):`<span class="pip-nomood"></span>`}<b>${esc(L.name)}</b><span>${m?esc((PIPM.find(x=>x[0]===m)||[])[1]):"Not shared yet"}</span></div>`).join("")}</div>`;}
async function pipSaveMood(m){const day=todayKey();try{await upsert("progress/"+S.uid,{moods:{[day]:{m,at:Date.now()}}});}catch(e){toast("Couldn't save your mood. Try again.",true);return;}
  if(!D.progress[S.uid])D.progress[S.uid]={};D.progress[S.uid].moods={...(D.progress[S.uid].moods||{}),[day]:{m,at:Date.now()}};pipDraw();}
const PIPFAQ=[[/password/i,"To set a password: staff tap their name at the top, parents go to Settings › Sign-in, learners go to Me › My password. Then you can sign in with your email and password, no code needed."],
  [/homework/i,"Learners: open Homework, tap the homework, answer it and hand it in. Trainers: Homework › Set homework, choose who it's for, pick an activity, then check and set."],
  [/join|class|zoom|meet/i,"Open Classes. A Join button appears a little before the class starts."],
  [/draw|picture/i,"Go to Fun corner › Drawing. You can use the pen, eraser, undo, then save to your portfolio or download it."],
  [/chess/i,"Chess is in Fun corner (learners) and My space (trainers). Tap a piece, then tap where it should go."],
  [/fee|pay/i,"Parents can see fees under Fees. For questions about payments, please contact the academy team."],
  [/attendance/i,"Trainers mark attendance under Attendance. Admins can see everyone's attendance there too."]];
function pipFaq(q){const hit=PIPFAQ.find(([re])=>re.test(q));return hit?hit[1]:null;}
async function pipAsk(q){q=String(q||"").trim();if(!q||PIPST.busy)return;PIPST.chat.push({role:"user",content:q});PIPST.busy=true;pipDraw();
  let reply="";
  if(!PIPST.off&&window.LL_askPip){const r=await window.LL_askPip(PIPST.chat.slice(-8),pipUpdates().filter(x=>x.go!=="@mood").map(x=>x.t));
    if(r&&r.reply)reply=r.reply;else if(r&&r.off){PIPST.off=true;}else if(r&&r.error==="signin")reply="Please sign in again to chat with Pip.";}
  if(!reply){const f=pipFaq(q);reply=f||(PIPST.off?(pipRole()==="admin"?"My thinking cap isn't switched on yet. To turn on AI answers, add your free Groq key in Supabase (see the setup guide). Until then I can answer questions about using the app.":"I can't answer that just yet, but I can help with using the app! Try asking about homework, classes or passwords."):"Oops, Pip couldn't answer right now. Please try again in a minute.");}
  PIPST.chat.push({role:"assistant",content:reply});PIPST.busy=false;pipDraw();setTimeout(()=>{const i=document.getElementById("pip-q");if(i)i.focus();},30);}
function pipLogHTML(){
  if(PIPST.log==null){PIPST.log="loading";(async()=>{try{const {data,error}=await window.LL_sb.from("pip_chats").select("*").order("at",{ascending:false}).limit(200);PIPST.log=error?{err:error.message}:data||[];}catch(e){PIPST.log={err:String(e)};}pipDraw();})();}
  if(PIPST.log==="loading")return `<p class="pip-say">Loading…</p>`;

  const xs=PIPST.log, fl=xs.filter(x=>x.flagged);

  <div class="row" style="gap:6px"><button type="button" class="btn btn-ghost btn-sm" data-pip="logreload">Refresh</button></div>
  ${xs.length?`<div class="pip-log">${[...fl,...xs.filter(x=>!x.flagged)].map(x=>`<div class="pip-lrow ${x.flagged?"flag":""}"><div class="pip-lmeta"><b>${esc(x.name||x.role||"Learner")}</b> · ${esc(fmtDay(new Date(x.at)))} ${esc(fmtTime(new Date(x.at)))}${x.flagged?` · <span class="pill p-bad">${esc(x.reason||"flagged")}</span>`:""}</div><div><i>Asked:</i> ${esc(x.q)}</div><div><i>Pip:</i> ${esc(x.a)}</div></div>`).join("")}</div>`:`<p class="muted">No children's chats yet.</p>`}`;}
function pipClick(e){const b=e.target.closest("[data-pip]");if(!b)return;const k=b.dataset.pip,id=b.dataset.id;
  if(k==="close")pipClose();
  else if(k==="tab"){PIPST.tab=id;pipDraw();}
  else if(k==="go"){if(id==="@mood"){PIPST.tab="mood";pipDraw();return;}if(id==="@log"){PIPST.tab="log";PIPST.log=null;pipDraw();return;}pipClose();go(id);}
  else if(k==="mood")pipSaveMood(id);
  else if(k==="sugg")pipAsk(b.textContent);
  else if(k==="logreload"){PIPST.log=null;pipDraw();}}
function pipSubmit(e){e.preventDefault();const i=e.target.querySelector("#pip-q");if(!i)return;const q=i.value;i.value="";pipAsk(q);}

/* admin side */
let upiAdmSubs={};

function upiPending(){upiLoadAll();const out=[];for(const [u,xs] of Object.entries(D.upiAll||{}))for(const [id,x] of Object.entries(xs||{}))if(x&&x.status==="pending")out.push({...x,id,uid:u});return out.sort((a,b)=>(a.at||0)-(b.at||0));}

A.upiOk=async id=>{const [u,cid]=id.split("|");const x=((D.upiAll||{})[u]||{})[cid];if(!x||x.status!=="pending")return;

/* ================= Phase 2: Adaptive lesson path (practise again / jump ahead) ================= */
const wkKey=w=>String(w||"").toLowerCase().normalize("NFKC").replace(/[^\p{L}\p{N} '\-]/gu,"").trim().slice(0,40);
let wkPend={},wkT=null;
/* word results from games and "Say it", kept in the learner's own progress doc */
function wkLog(w,ok){try{if(realRole()!=="student"||!S.uid)return;const k=wkKey(w);if(!k)return;
  const p=D.progress[S.uid]=D.progress[S.uid]||{};const wk=p.wk=p.wk||{};const o=wk[k]||{};
  const n={r:(+o.r||0)+(ok?1:0),m:(+o.m||0)+(ok?0:1),l:ok?1:0,t:Date.now()};
  if(ok&&o.l===1&&n.m>0)n.m--; /* two right in a row: the word is growing back */
  wk[k]=n;wkPend[k]=n;clearTimeout(wkT);wkT=setTimeout(wkFlush,1200);}catch(e){}}
function wkFlush(){const p=wkPend;wkPend={};if(!Object.keys(p).length||!S.db||!S.uid)return;upsert("progress/"+S.uid,{wk:p}).catch(()=>{});}
addEventListener("pagehide",wkFlush);
const lessonById=id=>id&&D.lessons[id]?{...D.lessons[id],id}:null;
const tsOf=k=>{const n=parseInt(String(k).slice(1),36);return n>1.5e12&&n<4e12?n:0;};
function adaptVocab(L){const m={};for(const cid of learnerCourses(L)){const c=D.courses[cid];for(const l of lessonsOf(cid))for(const [w,mean] of parseVocab(l.vocab)){const k=wkKey(w);if(k&&!m[k])m[k]={w,m:mean,lang:langOf(c),lid:l.id};}}return m;}
function adaptOverride(L){let best=null;for(const x of txAll("adapt"))if(x.lid===L.id&&(!best||(x.at||0)>(best.at||0)))best=x;return best&&best.mode&&best.mode!=="auto"?best:null;}
function adaptAuto(L){
  const uid=L.uid, first=firstOf(L.name), out={mode:"new",words:[],lesson:null,ahead:null,why:"",stat:{}};
  if(!uid)return out;
  const p=progOf(uid), wk=p.wk||{}, voc=adaptVocab(L), now=Date.now(), D14=14*864e5, D45=45*864e5;
  /* 1. words that were tricky in games or "Say it" */
  const weak=Object.entries(wk).filter(([k,o])=>o&&(+o.m||0)>=1&&(o.l===0||(+o.m||0)>(+o.r||0))&&now-(o.t||0)<60*864e5)
    .sort((a,b)=>(b[1].m-a[1].m)||((b[1].t||0)-(a[1].t||0))).map(([k])=>voc[k]||{w:k,m:"",lang:"en-IN",lid:null});
  /* 2. accuracy over the last two weeks */
  let r=0,m=0;for(const o of Object.values(wk))if(o&&now-(o.t||0)<D14){r+=+o.r||0;m+=+o.m||0;}
  const games=Object.entries(p.pts||{}).filter(([k])=>k[0]==="g"||k[0]==="m").map(([k,v])=>({t:tsOf(k),s:+v||0})).filter(g=>g.t&&now-g.t<D14).sort((a,b)=>b.t-a.t).slice(0,5);
  const daily=Object.entries(p.daily||{}).filter(([d])=>now-new Date(d+"T12:00").getTime()<D14).map(([,v])=>(+v||0)/5*3);
  const gs=[...games.map(g=>g.s),...daily];const gAvg=gs.length?gs.reduce((a,b)=>a+b,0)/gs.length:null;
  /* 3. homework stars and the teacher's speaking scores */
  const hwLow=[],hwHigh=[];for(const h of pipTry(()=>hwFor(L))||[]){const f=replyOf(L,h);if(f&&f.stars&&now-(f.at||0)<D45){if(+f.stars<=1)hwLow.push(h);else if(+f.stars>=3)hwHigh.push(h);}}
  const spLow=txAll("pc").filter(c=>c.lid===L.id&&c.score&&+c.score<=2&&now-(c.at||0)<D45).length;
  out.stat={r,m,n:r+m,acc:r+m?r/(r+m):null,gAvg,games:gs.length,hwLow:hwLow.length,hwHigh:hwHigh.length,spLow};
  /* which finished lesson needs the most sunshine */
  const done=doneList(uid);const byL={};for(const x of weak)if(x.lid&&isDone(uid,x.lid))byL[x.lid]=(byL[x.lid]||0)+1;
  const weakLid=Object.keys(byL).sort((a,b)=>byL[b]-byL[a])[0]||null;
  const cids=learnerCourses(L), nx=nextLesson(uid,cids);
  if(nx){const ls=lessonsOf(nx.courseId);const i=ls.findIndex(l=>l.id===nx.id);out.next=nx;out.ahead=ls.slice(i+1).find(l=>!isDone(uid,l.id))||null;}
  if(weak.length>=2||(weak.length&&weakLid)||hwLow.length>=2||spLow>=2){
    out.mode="revise";out.words=weak.slice(0,6);
    out.lesson=weakLid?lessonById(weakLid):(hwLow.length>=2||spLow>=2)&&done[0]?lessonById(done[0].lid):null;
    const bits=[];if(weak.length)bits.push(`found ${weak.length===1?"one word":"a few words"} tricky in games and speaking practice (${weak.slice(0,4).map(x=>x.w).join(", ")})`);
    if(hwLow.length>=2)bits.push(`had ${hwLow.length} recent homework tasks that need another go`);if(spLow>=2)bits.push("is still working on saying some words clearly");
    out.why=`${first} ${bits.join(", and ")}. Pip suggests a short “practise again” activity so these words stick${out.lesson?`, starting with the lesson “${out.lesson.title}”`:""}.`;
    return out;}
  if(out.stat.n>=10&&out.stat.acc>=.9&&(gAvg==null||gAvg>=2.5)&&!hwLow.length&&out.ahead){
    out.mode="ahead";out.lesson=out.ahead;
    out.why=`${first} got ${r} of ${r+m} answers right in the last two weeks${gAvg!=null?` and is earning lots of stars in games`:""}. Pip suggests trying “${out.ahead.title}” a little early. ${first} can always come back to “${nx.title}”.`;return out;}
  if(out.stat.n||gs.length||done.length){out.mode="steady";out.why=`${first} is moving through lessons at a comfortable pace. Pip suggests extra practice or a jump ahead when it would help.`;}
  else out.why=`Suggestions appear after ${first} plays a few word games or practises speaking.`;
  return out;}
function adaptFor(L){const a=adaptAuto(L), o=adaptOverride(L);if(!o)return {...a,auto:a};
  const first=firstOf(L.name), who=byWho(o.uid);
  if(o.mode==="off")return {...a,mode:"off",auto:a,over:o,why:`${who} has paused suggestions for ${first} for now.`};
  if(o.mode==="revise"){const voc=adaptVocab(L);const ws=(o.words||[]).map(w=>voc[wkKey(w)]||{w,m:"",lang:"en-IN"});const l=lessonById(o.lessonId);
    return {...a,mode:"revise",auto:a,over:o,words:ws.length?ws:a.words,lesson:l||a.lesson,why:`${who} would like ${first} to practise ${l?`“${l.title}”`:"some words"} again${ws.length?` (${ws.slice(0,4).map(x=>x.w).join(", ")})`:""}.`};}
  if(o.mode==="ahead"){const l=lessonById(o.lessonId)||a.ahead;return {...a,mode:l?"ahead":"steady",auto:a,over:o,lesson:l,why:l?`${who} thinks ${first} is ready to jump ahead to “${l.title}”.`:a.why};}
  return {...a,auto:a};}
const ADM={revise:["Practise again","p-sun"],ahead:["Jump ahead","p-good"],steady:["On track","p-info"],new:["Not enough yet","p-mute"],off:["Paused","p-mute"]};
const adaptPill=L=>{const a=pipTry(()=>adaptFor(L));if(!a)return "";const d=ADM[a.mode]||ADM.new;return `<span class="pill ${d[1]}">${d[0]}${a.over?" ✎":""}</span>`;};

      <div class="row adbtns">${ws.length?`<button class="btn btn-sun btn-sm" data-act="startGame" data-id="revise">🎲 Play</button>${canSpeak()||canRecord()?`<button class="btn btn-ghost btn-sm" data-act="reviseSay">🎤 Say them</button>`:""}`:""}${a.lesson?`<button class="btn btn-ghost btn-sm" data-go="lesson:${esc(a.lesson.id)}">${ic("leaf")}Open lesson</button>`:""}</div></div></section>`;}
  if(a.mode==="ahead"&&a.lesson)return `<section class="adapt ahd">${art("bloom",64,"Bloom the flower")}<div class="grow"><b>Ready to jump ahead?</b><span>You're blooming! Want to try “${esc(a.lesson.title)}”?</span>
      <div class="row adbtns"><button class="btn btn-leaf btn-sm" data-go="lesson:${esc(a.lesson.id)}">Let's go! ${ic("fwd")}</button><button class="btn btn-ghost btn-sm" data-act="adaptLater" data-id="${esc(a.mode)}">Not now</button></div></div></section>`;

A.adaptLater=m=>{S.adaptLater=ymd(new Date())+m;render();};
A.reviseSay=()=>{const L=myLearner();if(!L)return;const a=adaptFor(L);const ws=a.words.slice(0,6).map(x=>({w:x.w,m:x.m||"",lang:x.lang||"en-IN"}));
  if(!ws.length){toast("No words to practise right now.",true);return}S.drill={ws,i:0,clip:null,heard:null,keep:false,recording:false};drillModal();};
function reviseGame(L){const a=adaptFor(L), pool=gamePool(L), focus=a.words.filter(x=>x.m);
  if(!focus.length||pool.length<4)return null;const qs=[];const n=Math.min(6,Math.max(4,focus.length*2));
  for(let i=0;i<n;i++){const x=focus[i%focus.length];const others=shuffle(pool.filter(y=>wkKey(y.w)!==wkKey(x.w)&&y.m!==x.m)).slice(0,3);if(others.length<3)continue;
    if(i%2===0)qs.push({k:"mean",say:x.w,lang:x.lang,prompt:`What does “${x.w}” mean?`,opts:shuffle([x,...others]).map(o=>o.m),ans:x.m});
    else qs.push({k:"listen",say:x.w,lang:x.lang,prompt:"Listen! Which word did Pip say?",opts:shuffle([x,...others]).map(o=>o.w),ans:x.w});}
  return qs.length?qs:null;}

function dtPool(L){const uid=L.uid,cids=learnerCourses(L),seen=new Set(),out=[];
  const add=(w,m,lang)=>{const k=wkKey(w);if(!k||seen.has(k)||!m)return;seen.add(k);out.push({w:w.trim(),m,lang:lang||"en-IN"});};
  const nx=nextLesson(uid,cids);const recent=doneList(uid).slice(0,2).map(x=>lessonById(x.lid)).filter(Boolean);
  for(const l of [nx,...recent].filter(Boolean)){const c=D.courses[l.courseId];for(const [w,m] of parseVocab(l.vocab))add(w,m,langOf(c));}
  if(out.length<4)for(const x of courseVocab(L))add(x.w,x.m,x.lang);
  if(out.length<4)for(const [w,m] of STARTER[L.stage]||STARTER.Seeds)add(w,m,"en-IN");
  return out;}
function dtPlan(L){const day=ymd(new Date());if(S.dtPlan&&S.dtPlan.day===day&&S.dtPlan.lid===L.id)return S.dtPlan;
  const r=rng(day+"|dt|"+(L.uid||L.id)), pool=shuffle(dtPool(L),r), stage=L.stage||"Seeds";
  const order=["say","picture","spell","question"];const start=Math.floor(r()*4);let plan=null;
  const spellable=x=>/^[A-Za-z]+$/.test(x.w)&&x.w.length>=3&&x.w.length<=(stage==="Seeds"?5:9);
  for(let i=0;i<4&&!plan;i++){const k=order[(start+i)%4];
    if(k==="say"&&pool.length)plan={k,x:pool[0]};
    else if(k==="picture"){const x=pool.find(y=>emoOf(y.w));if(x){const others=shuffle(Object.entries(EMO).filter(([w,e])=>e!==emoOf(x.w)&&!w.includes("_")),r).slice(0,2).map(([,e])=>e);plan={k,x,opts:shuffle([emoOf(x.w),...others],r),ans:emoOf(x.w)};}}
    else if(k==="spell"){const x=pool.find(spellable);if(x)plan={k,x,tiles:stage!=="Blooms",letters:shuffle(x.w.toLowerCase().split(""),r)};}
    else if(k==="question"&&pool.length>=3){const x=pool[0];const others=pool.slice(1).filter(y=>y.m!==x.m).slice(0,2);
      if(stage==="Seeds"&&emoOf(x.w)){const em=shuffle(Object.values(EMO).filter(e=>e!==emoOf(x.w)),r).slice(0,2);plan={k,x,listen:true,opts:shuffle([emoOf(x.w),...em],r),ans:emoOf(x.w),pics:true};}
      else if(others.length===2)plan={k,x,opts:shuffle([x.m,...others.map(o=>o.m)],r),ans:x.m};}}
  S.dtPlan=plan?{...plan,day,lid:L.id,tries:0,built:[],heard:null,msg:""}:{day,lid:L.id,k:null};return S.dtPlan;}

    ${p.tiles?`<div class="dtslots" aria-live="polite">${x.w.split("").map((_,i)=>`<span class="dtslot">${esc(p.built[i]!=null?p.letters[p.built[i]]:"")}</span>`).join("")}</div>
      <div class="dttiles">${p.letters.map((c,i)=>`<button class="dttile" data-act="dtTile" data-id="${i}" ${p.built.includes(i)?"disabled":""} aria-label="Letter ${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <div class="row dtbtns"><button class="btn btn-ghost btn-sm" data-act="dtBack" ${p.built.length?"":"disabled"}>${ic("back")}Undo</button><button class="btn btn-primary" data-act="dtCheck" ${p.built.length===x.w.length?"":"disabled"}>Check</button></div>`
     :`<div class="row dtbtns"><label for="dt-in" class="sr">Type the word</label><input id="dt-in" class="dtin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="20" value="${esc(p.typed||"")}"><button class="btn btn-primary" data-act="dtCheck">Check</button></div>`}
    ${p.msg?`<p class="dtmsg">${p.msg}</p>`:""}`;}
  return `<section class="dtask">${head}${body}</section>`;}
function dtGuard(){if(timeUp()){render();return true}return false;}
A.dtListen=()=>{const p=S.dtPlan;if(p&&p.x)say(p.x.w,p.x.lang);};
A.dtSaid=()=>{if(dtGuard())return;dtFinish(true,true);};
A.dtRec=()=>{if(dtGuard())return;const p=S.dtPlan;if(!p||!SR||p.rec)return;try{const r=new SR();r.lang=p.x.lang||"en-IN";r.maxAlternatives=3;p.rec=true;render();
  r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);const sc=sayScore(p.x.w,alts);const hit=sc.stars>=2;p.heard=sc.heard||alts[0]||"";p.rec=false;
    if(hit){dtFinish(true);}else{p.tries++;p.msg=p.tries>=2?"Lovely trying! Let's count that.":"Nearly! Listen once more and try again.";render();if(p.tries>=2)setTimeout(()=>dtFinish(false),1200);}};
  r.onerror=()=>{p.rec=false;p.msg="Pip couldn't hear. You can tap “I said it!” instead.";p.heard=p.heard??"";render();};r.onend=()=>{if(p.rec){p.rec=false;render();}};r.start();setTimeout(()=>{try{r.stop()}catch{}},6000);}catch(e){p.rec=false;render();}};
A.dtPick=i=>{if(dtGuard())return;const p=S.dtPlan;if(!p||p.fin)return;i=+i;if(p.opts[i]===p.ans){p.msg="";dtFinish(true);return;}
  p.tries++;p.wrong=i;if(p.tries>=2){p.msg=`It was ${p.pics?p.ans:`“${esc(p.ans)}”`}. Good try!`;render();setTimeout(()=>dtFinish(false),1400);}else{p.msg="Not quite. Have another go!";render();}};
A.dtTile=i=>{const p=S.dtPlan;if(!p||p.built.includes(+i)||p.built.length>=p.x.w.length)return;p.built.push(+i);p.msg="";render();};
A.dtBack=()=>{const p=S.dtPlan;if(p&&p.built.length){p.built.pop();render();}};
A.dtCheck=()=>{if(dtGuard())return;const p=S.dtPlan;if(!p||p.fin)return;let got;
  if(p.tiles)got=p.built.map(i=>p.letters[i]).join("");else{const el=document.getElementById("dt-in");got=(el&&el.value||"").trim();p.typed=got;}
  if(!got){p.msg="Type the word first.";render();return;}
  if(got.toLowerCase()===p.x.w.toLowerCase()){dtFinish(true);return;}
  p.tries++;if(p.tries>=2){p.msg=`It's spelled <b>${esc(p.x.w)}</b>. Good try!`;render();setTimeout(()=>dtFinish(false),1600);}else{p.msg="Almost! Listen again and have another go.";p.built=[];render();}};
async function dtFinish(ok,honor){const p=S.dtPlan;if(!p||p.fin)return;p.fin=true;const day=ymd(new Date()), s=ok?2:1;
  if(!honor&&p.x)wkLog(p.x.w,ok);
  const rec={k:p.k,ok:!!ok,s,w:p.x?p.x.w:"",at:Date.now()};
  if(!D.progress[S.uid])D.progress[S.uid]={};D.progress[S.uid].dt={...(D.progress[S.uid].dt||{}),[day]:rec};
  await save(()=>earn({dt:{[day]:rec},pts:{["d"+Date.now().toString(36)]:s}}));render();
  toast(ok?`You did it! +${s} stars ⭐`:`Good try! +${s} star ⭐`);}

function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
/* 3 = Pip heard the word, 2 = very close, 1 = Pip heard something (a good try), 0 = nothing heard */
function sayScore(target,alts){const t=norm(target);if(!t)return {stars:0,heard:""};let best={stars:0,heard:(alts||[])[0]||""};
  for(const a of alts||[]){const h=norm(a);if(!h)continue;const words=h.split(" ");let s=1;
    if(h===t||words.includes(t)||(t.includes(" ")&&h.includes(t)))s=3;
    else{const cands=[h,...words];const sim=Math.max(...cands.map(w=>1-lev(w,t)/Math.max(w.length,t.length)));if(sim>=.6)s=2;}
    if(s>best.stars)best={stars:s,heard:a};}
  if(!best.heard&&alts&&alts.length)best.heard=alts[0];return best;}

function recPill(sec){let el=document.getElementById("recpill");if(!el){el=document.createElement("div");el.id="recpill";el.setAttribute("role","status");el.setAttribute("aria-live","polite");document.body.appendChild(el);}
  let left=sec;const draw=()=>{el.innerHTML=`<span class="rdot" aria-hidden="true"></span>${left>5?`Recording · ${left}s left`:left>0?`Almost done! ${left}s`:"Saving…"}`;};draw();el.hidden=false;

/* images: longest side 1280px, WebP (or JPEG) around 70%, under the size cap */
function shrinkTo(src,maxSide,maxBytes){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,maxSide/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(img.width*sc));cv.height=Math.max(1,Math.round(img.height*sc));const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
  const webp=cv.toDataURL("image/webp",.7).startsWith("data:image/webp");const type=webp?"image/webp":"image/jpeg";const lim=Math.round(maxBytes*1.37);let q=.7,out=cv.toDataURL(type,q);
  while(out.length>lim&&q>.25){q-=.1;out=cv.toDataURL(type,q);}
  let f=.8;while(out.length>lim&&f>.15){const c2=document.createElement("canvas");c2.width=Math.max(1,Math.round(cv.width*f));c2.height=Math.max(1,Math.round(cv.height*f));const x2=c2.getContext("2d");x2.fillStyle="#fff";x2.fillRect(0,0,c2.width,c2.height);x2.drawImage(cv,0,0,c2.width,c2.height);out=c2.toDataURL(type,.55);f-=.15;}
  res(out);};img.onerror=rej;img.src=src;});}
/* which saved items are "practice" (cleaned up after 90 days, 5 per activity) */
const PRACTICE_ACTS=new Set(["drill","teachpip","sounds","mission","wod"]);

const expiresAt=x=>(x.at||0)+STORE.days*864e5;
async function prunePractice(uid,act){if(!uid||!act)return;try{await loadKp(uid,true);const xs=kpItems(uid).filter(x=>x.act===act&&isPractice(x)).sort((a,b)=>(b.at||0)-(a.at||0));
  for(const x of xs.slice(STORE.keepN))await S.db.doc(`kp/${uid}/x/${x.id}`).delete().catch(()=>{});if(xs.length>STORE.keepN)loadKp(uid,true);}catch(e){}}

let tidied="";
async function selfTidy(){try{if(realRole()!=="student"||S.viewAs||!S.uid)return;const day=ymd(new Date());if(tidied===day)return;tidied=day;
  await loadKp(S.uid,true);const now=Date.now();for(const x of kpItems(S.uid))if(isPractice(x)&&expiresAt(x)<now)await S.db.doc(`kp/${S.uid}/x/${x.id}`).delete().catch(()=>{});
  const p=progOf(S.uid),cut=ymd(new Date(now-STORE.days*864e5)),upd={};let mins=0,changed=false;
  for(const [k,v] of Object.entries(p.screen||{}))if(k<cut){mins+=+v||0;(upd.screen=upd.screen||{})[k]=null;changed=true;}
  if(mins)upd.screenOld=(+p.screenOld||0)+mins;
  for(const k of Object.keys(p.moods||{}))if(k<cut){(upd.moods=upd.moods||{})[k]=null;changed=true;}
  for(const [k,o] of Object.entries(p.wk||{}))if(o&&now-(o.t||0)>STORE.days*864e5&&!(+o.m)){(upd.wk=upd.wk||{})[k]=null;changed=true;}
  if(changed)await upsert("progress/"+S.uid,upd);}catch(e){}}

A.cleanScan=async()=>{const ls=allLearners().filter(L=>L.uid);toast("Checking…");for(const L of ls)await loadKp(L.uid,true);const now=Date.now(),del=[];

const CONF=[[1,"I feel shy"],[2,"I feel a bit shy"],[3,"I feel okay"],[4,"I feel brave"]];

const ymOf=t=>ymd(new Date(t||Date.now())).slice(0,7);
function pipFace(v,size){const s=size||56,m={1:"M84 150 q16 -6 32 0",2:"M84 148 q16 4 32 0",3:"M84 144 q16 14 32 0",4:"M82 140 q18 26 36 0 z"}[v];
  return `<svg viewBox="30 50 140 150" width="${s}" height="${s}" aria-hidden="true"><ellipse cx="100" cy="128" rx="66" ry="62" fill="#2F8F46"/><ellipse cx="100" cy="148" rx="44" ry="28" fill="#3FA75A"/>${v===1?`<path d="M66 116 q10 -6 20 0 M114 116 q10 -6 20 0" stroke="#2E2219" stroke-width="6" fill="none" stroke-linecap="round"/>`:`<circle cx="78" cy="118" r="13" fill="#fff"/><circle cx="80" cy="${v===2?123:120}" r="7" fill="#2E2219"/><circle cx="122" cy="118" r="13" fill="#fff"/><circle cx="124" cy="${v===2?123:120}" r="7" fill="#2E2219"/>`}
    <ellipse cx="60" cy="140" rx="9" ry="5" fill="#F7A8C4"/><ellipse cx="140" cy="140" rx="9" ry="5" fill="#F7A8C4"/><path d="${m}" ${v===4?'fill="#2E2219"':'fill="none" stroke="#2E2219" stroke-width="6" stroke-linecap="round"'}/></svg>`;}
const confSelf=L=>(L&&L.uid&&progOf(L.uid).conf)||{};
function confTeach(L){const o={};for(const x of txAll("conf"))if(x.lid===L.id&&x.ym&&(!o[x.ym]||(x.at||0)>(o[x.ym].at||0)))o[x.ym]=x;return o;}
function confSeries(L,n){const months=[];const d=new Date();d.setDate(1);for(let i=(n||6)-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(ymd(x).slice(0,7));}
  const me=confSelf(L),t=confTeach(L);return months.map(ym=>{const a=me[ym]&&+me[ym].v||null,b=t[ym]&&+t[ym].v||null;return {ym,self:a,teach:b,avg:a&&b?(a+b)/2:a||b||null};});}
function confDropping(L){const s=confSeries(L,3).map(x=>x.avg);return s.every(v=>v!=null)&&s[1]<s[0]&&s[2]<s[1];}
function confChart(L){const s=confSeries(L,6),W=320,H=150,px=i=>28+i*(W-44)/5,py=v=>H-24-(v-1)*(H-44)/3;
  const line=(k,c,dash)=>{const pts=s.map((x,i)=>x[k]?[px(i),py(x[k])]:null);let d="";pts.forEach((p,i)=>{if(!p)return;d+=(d&&pts[i-1]?"L":"M")+p[0]+" "+p[1];});return `${d?`<path d="${d}" fill="none" stroke="${c}" stroke-width="3" ${dash?'stroke-dasharray="6 5"':""} stroke-linecap="round" stroke-linejoin="round"/>`:""}${pts.map(p=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${c}"/>`:"").join("")}`;};
  const mon=ym=>new Date(ym+"-15").toLocaleString(undefined,{month:"short"});
  return `<svg viewBox="0 0 ${W} ${H}" class="confchart" role="img" aria-label="Confidence over the last 6 months">${[1,2,3,4].map(v=>`<line x1="28" x2="${W-16}" y1="${py(v)}" y2="${py(v)}" stroke="#D5E8BE"/><text x="2" y="${py(v)+4}" font-size="10" fill="#5C4F45">${["","Shy","Bit shy","Okay","Brave"][v]}</text>`).join("")}
    ${s.map((x,i)=>`<text x="${px(i)}" y="${H-6}" font-size="10" text-anchor="middle" fill="#5C4F45">${mon(x.ym)}</text>`).join("")}${line("teach","#4BA3E3",true)}${line("self","#2F8F46")}</svg>
    <p class="small muted" style="margin:0"><span style="color:#2F8F46">●</span> How ${esc(firstOf(L.name))} feels &nbsp; <span style="color:#4BA3E3">●</span> Teacher, in class</p>`;}
function confSentence(L){const s=confSeries(L,6).filter(x=>x.avg!=null),f=firstOf(L.name);if(!s.length)return `${f} will start sharing how brave they feel speaking English each month.`;
  const last=s[s.length-1],first=s[0];if(s.length===1)return `${f} feels “${CONF_T[Math.round(last.avg)].toLowerCase()}” speaking English this month. We'll track it gently each month.`;
  if(last.avg>first.avg)return `${f} is growing braver about speaking English: from “${CONF_T[Math.round(first.avg)].toLowerCase()}” to “${CONF_T[Math.round(last.avg)].toLowerCase()}”.`;
  if(last.avg<first.avg)return `${f} feels a little less sure speaking lately. That's normal while learning; lots of encouragement at home helps.`;
  return `${f}'s speaking confidence is steady. Celebrating small tries at home keeps it growing.`;}
function confParentHTML(L){if(!L||!L.uid)return "";return `<section class="card panel"><h2>Speaking confidence</h2><p>${esc(confSentence(L))}</p>${confChart(L)}</section>`;}

/* ================= Feature 3: Friday highlight reel (built on the device, never stored) ================= */
/* the reel week runs from last Friday to this Thursday; on Fridays it's brand new */
function reelWeek(){const d=new Date();d.setHours(0,0,0,0);const back=(d.getDay()+2)%7;const start=new Date(d.getTime()-back*864e5);return {start:start.getTime(),fresh:d.getDay()===5||d.getDay()===6||d.getDay()===0};}
function reelClips(L){if(!L||!L.uid)return [];const w=reelWeek(),since=Math.min(w.start,Date.now()-7*864e5);
  const xs=kpItems(L.uid).filter(x=>x.kind==="audio"&&x.data&&(x.at||0)>=since);
  const keep=x=>!!pipTry(()=>(pcFor(x.id)||{}).keep);
  return xs.sort((a,b)=>(keep(b)-keep(a))||((b.at||0)-(a.at||0))).slice(0,8);}
const reelCaption=x=>{const t=String(x.title||"").replace(/^Saying\s+/,"");return t||"A new recording";};
function reelCardHTML(L){if(!L||!L.uid)return "";if(!D.kp[L.uid])loadKp(L.uid);const cs=reelClips(L),f=firstOf(L.name),w=reelWeek();
  return `<section class="reelcard">${art("pip",60,"Pip")}<div class="grow"><span class="eyebrow">${w.fresh?"New this Friday":"This week"}</span><b>This week in ${esc(f)}'s garden</b>
    ${cs.length?`<span>${cs.length} clip${cs.length===1?"":"s"} from this week, up to 60 seconds.</span><div class="row adbtns"><button class="btn btn-primary btn-sm" data-act="reelPlay" data-id="${esc(L.id)}">${ic("play")}Play the reel</button></div>`
      :`<span>No recordings this week yet. Record a word with ${esc(f)} this weekend! 🎤</span>`}</div></section>`;}
let REEL=null;
A.reelPlay=lid=>{const L=learner(lid);if(!L)return;const cs=reelClips(L);if(!cs.length)return;const f=firstOf(L.name);
  REEL={i:-1,cs,f,t0:Date.now(),used:0,audio:null,timer:null,paused:false};
  openModal(`This week in ${f}'s garden`,`<div class="reel" id="reel" aria-live="polite"></div><div class="reelbar"><i id="reel-p"></i></div>`,{wide:true,noFocus:true,
    footerExtra:`<button type="button" class="btn btn-ghost" data-mact="pause" id="reel-pause">Pause</button><button type="button" class="btn btn-ghost" data-mact="skip">Next ${ic("fwd")}</button>`,
    actions:{skip:()=>reelNext(),pause:()=>{if(!REEL)return;REEL.paused=!REEL.paused;const b=document.getElementById("reel-pause");if(b)b.textContent=REEL.paused?"Play":"Pause";clearTimeout(REEL.timer);if(REEL.audio){REEL.paused?REEL.audio.pause():REEL.audio.play().catch(()=>{});}else if(!REEL.paused)REEL.timer=setTimeout(reelNext,1500);}}});
  reelScreen(`${art("pip",120,"Pip")}<h2>This week in ${esc(f)}'s garden</h2><p>Listen to ${esc(f)} grow! 🌱</p>`);REEL.timer=setTimeout(reelNext,2800);
  const obs=setInterval(()=>{if(!document.getElementById("reel")){clearInterval(obs);reelStop();}},500);};
function reelScreen(h){const el=document.getElementById("reel");if(el)el.innerHTML=h;}
function reelStop(){if(!REEL)return;clearTimeout(REEL.timer);if(REEL.audio){try{REEL.audio.pause()}catch(e){}}REEL=null;}
function reelNext(){if(!REEL)return;clearTimeout(REEL.timer);if(REEL.audio){try{REEL.audio.pause()}catch(e){}REEL.audio=null;}
  REEL.i++;const r=REEL;
  if(r.i>=r.cs.length||r.used>=60){reelScreen(`${art("bloom",110,"Bloom")}<h2>See you next week!</h2><p>${esc(r.f)} is blooming. Keep growing together. 🌸</p>`);const p=document.getElementById("reel-p");if(p)p.style.width="100%";return;}
  const x=r.cs[r.i],left=Math.max(1,60-r.used);
  reelScreen(`<div class="reelclip"><span class="pill p-sun">${r.i+1} of ${r.cs.length}</span><b class="reelcap">${esc(reelCaption(x))}</b><span class="small muted">${esc(fmtDay(new Date(x.at)))}</span><div class="reelwave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>`);
  const a=new Audio(x.data);r.audio=a;const started=Date.now();
  const done=()=>{if(REEL!==r||r.audio!==a)return;r.used+=Math.min(left,(Date.now()-started)/1000);const p=document.getElementById("reel-p");if(p)p.style.width=Math.min(100,r.used/60*100)+"%";reelNext();};
  a.onended=done;a.onerror=()=>{r.timer=setTimeout(done,1200);};a.play().catch(()=>{r.timer=setTimeout(done,2500);});
  r.timer=setTimeout(()=>{try{a.pause()}catch(e){}done();},left*1000);}

/* ================= Feature 4: Teach Pip (role reversal) ================= */
function teachWord(L){const uid=L&&L.uid;if(!uid)return null;const p=progOf(uid),wk=p.wk||{},taught=p.taught||{};
  const recent=doneList(uid).slice(0,4).map(x=>lessonById(x.lid)).filter(Boolean);const nx=nextLesson(uid,learnerCourses(L));if(nx)recent.push(nx);
  const pool=[];const seen=new Set();for(const l of recent){const c=D.courses[l.courseId];for(const [w,m] of parseVocab(l.vocab)){const k=wkKey(w);if(!k||seen.has(k))continue;seen.add(k);pool.push({w,m,lang:langOf(c),k});}}
  if(!pool.length)for(const [w,m] of (STARTER[L.stage]||STARTER.Seeds)){pool.push({w,m,lang:"en-IN",k:wkKey(w)});}
  const score=x=>{const o=wk[x.k]||{};return (+o.r||0)+(+o.m||0)+(+taught[x.k]||0)*3;};
  const skip=S.teachSkip||[];const order=pool.filter(x=>!skip.includes(x.k)).sort((a,b)=>score(a)-score(b));return order[0]||pool[0];}
const teachStars=uid=>Object.keys(progOf(uid).pts||{}).filter(k=>k[0]==="t").length;
A.teachPip=()=>{const L=myLearner();if(!L)return;if(timeUp()){render();return}const x=teachWord(L);if(!x){toast("Finish a lesson first, then teach Pip!",true);return}
  const seeds=(L.stage||"Seeds")==="Seeds",lim=recLimit(L),emo=emoOf(x.w);let clip=null,rec=false,done=false;
  const draw=()=>{if(done){openModal("Thank you, teacher!",`<div class="drill">${art("pip",110,"Pip")}<p class="lede" style="margin:0">Yay! Now I know <b>${esc(x.w)}</b>! You're a great teacher!</p><p class="bigstars">🎓</p><p class="small muted">You earned a Teacher star. Your teacher can listen to your lesson too.</p></div>`,{footerExtra:`<button type="button" class="btn btn-leaf" data-mact="again">Teach another word</button>`,actions:{again:()=>{closeModal();setTimeout(A.teachPip,200);}}});return}
    openModal("Teach Pip",`<div class="drill teachpip">${art("pip",96,"Pip")}<div class="bubble static">I don't know this word! Can you teach me?</div>
      ${emo?`<span class="dtemo" aria-hidden="true" style="font-size:3.4rem">${emo}</span>`:""}<b class="dword">${esc(x.w)}</b>
      <p class="small muted" style="margin:0">${seeds?(emo?"Point at the picture and say the word to Pip.":"Say the word to Pip and show what it means."):"Tell Pip what it means, and use it in a sentence."} Up to ${lim} seconds.</p>
      ${canSpeak()?`<button type="button" class="btn btn-ghost btn-sm" data-mact="hear">${ic("sound")}How do I say it?</button>`:""}
      ${canRecord()?`<button type="button" class="btn ${rec?"btn-danger":"btn-sun"} btn-big" data-mact="rec">${rec?"■ Stop":clip?"🎤 Teach again":"🎤 Teach Pip"}</button>${clip?`<audio controls src="${esc(clip)}"></audio>`:""}`:`<p class="small">This device can't record, so teach Pip out loud, then tap “I taught Pip”.</p>`}</div>`,
     {noFocus:true,submitLabel:canRecord()?"Send my lesson to Pip":"I taught Pip",footerExtra:`<button type="button" class="btn btn-ghost" data-mact="other">Another word</button>`,
      actions:{hear:()=>say(x.w,x.lang),other:()=>{S.teachSkip=[...(S.teachSkip||[]),x.k].slice(-6);closeModal();setTimeout(A.teachPip,150);},
        rec:async()=>{if(rec){stopRec();return}const ok=await startRec(lim,u=>{rec=false;clip=u;draw();});if(ok){rec=true;draw();}}},
      onSubmit:async()=>{if(canRecord()&&!clip)throw userErr("Teach Pip first: tap the microphone and talk.");
        const ts=Date.now();if(clip)await S.db.collection(`kp/${S.uid}/x`).doc().set({kind:"audio",title:`Teaching Pip “${x.w}”`,data:clip,at:ts,act:"teachpip",word:x.w});
        const p=progOf(S.uid);await earn({pts:{["t"+ts.toString(36)]:1},taught:{[x.k]:(+((p.taught||{})[x.k])||0)+1}});wkLog(x.w,true);
        if(clip)prunePractice(S.uid,"teachpip");done=true;setTimeout(draw,250);}});};
  draw();};

/* ================= Feature 6: Sound pairs (listen, tap the picture, then say it) ================= */
/* real, child-friendly words only; each pair is [word A, picture A, word B, picture B] */
const SP=[
  {id:"pf",label:"p / f",tip:"For p, pop your lips together. For f, rest your top teeth on your bottom lip and blow.",seeds:1,pairs:[["pan","🍳","fan","💨"],["pin","📌","fin","🦈"],["pear","🍐","fair","🎡"]]},
  {id:"ssh",label:"s / sh",tip:"For s, smile and hiss like a snake: sss. For sh, push your lips forward: shhh!",seeds:1,pairs:[["sip","🥤","ship","🚢"],["sea","🌊","she","👧"],["sock","🧦","shock","⚡"]]},
  {id:"ii",label:"short i / long ee",tip:"Short i is quick: ship. Long ee is a long, big smile: sheeep.",seeds:1,pairs:[["ship","🚢","sheep","🐑"],["bin","🗑️","bean","🫘"],["hill","⛰️","heel","👠"]]},
  {id:"vw",label:"v / w",tip:"For v, top teeth gently touch your bottom lip and buzz. For w, make your lips round like a little o.",pairs:[["vet","🩺","wet","💦"],["vest","🎽","west","🧭"],["veil","👰","whale","🐋"]]},
  {id:"thd",label:"th / d",tip:"For th, put the tip of your tongue softly between your teeth. For d, tap your tongue just behind your top teeth.",pairs:[["they","👫","day","☀️"],["those","👉","doze","😴"],["then","⏭️","den","🦁"]]},
  {id:"zj",label:"z / j",tip:"For z, buzz like a bee: zzz. For j, it's one quick jump: j!",pairs:[["zoo","🦓","juice","🧃"],["zip","🤐","jeep","🚙"],["zero","0️⃣","jelly","🍮"]]}];
const spGroups=L=>(L&&(L.stage||"Seeds")==="Seeds")?SP.filter(g=>g.seeds):SP;
const spStats=uid=>progOf(uid).sp||{};
const spMiss=o=>o&&o.t?(+o.m||0)/o.t:0;
/* hard pairs come up more often */
function spRounds(L,n){const gs=spGroups(L),st=spStats(L.uid),out=[];let last="";
  for(let i=0;i<n;i++){const w=gs.map(g=>1+3*spMiss(st[g.id])+(st[g.id]?0:1));let r=Math.random()*w.reduce((a,b)=>a+b,0),g=gs[0];
    for(let k=0;k<gs.length;k++){r-=w[k];if(r<=0){g=gs[k];break}}
    let p=g.pairs[Math.floor(Math.random()*g.pairs.length)];if(p[0]===last)p=g.pairs[(g.pairs.indexOf(p)+1)%g.pairs.length];last=p[0];
    const side=Math.random()<.5?0:1,swap=Math.random()<.5;out.push({g,p,side,swap});}
  return out;}
function spTricky(L,min){const st=spStats(L&&L.uid);return spGroups(L).map(g=>({g,o:st[g.id]})).filter(x=>x.o&&x.o.t>=(min||3)&&spMiss(x.o)>=.34).sort((a,b)=>spMiss(b.o)-spMiss(a.o));}
let SPG=null;
const spSpeak=(w,slow)=>{if(!canSpeak())return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-IN";u.rate=slow?.6:.8;speechSynthesis.speak(u);}catch(e){}};
A.soundPairs=()=>{const L=myLearner();if(!L)return;if(timeUp()){render();return}
  SPG={L,rs:spRounds(L,6),i:0,score:0,pick:null,heard:null,stars:0,recording:false,said:false,clip:null,reveal:false,miss:{}};spDraw(true);};
function spDraw(auto){const G=SPG;if(!G)return;if(G.i>=G.rs.length)return spEnd();const R=G.rs[G.i],w=R.p[R.side*2],seeds=(G.L.stage||"Seeds")==="Seeds";
  const opts=[[R.p[0],R.p[1]],[R.p[2],R.p[3]]];if(R.swap)opts.reverse();const sr=!!SR,rec=canRecord(),tts=canSpeak();
  const res=G.pick==null?"":G.pick===w?`<div class="sayres s3" aria-live="polite"><p class="saymsg">Yes! You heard <b>${esc(w)}</b>. 🌱</p></div>`
    :`<div class="sayres s1" aria-live="polite"><p class="saymsg">Good listening! This one was <b>${esc(w)}</b>, not ${esc(G.pick)}. Listen again.</p><p class="small" style="margin:0">${esc(R.g.tip)}</p></div>`;
  const sayRes=G.said?`<p class="saymsg">Well done for saying it out loud! 🎤</p>`:G.heard!=null?`<div class="sayres s${G.stars||0}">${sayStarsHTML(G.stars||0)}<p class="sayheard">${G.heard?`Pip heard: <b>“${esc(G.heard)}”</b>`:"Pip didn't hear anything."}</p><p class="saymsg">${SAYMSG[G.stars||0]}</p></div>`:"";
  openModal("Sound pairs",`<div class="drill sp"><div class="row" style="justify-content:center;gap:8px"><span class="pill p-mute">Round ${G.i+1} of ${G.rs.length}</span><span class="pill p-sun">${esc(R.g.label)}</span></div>
    ${G.pick==null?`<p class="lede" style="margin:0">Listen, then tap the picture you hear.</p>
      ${tts?`<button type="button" class="btn btn-sun btn-big" data-mact="hear">${ic("sound",22)}Listen</button>`
        :`<p class="small muted" style="margin:0">This device can't read aloud. Grown-up, please say the word for your child.</p><button type="button" class="btn btn-ghost btn-sm" data-mact="reveal">${G.reveal?`The word is: <b>${esc(w)}</b>`:"Grown-up: show me the word"}</button>`}`
    :`${res}`}
    <div class="sppick">${opts.map(([ow,oe])=>`<button type="button" class="spbtn${G.pick!=null&&ow===w?" ok":""}${G.pick===ow&&ow!==w?" no":""}" data-mact="pick" data-v="${esc(ow)}" ${G.pick!=null?"disabled":""} aria-label="${esc(ow)}"><span class="spemo" aria-hidden="true">${oe}</span><b class="${seeds?"small":""}">${esc(ow)}</b></button>`).join("")}</div>
    ${G.pick!=null?`<div class="drow">${tts?`<button type="button" class="btn btn-ghost" data-mact="hear">${ic("sound")}Hear it again</button>`:""}
      ${rec||sr?`<button type="button" class="btn ${G.recording?"btn-danger":"btn-primary"}" data-mact="say">${G.recording?(rec?"■ Stop":"Listening…"):(G.heard!=null||G.clip?"🎤 Try again":"🎤 Now say it")}</button>`:`<button type="button" class="btn btn-ghost" data-mact="said">I said it!</button>`}</div>
      ${sayRes}${G.clip&&!sr?`<audio controls src="${esc(G.clip)}"></audio>`:""}<p class="small muted" style="margin:0">Pip's stars are for practice. Your teacher gives your real speaking score.</p>`:""}</div>`,
  {noFocus:true,footerExtra:G.pick!=null?`<button type="button" class="btn btn-leaf" data-mact="next">${G.i<G.rs.length-1?"Next round":"Finish"} ${ic("fwd")}</button>`:"",
   actions:{hear:()=>spSpeak(w,G.pick!=null&&G.pick!==w),reveal:()=>{G.reveal=!G.reveal;spDraw();},
    pick:(v,el)=>{const val=(el&&el.dataset&&el.dataset.v)||v;if(G.pick!=null||!val)return;G.pick=val;const ok=val===w;if(ok)G.score++;else G.miss[R.g.id]=(G.miss[R.g.id]||0)+1;
      const o=spStats(S.uid)[R.g.id]||{};earn({sp:{[R.g.id]:{t:(+o.t||0)+1,m:(+o.m||0)+(ok?0:1),at:Date.now()}}}).catch(()=>{});
      spDraw();if(!ok)setTimeout(()=>spSpeak(w,true),400);},
    said:()=>{G.said=true;spDraw();},
    say:async()=>{if(G.recording){if(rec)stopRec();return}G.heard=null;G.stars=0;G.clip=null;
      const listen=()=>{if(!sr)return;try{const r=new SR();r.lang="en-IN";r.maxAlternatives=5;let got=false;
        r.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript);const sc=sayScore(w,alts);G.heard=sc.heard;G.stars=sc.stars;wkLog(w,sc.stars>=2);if(!rec)G.recording=false;if(!G.recording)spDraw();};
        r.onerror=()=>{if(!rec){G.recording=false;G.heard=G.heard??"";spDraw();}};r.onend=()=>{if(!rec&&G.recording){G.recording=false;if(!got)G.heard="";spDraw();}};
        r.start();setTimeout(()=>{try{r.stop()}catch{}},5000);}catch(e){}};
      if(rec){const ok=await startRec(5,url=>{G.recording=false;G.clip=url;if(G.heard==null&&sr)G.heard="";spDraw();});if(!ok)return;G.recording=true;spDraw();listen();}
      else{G.recording=true;spDraw();listen();}},
    next:()=>{if(G.recording&&canRecord())try{stopRec()}catch(e){}if(timeUp()){SPG=null;closeModal();render();return}
      G.i++;Object.assign(G,{pick:null,heard:null,stars:0,recording:false,said:false,clip:null,reveal:false});spDraw(true);}}});
  if(auto&&G.pick==null&&canSpeak())setTimeout(()=>{if(SPG===G&&G.pick==null)spSpeak(w);},500);}
function spEnd(){const G=SPG;if(!G)return;SPG=null;const ts=Date.now();
  if(G.score>=4)earn({pts:{["p"+ts.toString(36)]:1}}).catch(()=>{});
  const hard=Object.keys(G.miss).sort((a,b)=>G.miss[b]-G.miss[a]).map(id=>SP.find(g=>g.id===id)).filter(Boolean)[0];
  openModal("Sound pairs",`<div class="drill">${art(G.score>=4?"bloom":"pip",110,G.score>=4?"Bloom":"Pip")}<p class="lede" style="margin:0">You got <b>${G.score} of ${G.rs.length}</b>! ${G.score>=5?"Super listening ears! 👂":G.score>=3?"Great listening!":"Good try! Listening gets easier every time."}</p>
    ${G.score>=4?`<p class="bigstars">⭐</p><p class="small muted" style="margin:0">You earned a star.</p>`:""}
    ${hard?`<div class="sptip"><b>Tricky one: ${esc(hard.label)}</b><span>${esc(hard.tip)}</span></div>`:""}</div>`,
   {footerExtra:`<button type="button" class="btn btn-leaf" data-mact="again">Play again</button>`,actions:{again:()=>{closeModal();setTimeout(A.soundPairs,200);}}});}
function spBars(L){const st=spStats(L.uid);return `<div class="spbars">${spGroups(L).map(g=>{const o=st[g.id];const pct=o&&o.t?Math.round(100*(1-spMiss(o))):null;
  return `<div class="spbar"><b>${esc(g.label)}</b><div class="sptrack" aria-hidden="true"><i style="width:${pct==null?0:pct}%"></i></div><span class="small muted">${pct==null?"Not tried yet":`${pct}% heard right · ${o.t} tr${o.t===1?"y":"ies"}`}</span></div>`;}).join("")}</div>`;}
/* parent: tricky sounds card on Progress */
function spParentHTML(L){if(!L||!L.uid)return "";const st=spStats(L.uid);if(!Object.keys(st).length)return "";const tk=spTricky(L,3).slice(0,2);const f=firstOf(L.name);
  return `<section class="card panel"><h2>Sound pairs</h2><p class="small muted">The listening game for sounds that are easy to mix up. ${esc(f)} plays it from the home screen.</p>${spBars(L)}
    ${tk.length?`<div class="sptips">${tk.map(x=>`<div class="sptip"><b>Practise together: ${esc(x.g.label)}</b><span>${esc(x.g.tip)} Try: ${x.g.pairs.map(p=>`${esc(p[0])} / ${esc(p[2])}`).join(", ")}.</span></div>`).join("")}</div>`:`<p class="small">No tricky pairs right now. Lovely listening!</p>`}</section>`;}
function soundsView(){const r=role();
  if(r==="student"||r==="parent"){const L=r==="parent"?curKid():myLearner();if(!L)return pendingHTML();
    if(r==="parent")return `<div class="head"><div><h1>Sound pairs</h1><p class="lede">How ${esc(firstOf(L.name))} is getting on with sounds that are easy to mix up.</p></div></div>${kidBar()}${spParentHTML(L)||`<section class="card panel"><p class="muted">${esc(firstOf(L.name))} hasn't played Sound pairs yet.</p></section>`}`;
    const tk=spTricky(L,2)[0];

      <section class="adapt">${art("pip",72,"Pip")}<div class="grow"><b>Ready, listening ears?</b><span>6 quick rounds. ${tk?`Pip will help you with ${esc(tk.g.label)}.`:""}</span><div class="row adbtns"><button class="btn btn-primary" data-act="soundPairs">${ic("play")}Play Sound pairs</button></div></div></section>

  const ls=bsel?all.filter(L=>(bsel.learners||[]).includes(L.id)):all;
  const rows=SP.map(g=>{let t=0,m=0,kids=0;const hard=[];for(const L of ls){const o=spStats(L.uid)[g.id];if(!o||!o.t)continue;kids++;t+=o.t;m+=+o.m||0;if(o.t>=3&&spMiss(o)>=.4)hard.push({L,r:spMiss(o)});}
    return {g,t,m,kids,rate:t?m/t:0,hard:hard.sort((a,b)=>b.r-a.r)};}).sort((a,b)=>b.rate-a.rate);
  const any=rows.some(x=>x.t);

/* ================= Feature 7: Speaking passport (Blooms only) ================= */
/* the learner picks items (progress/{uid}.spk), a parent approves that exact selection
   (msn/{parent}/x/spk-{lid}, kind "passport"), the trainer adds an endorsement (tw kind "endorse").
   Nothing leaves the app: "Download as PDF" uses the device's own print-to-PDF. */
const ppIsBlooms=L=>!!L&&(L.stage||"")==="Blooms";
const ppSel=L=>{const x=(L&&L.uid&&progOf(L.uid).spk)||{};return {items:(x.items||[]).filter(Boolean),hw:(x.hw||[]).filter(Boolean),intro:x.intro||"",at:x.at||0};};
const ppSig=s=>{const t=JSON.stringify([[...s.items].sort(),[...s.hw].sort(),s.intro]);let h=5381;for(let i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return h.toString(36);};
function ppApproval(L){if(!L)return null;msnLoad(L);let best=null;for(const [u,xs] of Object.entries(D.msn||{})){const x=(xs||{})["spk-"+L.id];if(x&&x.kind==="passport"&&x.lid===L.id&&(!best||(x.at||0)>(best.at||0)))best={...x,uid:u};}return best;}
const ppApproved=L=>{const a=ppApproval(L),s=ppSel(L);return !!(a&&a.sig&&a.sig===ppSig(s)&&(s.items.length||s.hw.length));};
const ppEndorse=L=>{let best=null;for(const x of txAll("endorse"))if(x.lid===L.id&&x.text&&(!best||(x.at||0)>(best.at||0)))best=x;return best;};
const ppSpeeches=L=>kpItems(L.uid).filter(x=>x.kind==="audio"&&x.data&&!PRACTICE_ACTS.has(x.act));
const ppWriting=L=>kpItems(L.uid).filter(x=>(x.kind==="photo"||x.kind==="draw"||x.kind==="note")&&x.data);
const ppHw=L=>(pipTry(()=>hwFor(L))||[]).map(h=>({h,a:answerOf(L,h)})).filter(x=>x.a&&String(x.a.text||"").trim().length>=40);
const PP_MARK=`<svg class="ppmark" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="56" r="30" fill="#E8492F"/><circle cx="144" cy="92" r="30" fill="#E8492F"/><circle cx="128" cy="146" r="30" fill="#E8492F"/><circle cx="72" cy="146" r="30" fill="#E8492F"/><circle cx="56" cy="92" r="30" fill="#E8492F"/><circle cx="100" cy="104" r="30" fill="#FFC94A"/></svg>`;
/* the passport itself (used on screen and for the PDF) */
function ppDocHTML(L,forPrint){const s=ppSel(L),f=firstOf(L.name),sp=ppSpeeches(L).filter(x=>s.items.includes(x.id)),wr=ppWriting(L).filter(x=>s.items.includes(x.id)),hw=ppHw(L).filter(x=>s.hw.includes(x.h.key));
  const certs=pipTry(()=>certsOf(L))||[],bs=(pipTry(()=>badgesOf(L))||[]).filter(b=>b.ok),as=(pipTry(()=>assessFor(L))||[])[0],en=ppEndorse(L),ap=ppApproval(L),ok=ppApproved(L);
  const sec=(t,b)=>b?`<section class="ppsec"><h3>${t}</h3>${b}</section>`:"";
  return `<article class="ppdoc" aria-label="Speaking passport">
    <header class="pphead">${PP_MARK}<div class="grow"><span class="ppeyebrow">Speaking passport</span><h2>${esc(L.name)}</h2><span class="ppsub">Blooms · ages 11–15 · Little Lingos</span></div></header>
    ${s.intro?`<p class="ppintro">“${esc(s.intro)}”</p>`:""}
    ${sec("Best speeches and debates",sp.length?`<ul class="pplist">${sp.map(x=>`<li><b>${esc(x.title||"Recording")}</b><span>${esc(fmtDay(new Date(x.at)))}</span>${forPrint?`<span class="ppnote">Audio: listen in the Little Lingos app</span>`:`<audio controls preload="none" src="${esc(x.data)}"></audio>`}</li>`).join("")}</ul>`:"")}
    ${sec("Best writing",wr.length||hw.length?`<div class="ppwrite">${wr.map(x=>`<figure><img src="${esc(x.data)}" alt="${esc(x.title||"Writing")}"><figcaption>${esc(x.title||"Writing")} · ${esc(fmtDay(new Date(x.at)))}</figcaption></figure>`).join("")}${hw.map(x=>`<blockquote><b>${esc(x.h.title||"Writing task")}</b><p>${esc(String(x.a.text).trim().slice(0,600))}${String(x.a.text).trim().length>600?"…":""}</p></blockquote>`).join("")}</div>`:"")}
    ${sec("Skills",as&&as.skills?`<div class="ppskills">${SKILLS.map(([k,l])=>`<div><span>${l}</span><b>${as.skills[k]?`${+as.skills[k]} / 5`:"–"}</b></div>`).join("")}</div><p class="ppsmall">From the trainer's assessment, ${esc(fmtDay(new Date(as.at)))}${as.level?` · ${esc(as.level)}`:""}</p>`:"")}
    ${sec("Speaking confidence",`<p>${esc(pipTry(()=>confSentence(L))||"")}</p>`)}
    ${sec("Certificates",certs.length?`<ul class="ppchips">${certs.map(c=>`<li>${esc((c.c&&c.c.title)||"Certificate")} · ${esc(fmtDay(new Date(c.at)))}</li>`).join("")}</ul>`:"")}
    ${sec("Badges",bs.length?`<ul class="ppchips">${bs.map(b=>`<li>${esc(b.t)}</li>`).join("")}</ul>`:"")}
    ${sec("Trainer's endorsement",en?`<blockquote class="ppend"><p>“${esc(en.text)}”</p><cite>${esc(byWho(en.uid))} · ${esc(fmtDay(new Date(en.at)))}</cite></blockquote>`:"")}
    <footer class="ppfoot"><span><b>little lingos</b> · Where words grow.</span><span>${ok?`Approved by a parent on ${esc(fmtDay(new Date(ap.at)))}`:"Not yet approved by a parent"}</span></footer></article>`;}
/* small cards that lead to the passport */
function ppMeHTML(L){if(!ppIsBlooms(L))return "";const s=ppSel(L),n=s.items.length+s.hw.length,ok=ppApproved(L);

function ppParentHTML(L){if(!ppIsBlooms(L)||!L.uid)return "";const s=ppSel(L),n=s.items.length+s.hw.length,ok=ppApproved(L),f=firstOf(L.name);

function ppStaffHTML(L){if(!ppIsBlooms(L))return "";const en=ppEndorse(L),s=ppSel(L);

    <div class="row"><button type="button" class="btn btn-ghost btn-sm" data-mact="ppend">${en?"Edit endorsement":"Write endorsement"}</button><button type="button" class="btn btn-ghost btn-sm" data-mact="ppview">View passport</button></div></div>`;}
A.ppEndorseEdit=lid=>{const L=learner(lid);if(!L||!isStaff())return;const en=ppEndorse(L);
  openModal("Passport endorsement",`<p class="small muted">Shown on ${esc(firstOf(L.name))}'s speaking passport, which parents may share with schools. Keep it specific and true.</p><div class="field"><label for="pe-t">Endorsement</label><textarea id="pe-t" name="t" rows="4" maxlength="320" placeholder="[A short, honest note about how this learner speaks and presents]">${esc((en&&en.uid===S.uid&&en.text)||"")}</textarea></div>`,

    +`<p class="small muted">The passport stays inside the app. “Download as PDF” opens your device's print screen: choose “Save as PDF”.</p>`;}
