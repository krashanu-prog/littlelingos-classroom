<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22703A">
<meta name="description" content="Little Lingos Classroom: classes, progress, homework and fees for learners, parents and trainers.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}
#ll-gate{position:fixed;inset:0;z-index:9999;overflow:auto;background:var(--ground);display:flex}
#ll-gate .center{margin:auto;padding:24px 16px;width:100%;box-sizing:border-box;display:flex;justify-content:center}
#ll-gate .ll-gate-card{max-width:440px;width:100%;align-items:stretch;gap:14px}
#ll-gate h1{margin:0}#ll-gate form{display:flex;flex-direction:column;gap:12px}
.ll-brand{--ls:40px;display:flex;align-items:center;gap:8px;align-self:center;margin-bottom:4px}.ll-brand .lg-pip{width:52px;height:64px;flex:none}</style>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="adapter.js"></script>
</head>
<body>
<title>Little Lingos Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: app shell — left rail on desktop, scrollable bottom tab bar on phones, content column ~1080px.
   Word Garden (brand Concept B): one bright daylight look on purpose, so there is no dark variant. */
:root{
  --ground:#F5FAEE; --card:#FFFFFF; --soft:#EEF2E8; --line:#D5E8BE;
  --soil:#2E2219; --muted:#5C4F45;
  --leaf:#22703A; --leafMid:#2F8F46; --leafSoft:#DDEFC4; --sprout:#A6DB5C; --grass:#7CC243;
  --tomato:#E8492F; --cta:#D23C24; --ctaInk:#FFFFFF;
  --sky:#BFE3FA; --skySoft:#D7ECFA; --skyText:#1F6FA8; --skyDeep:#4BA3E3;
  --petal:#F7A8C4; --petalSoft:#FBE0EA; --sun:#FFC94A; --sunSoft:#FFF4D1; --peach:#FFE3D9;
  --good:#22703A; --goodSoft:#E5F4D3; --warn:#8A5A2B; --bad:#B83A24; --badSoft:#FFE3D9;
  --c0:#22703A; --c0s:#DDEFC4; --c1:#B83A24; --c1s:#FFE3D9; --c2:#1F6FA8; --c2s:#D7ECFA; --c3:#A83B67; --c3s:#FBE0EA; --c4:#8A5A2B; --c4s:#FFF4D1;
  --b0:#2F8F46; --b1:#E8492F; --b2:#4BA3E3; --b3:#D9789E; --b4:#E0A52A;
  --display:"Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--soil);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,1.5rem + 1.6vw,2.6rem)}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:0}
a{color:var(--leaf)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--skyDeep);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf)}

/* top bar + shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:64px}
.brand{--ls:34px;display:flex;align-items:center;gap:calc(var(--ls)*.2);text-decoration:none;color:var(--soil);margin-right:auto}
.brand .lg-pip{width:calc(var(--ls)*1.3);height:calc(var(--ls)*1.6);flex:none}
.wm{display:inline-flex;align-items:baseline;gap:calc(var(--ls)*.13);font-family:var(--display);line-height:1;white-space:nowrap}
.wm b{font-weight:700;font-size:calc(var(--ls)*.46);color:var(--soil)}
.wm span{position:relative;font-weight:800;font-size:var(--ls);color:#22703A;letter-spacing:-.01em}
.wm .lg-leaf{position:absolute;right:-.16em;top:-.02em;width:.3em;height:.3em}
.brand:hover .lg-pip{transform:rotate(-6deg)}.brand .lg-pip{transition:transform .2s}
.viewas{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);font-weight:700;white-space:nowrap}
.viewas select{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;color:var(--soil);min-height:40px}
.me{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:4px;border-radius:999px;min-height:44px}
.me .av{width:40px;height:40px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.me span.nm{font-weight:700;font-size:.92rem}
.rolechip{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunSoft);color:var(--warn)}
.bell{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--leaf)}
.bell svg{width:20px;height:20px}
.bell .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--cta);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 5px}

.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 56px}
.nav{position:sticky;top:calc(90px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:700;min-height:46px}
.nav a:hover{background:var(--soft);color:var(--soil)}
.nav a[aria-current="page"]{background:var(--leafSoft);color:var(--leaf)}
.nav svg{width:22px;height:22px;flex:none}
main{min-width:0;display:flex;flex-direction:column;gap:24px}

@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr);padding-block:18px calc(100px + env(safe-area-inset-bottom,0px))}
  .nav{position:fixed;inset:auto 0 0 0;top:auto;z-index:25;flex-direction:row;gap:2px;background:var(--card);border-top:2px solid var(--line);overflow-x:auto;scrollbar-width:none;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:1 0 74px;flex-direction:column;gap:2px;font-size:.7rem;padding:6px 4px;text-align:center;border-radius:18px;min-height:52px;justify-content:center}
  .me span.nm,.viewas label{display:none}
  .brand{--ls:29px}
}

/* building blocks */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head .lede{margin-top:6px}
.lede{color:var(--muted);max-width:64ch}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:20px}
.panel{display:flex;flex-direction:column;gap:12px}
.panel > .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.cols{display:grid;gap:22px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1020px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:999px;padding:10px 20px;font-family:var(--display);font-weight:800;font-size:1.08rem;line-height:1.15;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:48px;transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--cta);color:var(--ctaInk)}
.btn-primary:hover{background:#BC3520}
.btn-leaf{background:var(--leaf);color:#fff}
.btn-sun{background:var(--sun);color:var(--soil)}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--soil)}
.btn-ghost:hover{background:var(--soft)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:6px 14px;font-size:.95rem;min-height:40px}
.btn-wa{background:#1E7F45;color:#fff;border-color:#1E7F45}.btn-wa:hover{background:#176638}
.sharebox{background:var(--soft);border-radius:14px;padding:12px 14px;white-space:pre-wrap;font-size:.95rem;margin:0 0 12px}
.sharerow{display:flex;gap:8px;flex-wrap:wrap}
.btn-big{font-size:1.3rem;padding:14px 26px;min-height:60px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center;cursor:pointer;color:var(--leaf);flex:none}
.iconbtn:hover{background:var(--leafSoft)}
.iconbtn[disabled]{opacity:.35;cursor:not-allowed}
.iconbtn svg{width:17px;height:17px}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap}
.p-good{background:var(--goodSoft);color:var(--good)}
.p-warn{background:var(--sunSoft);color:var(--warn)}
.p-bad{background:var(--badSoft);color:var(--bad)}
.p-info{background:var(--skySoft);color:var(--skyText)}
.p-mute{background:var(--soft);color:var(--muted)}
.p-sun{background:var(--sun);color:var(--soil)}
.chip{font-weight:700;font-size:.88rem;padding:5px 12px;border-radius:999px}

.stamp{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:24px 4px 24px 4px;flex:none;
  color:var(--c,var(--c0));background:var(--cs,var(--c0s));font-family:var(--display);font-weight:800;font-size:1rem}
.stamp.sm{width:34px;height:34px;border-radius:17px 3px 17px 3px;font-size:.74rem}
.stamp.lg{width:70px;height:70px;border-radius:35px 6px 35px 6px;font-size:1.4rem;background:var(--card)}
.h0{--c:var(--c0);--cs:var(--c0s);--b:var(--b0)}.h1{--c:var(--c1);--cs:var(--c1s);--b:var(--b1)}.h2{--c:var(--c2);--cs:var(--c2s);--b:var(--b2)}.h3{--c:var(--c3);--cs:var(--c3s);--b:var(--b3)}.h4{--c:var(--c4);--cs:var(--c4s);--b:var(--b4)}

.course{display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease}
.course:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(46,34,25,.08)}
.course .band{background:var(--cs);padding:16px 18px;display:flex;gap:12px;align-items:center}
.course .band .stamp{background:var(--card)}
.course .cmeta{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}
.course .cbody{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.course p.desc{color:var(--muted);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--b,var(--leafMid))}
.barrow{display:flex;align-items:center;gap:10px}
.barrow .bar{flex:1;min-width:50px}
.barrow b{font-size:.85rem;min-width:3.2ch;text-align:right}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1.5px solid var(--soft);min-height:60px;flex-wrap:wrap}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:150px}
.item .t{font-weight:700}
.item .s{color:var(--muted);font-size:.87rem}
.item.click{cursor:pointer;border-radius:16px;padding-inline:10px;margin-inline:-8px}
.item.click:hover{background:var(--soft)}
.when{flex:none;width:58px;text-align:center;border-radius:18px;background:var(--skySoft);padding:6px 0;line-height:1.05}
.when b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:800}
.when span{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--skyText)}

.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{border-radius:22px;padding:14px 16px;background:var(--card);border:2px solid var(--line)}
.stat.f{border:0}
.stat b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:800;line-height:1.05}
.stat span{font-size:.84rem;color:var(--muted);font-weight:700}
.stat small{display:block;font-size:.78rem;color:var(--muted);margin-top:4px;line-height:1.3}
.stat.go{cursor:pointer;transition:transform .12s ease}.stat.go:hover{transform:translateY(-2px)}

/* garden */
.garden{position:relative;background:var(--sky);border-radius:28px;overflow:hidden;height:270px;flex:none}
.hill{position:absolute;left:-30px;right:-30px;bottom:0;height:70px;background:var(--grass);border-radius:600px 600px 0 0}
.garden .sun{position:absolute;right:14px;top:8px;width:74px;height:74px}
.garden .cloud{position:absolute;right:110px;top:34px;width:84px;height:40px}
.garden .cloud2{position:absolute;left:44%;top:16px;width:64px;height:30px}
.fl{position:absolute;bottom:34px}
.garden .pip{position:absolute;left:calc(50% - 60px);bottom:16px;width:120px;height:120px}
.bubble{position:absolute;background:#fff;font-family:var(--display);font-weight:800;font-size:1.08rem;line-height:1.15;padding:9px 14px;border-radius:18px 18px 18px 4px;max-width:60%}
.bubble.static{position:static;align-self:flex-start;max-width:none}
.skycard{background:var(--sky);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:10px}
.skycard .eyebrow{color:var(--skyText)}
.suncard{background:var(--sunSoft);border-radius:26px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px;border:2px dashed var(--line);border-radius:26px;background:var(--card)}
.empty svg.m{width:88px;height:88px}
.empty p{color:var(--muted);max-width:52ch}

.prose{max-width:66ch;display:flex;flex-direction:column;gap:14px;font-size:1.12rem;line-height:1.7}
.vocab{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.flip{border:2px solid transparent;border-radius:24px;min-height:108px;cursor:pointer;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .12s ease}
.flip:active{transform:scale(.97)}
.flip b{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1}
.flip span{font-size:.75rem;color:var(--muted)}
.flip.on{background:#fff!important;border-color:var(--leafMid)}
.flip.on b{font-family:var(--body);font-weight:700;font-size:1.15rem}
.bloomed{position:relative;background:var(--sky);border-radius:28px;overflow:hidden;padding:24px 20px 104px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;animation:pop .5s ease}
.bloomed .fl{bottom:30px}
@keyframes pop{0%{transform:scale(.94);opacity:.4}100%{transform:none;opacity:1}}

table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1.5px solid var(--soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.off td{opacity:.6}
.tablewrap{overflow-x:auto;margin:0 -4px}
.tablewrap table{min-width:720px}
td .nm{white-space:nowrap;font-weight:700;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:var(--soil);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
td .nm:hover{text-decoration-color:var(--leafMid)}
select.inline{min-width:130px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;min-height:38px;font-weight:700;font-size:.88rem;max-width:180px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;min-height:44px;min-width:0;flex:1 1 220px;max-width:340px}
.monthnav{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.monthnav b{font-family:var(--display);font-weight:800;font-size:1.05rem;min-width:9.5ch;text-align:center}
.monthnav .iconbtn{border:0;width:38px;height:38px}

.clock{background:var(--sky);border-radius:28px;padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center}
.clock .timer{display:block;font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,2rem + 2.5vw,3.6rem);line-height:1;letter-spacing:.01em;margin:6px 0 4px}
.clock .eyebrow{color:var(--skyText)}
.clock .live{display:inline-flex;align-items:center;gap:8px}
.clock .live::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--leafMid);box-shadow:0 0 0 4px rgba(47,143,70,.25);animation:pulse 1.6s ease-in-out infinite}
.clock .acts{flex-direction:column;align-items:stretch;gap:8px}
.clock .shifts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.shift{background:rgba(255,255,255,.7);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700}
.shift.on{background:#fff;color:var(--leaf)}
@media (max-width:620px){.clock{grid-template-columns:1fr}.clock .acts{flex-direction:row;flex-wrap:wrap}}
.clockchip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:44px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--soil);white-space:nowrap}
.clockchip svg{width:18px;height:18px;color:var(--leaf)}
.clockchip.on{background:var(--leafSoft);border-color:var(--leafMid);color:var(--leaf)}
.clockchip.on::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--leafMid);animation:pulse 1.6s ease-in-out infinite}
@media (max-width:760px){.clockchip .lbl{display:none}.top .rolechip{display:none}}
.msgitem{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1.5px solid var(--soft)}
.msgitem:first-child{border-top:0;padding-top:0}
.msgitem .body{white-space:pre-wrap;font-size:.95rem}
.tog{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted);min-height:40px;cursor:pointer}
.tog.on{background:var(--leafMid);color:#fff}
.hwcard{display:flex;flex-direction:column;gap:10px}
.answer{background:var(--soft);border-radius:16px;padding:12px 14px;white-space:pre-wrap;max-height:220px;overflow:auto}
.reply{background:var(--goodSoft);border-radius:18px 18px 18px 4px;padding:12px 14px;white-space:pre-wrap}
.revrow{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:2px solid var(--line)}
.revrow:first-child{border-top:0;padding-top:0}
.seg{display:inline-flex;gap:3px;background:var(--soft);border-radius:999px;padding:3px;flex-wrap:nowrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;font-weight:700;font-size:.86rem;min-height:38px;color:var(--muted)}
.seg input:checked + span.present{background:var(--leafMid);color:#fff}
.seg input:checked + span.late{background:var(--sun);color:var(--soil)}
.seg input:checked + span.absent{background:var(--bad);color:#fff}

function feeInfo(lid,m){
  const f=D.fees[lid]; if(!f||!(+f.monthly>0)||!isMonth(f.start))return null;
  const pays=Object.entries(f.payments||{}).filter(([,p])=>p&&+p.amount>0).map(([id,p])=>({id,...p})).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const paidFor=mm=>pays.filter(p=>p.month===mm).reduce((s,p)=>s+(+p.amount),0);
  const monthly=+f.monthly, dueDay=+f.dueDay||10;
  const months=m>=f.start?monthsFromTo(f.start,m):[];
  const expected=months.length*monthly;
  const paidTo=pays.filter(p=>p.month<=m).reduce((s,p)=>s+(+p.amount),0);
  const balance=Math.max(0,expected-paidTo);
  const owedM=m>=f.start?monthly:0, paidM=paidFor(m);
  let status;
  if(!owedM)status={k:"none",cls:"p-mute",label:"Starts "+monthShort(f.start)};
  else if(paidM>=owedM)status={k:"paid",cls:"p-good",label:"Paid"};
  else{const cur=thisMonth();const late=m<cur||(m===cur&&new Date().getDate()>dueDay);
    status=paidM>0?{k:"part",cls:"p-warn",label:"Part paid"}:late?{k:"overdue",cls:"p-bad",label:"Overdue"}:{k:"due",cls:"p-info",label:`Due ${dueDay} ${monthShort(m)}`};}
  return {f,monthly,dueDay,pays,paidM,owedM,balance,status,remainingM:Math.max(0,owedM-paidM)};
}

}

/* ================= toast, modal, copy ================= */
let toastT;
function toast(msg,bad){const r=document.getElementById("toast-root");r.innerHTML=`<div class="toast ${bad?"bad":""}">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>{r.innerHTML=""},bad?6000:2600);}
let modalOpen=false,lastFocus=null;
function closeModal(){document.getElementById("modal-root").innerHTML="";modalOpen=false;if(lastFocus&&lastFocus.isConnected)lastFocus.focus();render();}
function openModal(title,body,opts={}){
  if(!modalOpen)lastFocus=document.activeElement;modalOpen=true;
  const root=document.getElementById("modal-root");
  const hasSubmit=!!opts.onSubmit;
  root.innerHTML=`<div class="scrim" data-scrim><form class="modal ${opts.wide?"wide":""}" role="dialog" aria-modal="true" aria-labelledby="m-title" novalidate>
    <header><h2 id="m-title">${esc(title)}</h2><button type="button" class="iconbtn" data-close aria-label="Close">${ic("x")}</button></header>
    <div class="mbody">${body}<p class="formerr" id="m-err" hidden></p></div>
    <footer>${opts.footerExtra||""}${hasSubmit?`<button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn ${opts.danger?"btn-danger":"btn-primary"}" id="m-ok">${esc(opts.submitLabel||"Save")}</button>`:`<button type="button" class="btn btn-primary" data-close>Done</button>`}</footer>
  </form></div>`;
  const form=root.querySelector("form");
  root.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  root.querySelector("[data-scrim]").addEventListener("mousedown",e=>{if(e.target.hasAttribute("data-scrim"))closeModal()});
  form.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
  form.addEventListener("change",e=>{const b=e.target.closest("[data-mchange]");if(b&&opts.actions&&opts.actions[b.dataset.mchange])opts.actions[b.dataset.mchange](b.value,b,form);});
  form.addEventListener("click",e=>{const b=e.target.closest("[data-mact]");if(b&&opts.actions&&opts.actions[b.dataset.mact]){e.preventDefault();opts.actions[b.dataset.mact](b.dataset.id,b,form);}});
  form.addEventListener("submit",async e=>{
    e.preventDefault(); if(!hasSubmit)return;
    const err=form.querySelector("#m-err"); err.hidden=true;
    const bad=[...form.elements].find(el=>el.willValidate&&!el.checkValidity());
    if(bad){err.textContent=(bad.dataset.label?bad.dataset.label+": ":"")+bad.validationMessage;err.hidden=false;bad.focus();return}
    const ok=form.querySelector("#m-ok"); ok.disabled=true;
    try{const r=await opts.onSubmit(form.elements,form); if(r===false){ok.disabled=false;return} closeModal(); if(opts.done)toast(opts.done); if(opts.after)opts.after();}
    catch(ex){ok.disabled=false; if(ex&&ex.userMsg){err.textContent=ex.userMsg;err.hidden=false}else{handleErr(ex)}}
  });
  if(opts.onOpen)opts.onOpen(form);
  if(!opts.noFocus){const f=form.querySelector("input:not([type=radio]):not([type=checkbox]),textarea,select");if(f)setTimeout(()=>f.focus(),30);}
}
const userErr=m=>Object.assign(new Error(m),{userMsg:m});
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${sel?"selected":""}>${esc(l)}</option>`;
async function copyText(text,what){
  try{await navigator.clipboard.writeText(text);toast((what||"Text")+" copied. Paste it into WhatsApp or SMS.");}
  catch{openModal("Copy this text",`<p class="small muted">Select the text and copy it.</p><textarea id="cp-text" rows="7" readonly>${esc(text)}</textarea>`,{noFocus:true,onOpen:f=>{const t=f.querySelector("#cp-text");t.focus();t.select();}});}
}

/* ================= render ================= */
let rq=0;
function schedule(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()});}
function editingInMain(){const a=document.activeElement;return a&&a.closest&&a.closest("#main")&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);}
let lastMain="",lastNav="",lastTop="";
function render(force){
  if(!force&&(editingInMain()||modalOpen)){S.pending=true;return}
  S.pending=false;
  if(S.status==="ready"){applyPrefs();trackParent();}
  const top=topHTML(); if(top!==lastTop){document.getElementById("topbar").innerHTML=top;lastTop=top;bindTop();}
  const nav=navHTML(); if(nav!==lastNav){document.getElementById("nav").innerHTML=nav;lastNav=nav;}
  const main=mainHTML(); if(main!==lastMain||force){document.getElementById("main").innerHTML=main;lastMain=main;}
  resolveNames();
}
document.addEventListener("focusout",()=>{setTimeout(()=>{if(S.pending&&!editingInMain()&&!modalOpen)render()},0)});

let nameReq=0;
function resolveNames(){
  if(!S.user)return;
  const list=[...new Set([...Object.keys(D.profiles),S.uid].filter(Boolean))]; if(!list.length)return;
  const my=++nameReq;
  S.user.profiles(list).then(ps=>{if(my!==nameReq)return;let ch=false;for(const id of list){const n=ps[id]&&ps[id].name;if(n&&S.names[id]!==n){S.names[id]=n;ch=true}}if(ch)schedule();}).catch(()=>{});
}

function topHTML(){
  const r=realRole(), cur=role();
  let right="";
  if(S.status==="ready"&&r&&r!=="pending"){
    const ini=myName().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
    const un=unreadCount();
    right=`${r==="admin"?`<div class="viewas"><label for="viewas">View as</label><select id="viewas">${["admin","teacher","student","parent"].map(x=>opt(x,ROLE_LABEL[x],x===cur)).join("")}</select></div>`:`<span class="rolechip">${esc(ROLE_LABEL[cur]||"")}</span>`}
      ${clockChip(cur)}
      ${cur!=="admin"&&noticesFor(cur).length?`<button class="bell" data-go="${cur==="parent"?"messages":"notices"}" ${cur==="parent"?'data-act="mtab" data-id="news"':""} aria-label="Notices${un?`, ${un} new`:""}">${ic("bell")}${un?`<span class="badge">${un}</span>`:""}</button>`:""}
      <button class="me" data-act="profile" aria-label="Edit your profile">${cur==="student"&&!S.viewAs?avatarHTML(S.uid,44):`<span class="av">${esc(ini)}</span>`}<span class="nm">${esc(myName())}</span></button>`;
  }
  return `<a class="brand" href="#home" data-go="home" aria-label="Little Lingos home">${LOGO}</a>${right}`;
}
function clockChip(cur){
  if(cur!=="teacher")return ""; const tid=myTid(); if(!tid)return "";
  const x=trainerToday(tid);
  if(x.open){const base=doneMsToday(tid);return `<button class="clockchip on" data-act="clockOut" data-id="${esc(x.open.id)}" aria-label="Working now. Clock out"><span class="num" data-since="${esc(x.open.startAt)}" data-base="${base}">${fmtDur(base+Date.now()-new Date(x.open.startAt).getTime())}</span><span class="lbl">· Clock out</span></button>`;}
  return `<button class="clockchip" data-act="clockIn" aria-label="Clock in">${ic("clock")}<span class="lbl">Clock in</span></button>`;
}
function bindTop(){const v=document.getElementById("viewas");if(v)v.addEventListener("change",()=>{S.viewAs=v.value==="admin"?null:v.value;v.blur();go("home");});}
function navItems(){
  const r=role();
  if(r==="student")return [["home","My garden","leaf"],["path","Path","map"],["words","Words","cards"],["play","Games","star"],["homework","Homework","pencil"],["schedule","Classes","cal"],["stories","Stories","book"],["me","Me","user"],["notices","Messages","bell"]];
  if(r==="parent"){const un=unreadCount()+chatUnread().length;return [["home","Overview","heart"],["schedule","Classes","cal"],["progress","Progress","leaf"],["homework","Homework","pencil"],["messages","Messages","bell",un],["fees","Fees","rupee"],["help","Help","help",reqUpdates().length]];}

  if(r==="admin")return [["home","Today","sunny"],["-","People"],["learners","Learners","users"],["parents","Parents","heart",waitingParents().length],["trainers","Trainers","trainer",txAll("leave").filter(l=>l.status==="pending").length],["leads","Leads","userplus",adList("leads").filter(x=>x.status==="new").length],["-","Teaching"],["schedule","Classes","cal"],["batches","Batches","swap"],["attendance","Attendance","clip"],["courses","Courses","book"],["library","Library","cards"],["review","Review","star"],["reports","Reports","doc",reportsPending().length],["-","Money"],["fees","Fees","rupee",remindersToday().length],["-","Families"],["inbox","Families","chat",inboxCount()],["notices","Notices","mega"],["events","Events","event"],["-","Insights"],["analytics","Analytics","leaf"],["settings","Settings","gear"]];
  return [];
}
function navHTML(){
  if(S.status!=="ready"||!role()||role()==="pending"||lockNeeded())return "";
  const parent={course:"courses",lesson:"courses",child:"home",settings:isParent()?"help":"home"}[S.view]||S.view;
  return navItems().map(([v,l,i,n])=>v==="-"?`<span class="navsec">${esc(l)}</span>`:`<a href="#${v}" data-go="${v}" ${parent===v?'aria-current="page"':""}>${ic(i)}<span>${l}</span>${n?`<em class="nbadge" aria-label="${n} new">${n}</em>`:""}</a>`).join("");
}

/* Pip, the seed: a friendly guide on every page of the child's portal (brand voice: short, warm, praise effort) */
const PIP_LINES={
  path:f=>[[`Hi ${f}! Ready for your next lesson?`,"Tap the glowing seed to start."],["Every lesson plants a new flower!","Let's grow your garden together."],["One step at a time. You've got this!","Pick up where you left off."]],
  words:f=>[["Say it with me!","Tap a card to see what it means."],[`Look at all your words, ${f}!`,"Each one is a seed you planted."],["Hmm, tricky word? Let's try again together.","Tap the speaker to hear it."]],
  play:f=>[["Let's play with your words!","Every game helps your garden grow."],[`Pick a game, ${f}!`,"Trying is what makes words bloom."]],
  homework:f=>[["Homework time! I'll keep you company.","Hand it in to collect stars."],[`You can do it, ${f}!`,"Take your time. Growing is not a race."]],
  schedule:f=>[["Here are your classes this week.","See you in class! Say hi to your teacher."],[`Class days are sunny days, ${f}!`,"Tap a class to join when it's time."]],
  stories:f=>[["Story time! Pick one you like.","Listen, read and sing along."],["Every story is full of new words.","Which one will you plant today?"]],
  me:f=>[[`This is you, ${f}! Look how you've grown.`,"Every star is a try you made."],["Wow, look at your badges!","Keep trying and more will bloom."]],
  notices:f=>[["News from your garden!","Here's what your teacher shared."]]
};
const PIP_CHEERS=["Yay! You're doing great!","I'm so happy you're here!","Let's grow together!","Say it with me!","You make the garden bloom!"];
function pipGuide(key,first){
  const fn=PIP_LINES[key]; if(!fn)return "";
  const opts=fn(first||"friend"), d=new Date(), i=(d.getDate()+key.length)%opts.length, [t,sub]=opts[i];
  return `<div class="pipguide"><button class="pip-tap" type="button" data-act="pipCheer" aria-label="Pip, the seed. Tap for a cheer">${PIPSVG("pipsvg")}</button><p class="say" aria-live="polite"><span class="pip-t">${esc(t)}</span><small>${esc(sub)}</small></p></div>`;
}
function withPip(key,html){
  if(!PIP_LINES[key]||(key==="play"&&S.game))return html;
  const L=myLearner(); if(!L)return html;
  return pipGuide(key,firstOf(L.name))+html;
}
function mainHTML(){
  if(S.status==="nodb")return centerMsg("Can't reach the classroom","Check your internet connection, then reload the page.");
  if(S.status==="noid")return centerMsg("Sign in to join the garden","You're viewing Little Lingos without a signed-in account. Reload the page and sign in with your email.");
  if(S.status!=="ready")return `<div class="stack" style="max-width:520px;margin-top:20px"><div class="skel" style="width:40%;height:28px"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div>`;
  const r=realRole();
  if(!r)return onboardHTML();
  if(r==="pending")return pendingHTML();
  const allowed=new Set(navItems().map(x=>x[0]).concat(["course","lesson","child"],role()==="parent"?["settings"]:[]));
  const key=allowed.has(S.view)&&VIEWS[S.view]?S.view:"home";
  if(needsConsent())return consentHTML();
  if(gateNeeded(key))return gateHTML();
  if(lockNeeded())return lockHTML();
  if(isKid()&&timeUp())return breakHTML();
  if(isKid())return (key==="home"?"":kidReminder())+withPip(key,VIEWS[key]());
  return VIEWS[key]();
}
function centerMsg(t,b){return `<div class="center"><div class="card" style="align-items:center;text-align:center">${art("pip",110,"Pip")}<h1>${esc(t)}</h1><p class="lede">${esc(b)}</p></div></div>`;}
function go(view,id){
  if((view==="notices"||(view==="messages"&&(S.mtab==="news"||(!S.mtab&&!curKid()))))&&role()!=="admin"){S.seenBefore=lastSeen();if(unreadCount()&&D.profiles[S.uid]&&!S.viewAs)save(()=>S.db.doc("profiles/"+S.uid).update({lastSeenNotice:Date.now()}));}
  S.view=view;S.params={id};if(view!=="lesson")S.bloomed=null;render(true);window.scrollTo({top:0});
}
function monthNav(){const m=S.month;return `<div class="monthnav" role="group" aria-label="Month"><button class="iconbtn" data-act="monthShift" data-id="-1" aria-label="Previous month">${ic("back")}</button><b>${esc(monthLabel(m))}</b><button class="iconbtn" data-act="monthShift" data-id="1" aria-label="Next month" ${m>=thisMonth()?"disabled":""}>${ic("fwd")}</button></div>`;}

/* ================= shared pieces ================= */
function gardenHTML(n,msg,h){
  const shown=Math.min(n,14);let fl="";
  for(let i=0;i<shown;i++){const left=i%2===0;const k=Math.floor(i/2);const x=left?2+k*5.2:93-k*5.2;const ht=60+((i*37)%32);
    fl+=`<span class="fl" style="left:${x}%">${flowerSvg(FLOWERS[i%FLOWERS.length],ht)}</span>`;}
  return `<div class="garden" style="height:${h||270}px" role="img" aria-label="A garden with ${n} flower${n===1?"":"s"}">
    <svg class="sun" aria-hidden="true"><use href="#sun"/></svg><svg class="cloud" aria-hidden="true"><use href="#cloud"/></svg><svg class="cloud2" aria-hidden="true"><use href="#cloud"/></svg>
    <div class="hill"></div>${fl}<svg class="pip" aria-hidden="true"><use href="#pip"/></svg>
    <div class="bubble" style="left:16px;top:16px">${esc(msg)}</div></div>`;
}

const isPresent=e=>(e.status||"present")==="present";
function doneMsToday(tid){const d=ymd(new Date());return entriesOf(tid).filter(e=>e.date===d&&isPresent(e)&&e.startAt&&e.endAt).reduce((t,e)=>t+(new Date(e.endAt)-new Date(e.startAt)),0);}
function staleOpen(tid){const d=ymd(new Date());return entriesOf(tid).find(e=>isPresent(e)&&e.startAt&&!e.endAt&&e.date!==d)||null;}
function clockCard(tid){
  if(!tid)return `<section class="clock"><div><span class="eyebrow">Working hours</span><p style="margin-top:6px">Trainers clock in and out here. You're previewing as admin, so there's nothing to clock.</p></div></section>`;
  const x=trainerToday(tid), base=doneMsToday(tid), stale=staleOpen(tid);
  const shifts=x.es.filter(e=>isPresent(e)&&e.startAt).sort((a,b)=>String(a.startAt).localeCompare(String(b.startAt)));
  let left,acts;
  if(x.open){
    left=`<span class="eyebrow live">Working now</span><b class="timer num" data-since="${esc(x.open.startAt)}" data-base="${base}">${fmtDur(base+Date.now()-new Date(x.open.startAt).getTime())}</b><p>Clocked in at <b>${esc(fmtTime(new Date(x.open.startAt)))}</b> · it's <span class="num" data-now>${esc(TIMESEC.format(new Date()))}</span></p>`;
    acts=`<button class="btn btn-primary btn-big" data-act="clockOut" data-id="${esc(x.open.id)}">${ic("clock",22)}Clock out</button>`;
  }else if(x.leave&&!shifts.length){
    left=`<span class="eyebrow">${esc(fmtDay(new Date()))}</span><b class="timer num">On leave</b><p>Enjoy your day off.</p>`; acts="";
  }else{
    left=`<span class="eyebrow">${esc(fmtDay(new Date()))} · <span class="num" data-now>${esc(TIMESEC.format(new Date()))}</span></span><b class="timer num">${fmtDur(base)}</b><p>${base?"Worked today. Clock in again if you're starting another session.":"Not clocked in yet. Tap Clock in when you start work."}</p>`;
    acts=`<button class="btn btn-primary btn-big" data-act="clockIn">${ic("clock",22)}${base?"Clock in again":"Clock in"}</button>`;
  }
  return `<section class="clock" aria-label="Working hours"><div>${left}</div><div class="acts">${acts}${shifts.length?`<button class="btn btn-ghost btn-sm" data-go="hours">My hours</button>`:""}</div>
    ${shifts.length?`<div class="shifts">${shifts.map(e=>`<span class="shift ${e.endAt?"":"on"}">${esc(fmtTime(new Date(e.startAt)))} → ${e.endAt?`${esc(fmtTime(new Date(e.endAt)))} · ${fmtHours(hoursOf(e))}`:"now"}</span>`).join("")}</div>`:""}
    ${stale?`<div class="shifts"><span class="pill p-bad">You didn't clock out on ${esc(fmtDay(new Date(stale.date+"T12:00")))}</span><button class="btn btn-ghost btn-sm" data-act="fixOut" data-id="${esc(stale.id)}">Add finish time</button></div>`:""}</section>`;
}

function noticeCard(n,compact){
  const r=role(), admin=r==="admin", mineN=n.uid===S.uid||n.by===S.uid, unread=!admin&&!mineN&&(n.at||0)>S.seenBefore;
  let seen="";
  if(admin||mineN){
    if(n.src==="team"&&!["families","lang","batch","student"].includes(n.audience)){const ts=activeTrainers().filter(t=>t.uid);const c=ts.filter(t=>+(D.profiles[t.uid]?.lastSeenNotice||0)>=(n.at||0)).length;seen=`<span class="pill p-mute">Seen by ${c} of ${ts.length} signed-in trainer${ts.length===1?"":"s"}</span>`;}
    else if(n.src!=="team"){const ls=noteLearners(n).filter(l=>l.uid);const c=ls.filter(l=>+(D.profiles[l.uid]?.lastSeenNotice||0)>=(n.at||0)).length;seen=`<span class="pill p-mute">Seen by ${c} of ${ls.length} signed-in learner${ls.length===1?"":"s"}</span>`;}
  }
  const to=n.src==="team"?(n.audience==="everyone"?"Everyone":n.audience==="families"?"Families":noticeTargetLabel(n)||"All trainers"):(n.audience==="course"?(D.courses[n.courseId]?.title||"A course"):(mineN?"your learners":firstOf(noteAuthor(n))+"'s learners"));
  const body=String(n.body||""), canDel=admin||mineN;
  return `<article class="${compact?"":"card "}notice ${unread?"unread":""}"><div class="row">${unread?`<span class="pill p-sun">New</span>`:""}<b class="small">From ${esc(noteAuthor(n))}</b>${isStaff()?`<span class="pill ${n.src==="team"?"p-good":"p-info"}">To ${esc(to)}</span>`:""}<span class="small muted">${esc(n.at?fmtDay(new Date(n.at))+", "+fmtTime(new Date(n.at)):"")}</span></div>
    <h3>${esc(n.title)}</h3><p class="body">${esc(compact&&body.length>200?body.slice(0,200)+"…":body)}</p>
    ${compact?seen:`<div class="row">${seen}<span class="spacer"></span>${isStaff()?`<button class="btn btn-ghost btn-sm" data-act="copyNotice" data-id="${esc(n.key)}">${ic("copy")}Copy for WhatsApp</button>`:""}${canDel?`<button class="iconbtn" data-act="delNotice" data-id="${esc(n.key)}" aria-label="Delete message">${ic("trash")}</button>`:""}</div>`}</article>`;
}
function noticesView(){
  const r=role(); let ns=noticesFor(r);
  const tab=r==="teacher"?(S.msgTab||"admin"):null;
  const tabs=r==="teacher"?(()=>{const all=ns,fromA=all.filter(n=>n.src==="team"),sent=all.filter(n=>n.src!=="team"),un=fromA.filter(n=>(n.at||0)>S.seenBefore).length;

function scheduleView(){
  const staff=isStaff(), r=role();
  let mine=null; if(r==="student"){const L=myLearner();mine=L?learnerCourses(L):[]}else if(r==="parent"){mine=[...new Set(childrenOf(S.uid).flatMap(id=>learnerCourses(learner(id))))]}
  const side=!!mine, showAll=side&&S.schedAll, mineSet=new Set(mine||[]);
  const cids=(!side||showAll)?courseList().map(c=>c.id):mine;
  const up=upcoming(cids,100);
  const rowOpts=s=>side?{tag:showAll&&mineSet.has(s.courseId)?(r==="parent"?"Your child's class":"Your class"):null,noJoin:!mineSet.has(s.courseId)}:{manage:staff,attend:staff};
  const groups=new Map(); for(const s of up){const k=new Date(s.startsAt).toDateString();if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s);}
  const earlier=staff?scopedSessions().filter(s=>sessEnd(s)<=Date.now()&&Date.now()-new Date(s.startsAt).getTime()<7*864e5).sort((a,b)=>String(b.startsAt).localeCompare(String(a.startsAt))):[];
  const intro=showAll?"Every upcoming class at Little Lingos. Yours are marked.":r==="student"?"Classes for your courses.":r==="parent"?"Classes for your children's courses.":"Every class across Little Lingos.";
  const toggle=side?`<div class="seg" role="group" aria-label="Which classes"><button class="tog ${showAll?"":"on"}" data-act="schedMode" data-id="mine" aria-pressed="${!showAll}">${r==="parent"?"My children's":"My classes"}</button><button class="tog ${showAll?"on":""}" data-act="schedMode" data-id="all" aria-pressed="${showAll}">All classes</button></div>`:"";
  return `<div class="head"><div><h1>Classes</h1><p class="lede">${intro} Times are shown in your time zone.</p></div>${staff?`<button class="btn btn-primary" data-act="newSession">${ic("plus")}Schedule a class</button>`:toggle}</div>
  ${groups.size?[...groups].map(([k,list])=>`<section class="card panel"><h3>${esc(fmtDay(new Date(k)))}${k===new Date().toDateString()?` <span class="pill p-info">Today</span>`:""}</h3><div class="list">${list.map(s=>sessionRow(s,rowOpts(s))).join("")}</div></section>`).join(""):emptyBox("No upcoming classes",staff?"Schedule a class, with a Zoom or Google Meet link if it's online.":"When a teacher schedules a class, it appears here.",staff?`<button class="btn btn-primary" data-act="newSession">${ic("plus")}Schedule a class</button>`:"","drizzle")}
  ${earlier.length?`<section class="card panel"><h2>Earlier this week</h2><div class="list">${earlier.map(s=>sessionRow(s,{manage:true,attend:true})).join("")}</div></section>`:""}`;
}

async function saveLearner(f,form,id){
  const name=f.name.value.trim(); if(!name)throw userErr("Add the learner's name.");
  const courses=[...form.querySelectorAll('input[name="courses"]:checked')].map(x=>x.value);
  const fee=+f.fee.value||0, start=f.start.value, due=Math.min(28,Math.max(1,+f.due.value||10));
  if(fee>0&&!isMonth(start))throw userErr("Pick the month fees start from (for example 2026-10).");
  const acct=f.acct.value||null;
  if(acct){const other=activeLearners().find(l=>l.uid===acct&&l.id!==id);if(other)throw userErr(`That account is already connected to ${other.name}.`);}
  const rec={name,stage:f.stage.value,courses,...assignPatch(id?learner(id):null,f.trainer.value),uid:acct,parents:[...form.querySelectorAll('input[name="parents"]:checked')].map(x=>x.value)};
  let lid=id;
  if(id){rec.active=f.active?f.active.checked:true;const was=D.learners[id];if(was&&was.active!==false&&!rec.active)rec.leftAt=Date.now();if(was&&was.active===false&&rec.active)rec.leftAt=null;await S.db.doc("learners/"+id).update(rec);}
  else{const ref=S.db.collection("learners").doc();lid=ref.id;await ref.set({...rec,active:true,code:genCode(),createdAt:Date.now()});}
  await upsert("private/"+lid,{guardian:f.guardian.value.trim(),phone:f.phone.value.trim(),guardian2:f.guardian2.value.trim(),phone2:f.phone2.value.trim(),email:chkEmail(f.email.value,"parent's email"),email2:chkEmail(f.email2.value,"second parent's email"),studentEmail:chkEmail(f.semail.value,"learner's email"),notes:f.notes.value.trim()});await audit(id?"Learner edited":"Learner added",name);
  if(fee>0)await upsert("fees/"+lid,{monthly:fee,start,dueDay:due});
  else if(D.fees[lid])await S.db.doc("fees/"+lid).update({monthly:0});
}

async function saveHw(f,form,h){
  const title=f.title.value.trim(); if(!title)throw userErr("Add a title.");

  <div>${ls.map(L=>{const a=answerOf(L,h),rp=replyOf(L,h),st=hwState(L,h);return `<div class="revrow"><div class="row"><b>${esc(L.name)}</b><span class="pill ${st.cls}">${esc(st.label)}</span>${a?`<span class="small muted">${esc(fmtDay(new Date(a.at)))}, ${esc(fmtTime(new Date(a.at)))}</span>`:""}</div>

    <div class="stickpick sm"><label><input type="radio" name="sk_${esc(L.id)}" value="" ${!(rp&&rp.sticker)?"checked":""}><span>–</span></label>${STICKERS.map(x=>`<label><input type="radio" name="sk_${esc(L.id)}" value="${x}" ${rp&&rp.sticker===x?"checked":""}><span>${x}</span></label>`).join("")}</div>
    ${canRecord()?`<div class="row"><button type="button" class="btn btn-ghost btn-sm" data-mact="vrec" data-id="${esc(L.id)}">🎤 ${voiceFor(h,L)?"Re-record":"Record"} voice note</button><span class="small muted" id="vst-${esc(L.id)}">${voiceFor(h,L)?"Voice note sent":"Up to 30 seconds"}</span></div><div id="vpl-${esc(L.id)}">${voiceFor(h,L)?`<audio controls src="${esc(voiceFor(h,L).audio)}"></audio>`:""}</div>`:""}`:(rp?`<div class="reply">${rp.sticker?esc(rp.sticker)+" ":""}${rp.stars?"⭐".repeat(+rp.stars)+" ":""}${esc(rp.text||"")}</div>`:"")}</div>`}).join("")||`<p class="muted">No learners are assigned this homework.</p>`}</div>`;
  const anyAns=ls.some(L=>answerOf(L,h));

    actions:{vrec:async(lid,btn)=>{if(REC.mr){stopRec();return}const ok=await startRec(30,(u,size)=>{btn.textContent="🎤 Record again";const st=document.getElementById("vst-"+lid);if(size>190000){if(st)st.textContent="Too long. Try a shorter note.";return}voices[lid]=u;if(st)st.textContent="Ready to send";const pl=document.getElementById("vpl-"+lid);if(pl)pl.innerHTML=`<audio controls src="${esc(u)}"></audio>`;});if(ok){btn.textContent="■ Stop recording";const st=document.getElementById("vst-"+lid);if(st)st.textContent="Recording…";}}},
    onSubmit:can&&anyAns?async(f,form)=>{const upd={};for(const L of ls){const el=form.querySelector(`[name="fb_${CSS.escape(L.id)}"]`);if(!el)continue;const v=el.value.trim();const stv=+((form.querySelector(`[name="st_${CSS.escape(L.id)}"]:checked`)||{}).value||0);const skv=(form.querySelector(`[name="sk_${CSS.escape(L.id)}"]:checked`)||{}).value||"";const old=replyOf(L,h);
      if((v||stv||skv)&&(!old||old.text!==v||(+old.stars||0)!==stv||(old.sticker||"")!==skv))upd[L.id]={text:v,stars:stv,sticker:skv,at:Date.now(),by:S.uid};}

/* ---- trainer contact lists (admin keeps them in sync) ---- */
let ctSig={},ctT=null,ctUids=null;
function scheduleContactSync(){if(!S.isOwner||!S.db)return;clearTimeout(ctT);ctT=setTimeout(()=>syncContacts().catch(e=>console.warn("Little Lingos: contacts sync",e)),1500);}
async function syncContacts(){
  if(!["learners","trainers","priv","courses","batches"].every(k=>S.loaded.has(k)))return scheduleContactSync();
  if(!ctUids){const ix=await S.db.doc("contacts/index").get();ctUids=new Set((ix.exists&&ix.data().uids)||[]);}
  const want={};
  for(const t of activeTrainers()){if(!t.uid||t.uid===S.uid)continue;const o={};
    for(const L of teacherLearners(t.id)){const pv=D.priv[L.id]||{};if(pv.phone||pv.email)o[L.id]={name:L.name,guardian:pv.guardian||"",phone:pv.phone||"",email:pv.email||""};}
    want[t.uid]=o;}
  for(const uid of ctUids)if(!(uid in want))want[uid]={};
  for(const [uid,o] of Object.entries(want)){
    const sig=JSON.stringify(o); if(ctSig[uid]===sig)continue;
    const col=S.db.collection(`contacts/${uid}/l`); const snap=await col.get(); const have={};for(const d of snap.docs)have[d.id]=d.data();
    for(const [lid,v] of Object.entries(o))if(JSON.stringify(have[lid])!==JSON.stringify(v))await col.doc(lid).set(v);
    for(const lid of Object.keys(have))if(!o[lid])await col.doc(lid).delete();
    ctSig[uid]=sig;
  }
  const next=Object.keys(want).filter(u=>Object.keys(want[u]).length).sort();
  if(JSON.stringify(next)!==JSON.stringify([...ctUids].sort()))await S.db.doc("contacts/index").set({uids:next});
  ctUids=new Set(next);
  await syncPay();
}

/* weekly digest */
function digest(L){
  const since=weekAgo(), uid=L.uid;
  const cls=kidHistory(L).filter(x=>new Date(x.date).getTime()>=since);
  const hwDone=hwFor(L).filter(h=>{const a=answerOf(L,h);return a&&(a.at||0)>=since;});

  const next=upcoming(learnerCourses(L),50).filter(s=>new Date(s.startsAt).getTime()<Date.now()+7*864e5);
  return {flowers:flowersSince(uid,since),words:wordsOf(uid,since),cls,attended:cls.filter(x=>x.st!=="absent").length,hwDone,notes,next};
}

function billDoc(kind,L,fk,item){
  const a=ACAD(), today=new Date(), no=kind==="invoice"?`INV-${item.month.replace("-","")}-${L.id.slice(-4).toUpperCase()}`:`RCPT-${String(item.id).slice(-6).toUpperCase()}`;
  const amt=kind==="invoice"?item.amount:item.amount;
  return `<div class="printdoc"><div class="pd-head"><div><b class="pd-brand">${esc(a.name)}</b>${a.address?`<div>${esc(a.address).replace(/\n/g,"<br>")}</div>`:""}${a.gstin?`<div>GSTIN: ${esc(a.gstin)}</div>`:""}${a.phone||a.email?`<div>${esc([a.phone,a.email].filter(Boolean).join(" · "))}</div>`:""}</div>
  <div class="pd-meta"><b>${kind==="invoice"?"INVOICE":"PAYMENT RECEIPT"}</b><div>No. ${esc(no)}</div><div>Date: ${esc(kind==="invoice"?fmtDay(new Date(item.month+"-01T12:00")):(item.date||ymd(today)))}</div></div></div>
  <div class="pd-to"><div class="small">${kind==="invoice"?"Billed to":"Received from"}</div><b>${esc(accountName(S.uid))}</b><div>For ${esc(L.name)} · ${esc(fk.plan||"Monthly plan")}</div></div>
  <table class="pd-table"><thead><tr><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody>
  <tr><td>${esc(fk.plan||"Tuition fee")} · ${esc(monthLabel(item.month))}${fk.classes?` (${fk.classes} classes)`:""}${kind==="receipt"&&item.method?`<br><span class="small">Paid by ${esc(item.method)}${item.note?` · ${esc(item.note)}`:""}</span>`:""}</td><td style="text-align:right">${money(amt)}</td></tr></tbody>
  <tfoot>${(()=>{const g=gstSplit(amt);return g?`<tr><td>Taxable value</td><td style="text-align:right">${money(g.base)}</td></tr><tr><td>GST ${g.rate}% (CGST ${g.rate/2}% + SGST ${g.rate/2}%)</td><td style="text-align:right">${money(g.tax)}</td></tr>`:"";})()}<tr><td><b>${kind==="invoice"?"Total due":"Total received"}</b></td><td style="text-align:right"><b>${money(amt)}</b></td></tr>${kind==="invoice"?`<tr><td>Paid so far</td><td style="text-align:right">${money(item.paid)}</td></tr><tr><td><b>Balance</b></td><td style="text-align:right"><b>${money(Math.max(0,item.amount-item.paid))}</b></td></tr>`:""}</tfoot></table>
  <p class="small">${kind==="invoice"?`Please pay by day ${fk.dueDay} of the month.`:"Thank you! This receipt was generated by Little Lingos Classroom."}</p></div>`;

const PRINTCSS=`body{font-family:Arial,sans-serif;color:#2E2219;margin:32px}.printdoc{max-width:700px}.pd-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #2F8F46;padding-bottom:14px}.pd-brand{font-size:22px;color:#22703A}.pd-meta{text-align:right}.pd-to{margin:18px 0}.pd-table{width:100%;border-collapse:collapse;margin:10px 0 16px}.pd-table th,.pd-table td{border-bottom:1px solid #D5E8BE;padding:8px;text-align:left}.small{font-size:12px;color:#5C4F45}`;
function openBill(kind,lid,key){
  const L=learner(lid),fk=pfKid(lid);if(!L||!fk)return;

  const html=billDoc(kind,L,fk,item), fname=`${kind}-${firstOf(L.name).toLowerCase()}-${kind==="invoice"?item.month:(item.date||item.month)}.html`;
  openModal(kind==="invoice"?"Invoice":"Receipt",`<div class="billwrap">${html}</div>`,{wide:true,noFocus:true,footerExtra:`<button type="button" class="btn btn-ghost" data-mact="dl">${ic("down")}Download</button><button type="button" class="btn btn-ghost" data-mact="print">${ic("doc")}Print</button>`,
    actions:{print:()=>{try{window.print()}catch{toast("Printing isn't available here. Use Download instead.",true)}},
      dl:async()=>{try{const dl=await window.claude.use("downloads");if(!dl){toast("Downloads aren't available here. Use Print instead.",true);return}
        await dl.save({filename:fname,data:`<!doctype html><html><head><meta charset="utf-8"><title>${esc(kind)}</title><style>${PRINTCSS}</style></head><body>${html}</body></html>`});}catch(e){if(e&&e.code!=="declined")toast("Couldn't download. Use Print instead.",true);}}}});
}

/* ---------- admin keeps each parent's fee summary in sync ---------- */
const pfSig={}; let pfT=null;
function schedulePF(){if(!S.isOwner||!S.db)return;clearTimeout(pfT);pfT=setTimeout(()=>syncPF().catch(e=>console.warn("Little Lingos: fee sync",e)),2000);}
async function syncPF(){
  if(!["learners","profiles","fees","config"].every(k=>S.loaded.has(k)))return schedulePF();
  const cur=thisMonth(), acad=ACAD();
  for(const [uid,p] of Object.entries(D.profiles)){
    if(!p||p.role!=="parent")continue;
    const kids={};
    for(const lid of childrenOf(uid)){const fi=feeInfo(lid,cur);const f=D.fees[lid];if(!fi||!f)continue;
      const used=attendanceOf(lid,cur).t;
      const paidCur=fi.paidM>=fi.owedM;const nd=paidCur?shiftMonth(cur,1):cur;
      const months=monthsFromTo(f.start,cur).slice(-12).reverse();
      const paidFor=m=>fi.pays.filter(x=>x.month===m).reduce((s,x)=>s+(+x.amount),0);

/* recorder */
const REC={mr:null,stream:null,t:null};
const canRecord=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
async function startRec(maxSec,onDone){
  try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast("Pip can't hear you. Allow the microphone for this page, then try again.",true);return false}
  let opts={};for(const m of ["audio/webm;codecs=opus","audio/mp4","audio/ogg;codecs=opus"]){if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)){opts={mimeType:m,audioBitsPerSecond:24000};break}}
  const chunks=[];const mr=new MediaRecorder(REC.stream,opts);REC.mr=mr;
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{clearTimeout(REC.t);try{REC.stream.getTracks().forEach(t=>t.stop())}catch{}REC.mr=null;const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});const fr=new FileReader();fr.onload=()=>onDone(fr.result,blob.size);fr.readAsDataURL(blob);};
  mr.start();REC.t=setTimeout(()=>{if(mr.state==="recording")mr.stop()},maxSec*1000);return true;
}
const stopRec=()=>{if(REC.mr&&REC.mr.state==="recording")REC.mr.stop();};

/* ---------- Games, quizzes, daily challenge ---------- */
function buildQs(pool,n,r,kinds){const qs=[];for(const x of shuffle(pool.slice(),r).slice(0,Math.min(n,pool.length))){const others=shuffle(pool.filter(y=>y.m!==x.m&&y.w!==x.w),r).slice(0,3);const k=kinds[Math.floor(r()*kinds.length)];
  if(k==="listen")qs.push({k,say:x.w,lang:x.lang,prompt:"Listen! Which word did Pip say?",opts:shuffle([x,...others],r).map(o=>o.w),ans:x.w});
  else qs.push({k:"mean",say:x.w,lang:x.lang,prompt:`What does “${x.w}” mean?`,opts:shuffle([x,...others],r).map(o=>o.m),ans:x.m});}return qs;}
A.startGame=type=>{const L=myLearner();if(!L)return;const pool=gamePool(L);
  if(pool.length<4){toast("Learn a few more words first! You need 4.",true);return}
  if(type==="daily"){if((progOf(S.uid).daily||{})[ymd(new Date())]!=null){toast("You've done today's challenge! 🎉");return}const r=rng(ymd(new Date())+S.uid);S.game={type,qs:buildQs(pool,5,r,["mean","listen"]),i:0,score:0,pick:null};}
  else if(type==="memory"){const ws=shuffle(pool.slice()).slice(0,6);const cards=shuffle(ws.flatMap((x,i)=>[{t:x.w,k:i,w:1},{t:x.m,k:i}]));S.game={type,cards,open:[],done:new Set(),moves:0};}
  else S.game={type,qs:buildQs(pool,8,Math.random,type==="listen"?["listen"]:["mean"]),i:0,score:0,pick:null};
  if(S.view!=="play")go("play");else render(true);
  const q=S.game.qs&&S.game.qs[0];if(q&&q.k==="listen")setTimeout(()=>say(q.say,q.lang),400);};
A.answer=v=>{const g=S.game;if(!g||g.pick!=null)return;const q=g.qs[g.i];g.pick=+v;if(q.opts[+v]===q.ans){g.score++;}render(true);};
A.nextQ=async()=>{const g=S.game;if(!g)return;g.i++;g.pick=null;
  if(g.i>=g.qs.length){g.over=true;render(true);const perfect=g.score===g.qs.length;const stars=g.type==="daily"?g.score:Math.round(g.score/g.qs.length*3);
    const extra=g.type==="daily"?{daily:{[ymd(new Date())]:g.score}}:{pts:{["g"+Date.now().toString(36)]:stars}};if(perfect)extra.perfect=true;await save(()=>earn(extra));g.stars=stars;render(true);return}
  render(true);const q=g.qs[g.i];if(q.k==="listen")setTimeout(()=>say(q.say,q.lang),300);};
A.memTap=v=>{const g=S.game;if(!g||g.type!=="memory"||g.lock)return;const i=+v;if(g.done.has(i)||g.open.includes(i))return;g.open.push(i);
  if(g.open.length===2){g.moves++;const [a,b]=g.open;if(g.cards[a].k===g.cards[b].k){g.done.add(a);g.done.add(b);g.open=[];if(g.done.size===g.cards.length){g.over=true;const pairs=g.cards.length/2;g.stars=g.moves<=pairs+2?3:g.moves<=pairs+5?2:1;save(()=>earn({pts:{["m"+Date.now().toString(36)]:g.stars},...(g.moves===pairs?{perfect:true}:{})}));}}
    else{g.lock=true;setTimeout(()=>{g.open=[];g.lock=false;render(true)},900);}}
  render(true);};
A.endGame=()=>{S.game=null;render(true);};
A.sayQ=()=>{const g=S.game;if(g&&g.qs){const q=g.qs[g.i];say(q.say,q.lang);}};
function playView(){
  const L=myLearner(); if(!L)return pendingHTML(); const g=S.game;
  if(g&&g.over)return `<div class="center"><div class="card" style="align-items:center;text-align:center">${art("bloom",110,"Bloom")}<h1>${g.type==="memory"?"All pairs found!":`${g.score} of ${g.qs.length} right!`}</h1><p class="bigstars">${"⭐".repeat(g.stars||0)}${"☆".repeat(Math.max(0,(g.type==="daily"?5:3)-(g.stars||0)))}</p><p class="lede">You earned ${g.stars||0} star${g.stars===1?"":"s"}${g.type==="memory"?` in ${g.moves} moves`:""}.</p><div class="row" style="justify-content:center">${g.type!=="daily"?`<button class="btn btn-primary" data-act="startGame" data-id="${g.type}">Play again</button>`:""}<button class="btn btn-ghost" data-act="endGame">More games</button></div></div></div>`;
  if(g&&g.type==="memory")return `<div class="head"><div><h1>Memory pairs</h1><p class="lede">Find each word and its meaning. Moves: ${g.moves}</p></div><button class="btn btn-ghost btn-sm" data-act="endGame">Stop</button></div>
    <div class="memgrid">${g.cards.map((c,i)=>{const open=g.done.has(i)||g.open.includes(i);return `<button class="mem ${open?"open":""} ${g.done.has(i)?"done":""} ${c.w?"isw":""}" data-act="memTap" data-id="${i}" aria-label="${open?esc(c.t):"Hidden card"}">${open?esc(c.t):"🌱"}</button>`}).join("")}</div>`;
  if(g&&g.qs){const q=g.qs[g.i];const ansI=q.opts.indexOf(q.ans);
    return `<div class="head"><div><h1>${g.type==="daily"?"Daily challenge":g.type==="listen"?"Listen and pick":"Word quiz"}</h1><p class="lede">Question ${g.i+1} of ${g.qs.length} · ⭐ ${g.score}</p></div><button class="btn btn-ghost btn-sm" data-act="endGame">Stop</button></div>
    <section class="quiz"><div class="bar"><i style="width:${pctStr(g.i/g.qs.length)}"></i></div><h2>${esc(q.prompt)}</h2>${q.k==="listen"?`<button class="btn btn-sun btn-big" data-act="sayQ" style="align-self:center">${ic("sound",24)}Hear it again</button>`:canSpeak()?`<button class="iconbtn big" data-act="sayQ" aria-label="Hear the word" style="align-self:center">${ic("sound")}</button>`:""}
      <div class="qopts">${q.opts.map((o,i)=>`<button class="qopt ${g.pick!=null?(i===ansI?"right":i===g.pick?"wrong":""):""}" data-act="answer" data-id="${i}" ${g.pick!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>
      ${g.pick!=null?`<div class="qfb ${g.pick===ansI?"ok":""}">${g.pick===ansI?"🎉 Yes! Well done!":`The answer is “${esc(q.ans)}”.`}<button class="btn btn-primary" data-act="nextQ">${g.i<g.qs.length-1?"Next":"Finish"} ${ic("fwd")}</button></div>`:""}</section>`;}
  const dDone=(progOf(L.uid).daily||{})[ymd(new Date())]!=null, n=gamePool(L).length;
  return `<div class="head"><div><h1>Games</h1><p class="lede">Play with your words and win stars. ⭐ ${starsOf(L)} so far!</p></div></div>
  ${n<4?`<section class="alert a-sun"><b>Finish a lesson with word cards to unlock the games.</b></section>`:""}
  <div class="gamegrid">
    <button class="gamecard g0" data-act="startGame" data-id="daily" ${n<4?"disabled":""}><span>${dDone?"✅":"🎯"}</span><b>Daily challenge</b><i>${dDone?"Done today!":"5 questions · up to 5 stars"}</i></button>
    <button class="gamecard g1" data-act="startGame" data-id="quiz" ${n<4?"disabled":""}><span>❓</span><b>Word quiz</b><i>What does it mean?</i></button>
    <button class="gamecard g2" data-act="startGame" data-id="listen" ${n<4||!canSpeak()?"disabled":""}><span>👂</span><b>Listen and pick</b><i>Hear a word, find it</i></button>
    <button class="gamecard g3" data-act="startGame" data-id="memory" ${n<4?"disabled":""}><span>🃏</span><b>Memory pairs</b><i>Match words and meanings</i></button>
    <button class="gamecard g4" data-act="drill" ${n<1?"disabled":""}><span>🎤</span><b>Repeat after me</b><i>Listen, say it, hear yourself</i></button>
  </div>`;
}

function shrinkImage(src,maxW){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,maxW/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);let q=.8,out=cv.toDataURL("image/jpeg",q);while(out.length>230000&&q>.3){q-=.1;out=cv.toDataURL("image/jpeg",q);}res(out);};img.onerror=rej;img.src=src;});}

   actions:{col:(c,b,form)=>{PAD.c=c;form.querySelectorAll(".pcol").forEach(x=>x.classList.toggle("on",x===b));},size:s=>{PAD.w=+s},wipe:()=>{const cv=document.getElementById("pad");const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);}},
   onOpen:()=>{const cv=document.getElementById("pad");const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.lineCap="round";cx.lineJoin="round";PAD.c="#2E2219";PAD.w=6;let down=false,last=null;
     const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
     cv.addEventListener("pointerdown",e=>{down=true;last=pt(e);cv.setPointerCapture(e.pointerId);PAD.used=true;});

const fmtHM=t=>{if(!t)return "";const [h,m]=t.split(":").map(Number);const d=new Date();d.setHours(h,m||0,0,0);return fmtTime(d);};
function availText(uid){const a=settingsOf(uid).avail||{};const parts=[];for(let i=1;i<=7;i++){const d=i%7;const r=a[d];if(r&&r.from&&r.to)parts.push(`${WDN[d]} ${fmtHM(r.from)}–${fmtHM(r.to)}`);}return parts.join(", ");}
function replyHoursText(uid){const r=settingsOf(uid).reply;if(!r||!r.from||!r.to||!(r.days||[]).length)return "";const ds=r.days.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>WDN[d]);return `${ds.length===7?"Every day":ds.length>2&&ds.join(",")==="Mon,Tue,Wed,Thu,Fri,Sat"?"Mon–Sat":ds.length>2&&ds.join(",")==="Mon,Tue,Wed,Thu,Fri"?"Mon–Fri":ds.join(", ")}, ${fmtHM(r.from)}–${fmtHM(r.to)}`;}
function inReplyHours(uid){const r=settingsOf(uid).reply;if(!r||!r.from||!r.to)return true;const n=new Date();if(!(r.days||[]).includes(n.getDay()))return false;const hm=pad(n.getHours())+":"+pad(n.getMinutes());return hm>=r.from&&hm<=r.to;}
const classRoster=s=>{const ls=learnersInCourse(s.courseId);return s.forLids&&s.forLids.length?ls.filter(L=>s.forLids.includes(L.id)).concat(s.forLids.filter(id=>D.learners[id]&&!ls.some(L=>L.id===id)).map(learner)):ls;};
const runOf=sid=>txAll("run").find(r=>r.sid===sid)||null;
const TBADGES=[["🗣️","Super speaker"],["📖","Star reader"],["🤝","Kind friend"],["👂","Great listener"],["🪄","Word wizard"],["🎨","Creative mind"],["✏️","Homework hero"],["🚀","Big improver"]];
const awardsFor=L=>txAll("award").filter(a=>a.lid===L.id).sort((a,b)=>(b.at||0)-(a.at||0));
const pcFor=itemId=>txAll("pc").filter(c=>c.item===itemId).sort((a,b)=>(b.at||0)-(a.at||0))[0]||null;
const assessFor=L=>txAll("assess").filter(a=>a.lid===L.id).sort((a,b)=>(b.at||0)-(a.at||0));
const needApproval=()=>!!(CFG().reportTpl||{}).approval;
const reportsFor=L=>txAll("report").filter(r=>r.lid===L.id&&(isStaff()||!needApproval()||r.approved)).sort((a,b)=>(b.at||0)-(a.at||0));
const reportsPending=()=>needApproval()?txAll("report").filter(r=>!r.approved&&!r.returned).sort((a,b)=>(a.at||0)-(b.at||0)):[];

const LIBTYPES={slides:["Slides","🖼️"],song:["Song","🎵"],flashcards:["Flashcards","🃏"],worksheet:["Worksheet","📝"],printable:["Printable","🖨️"],video:["Video","🎬"],story:["Story","📖"],other:["Other","📎"]};
const libItems=()=>entries(D.library).sort((a,b)=>(b.at||0)-(a.at||0));
const libHref=x=>x.asset?(window.LL_assetUrl?LL_assetUrl(x.asset):"/_blob/"+x.asset):safeUrl(x.url);
const NEXT_STAGE={Seeds:"Sprouts",Sprouts:"Blooms"};

/* auto attendance: learners and parents tapping Join */
document.addEventListener("click",e=>{const a=e.target.closest("a[href]");if(!a||!S.db||!S.uid)return;
  const st=a.dataset.start; if(st){recordStart(st);return}
  const r=realRole(); const href=a.getAttribute("href"); if(r!=="student"&&r!=="parent")return;
  const now=Date.now(); const s=entries(D.sessions).find(x=>safeUrl(x.joinUrl)===safeUrl(href)&&now>=new Date(x.startsAt).getTime()-30*6e4&&now<=sessEnd(x)); if(!s)return;
  if(r==="student"){const L=myLearner();if(L&&!L.preview)S.db.doc(`kp/${S.uid}/x/j-${s.id}`).set({kind:"join",sid:s.id,at:now}).catch(()=>{});}
  else{const ks=kidsList().filter(k=>learnerCourses(k).includes(s.courseId));for(const k of ks)S.db.doc(`pp/${S.uid}/x/j-${s.id}-${k.id}`).set({kind:"join",sid:s.id,lid:k.id,by:S.uid,at:now}).then(()=>bumpPPI(S.uid,{name:myName()})).catch(()=>{});}
},true);
function joinsFor(sid){const out={};for(const L of activeLearners()){if(L.uid){const j=(D.kp[L.uid]||{})["j-"+sid];if(j)out[L.id]=j.at;}}
  for(const [u,docs] of Object.entries(D.pp||{}))for(const x of Object.values(docs||{}))if(x&&x.kind==="join"&&x.sid===sid&&x.lid&&!out[x.lid])out[x.lid]=x.at;return out;}
async function recordStart(sid){const s=D.sessions[sid];if(!s)return;if(!runOf(sid))await S.db.doc(`tw/${S.uid}/x/run-${sid}`).set({kind:"run",sid,startAt:new Date().toISOString(),at:Date.now()}).catch(()=>{});
  const tid=myTid();if(tid&&!trainerToday(tid).open){const now=new Date();S.db.collection(`timesheets/${S.uid}/e`).doc().set({date:ymd(now),status:"present",startAt:now.toISOString(),endAt:null,at:Date.now(),by:S.uid,note:"Auto: class started"}).then(()=>toast("Class started. You've been clocked in.")).catch(()=>{});}else toast("Class started. Have fun!");}
A.startClass=sid=>recordStart(sid);

/* ---------- Today ---------- */

      <div class="s">${esc(fmtTime(d))}–${esc(fmtTime(end))} · ${esc(c?c.title:"")} · ${ros.length} learner${ros.length===1?"":"s"}${s.topic?` · ${esc(s.topic)}`:""}</div>
      ${s.plan?`<details class="plan"><summary>Lesson plan</summary><div>${esc(s.plan)}</div></details>`:""}
      ${run?`<div class="small muted">Started ${esc(fmtTime(new Date(run.startAt)))}</div>`:""}</div>
    <div class="acts wrap">${startable&&!run?(url?`<a class="btn btn-primary btn-sm" href="${esc(url)}" target="_blank" rel="noopener" data-start="${esc(s.id)}">${ic("play")}Start class</a>`:`<button class="btn btn-primary btn-sm" data-act="startClass" data-id="${esc(s.id)}">${ic("play")}Start class</button>`):(startable&&url?`<a class="btn btn-ghost btn-sm" href="${esc(url)}" target="_blank" rel="noopener">${ic("video")}Rejoin</a>`:"")}
      <button class="btn btn-ghost btn-sm" data-act="roster" data-id="${esc(s.id)}">${ic("users")}Roster</button>${attendCell(s)}
      ${!past?`<button class="btn btn-ghost btn-sm" data-act="shareSession" data-id="${esc(s.id)}">${ic("share")}Share</button>`:""}<button class="iconbtn" data-act="editSession" data-id="${esc(s.id)}" aria-label="Edit class">${ic("edit")}</button></div></div>`;
}
function trainerHome(){

  ${newAssignCard()}

    <div class="stack" style="gap:20px">

      ${tr.length?`<section class="card panel"><div class="ph"><h2>Homework to grade</h2><button class="btn btn-ghost btn-sm" data-go="homework">All homework</button></div><div class="list">${tr.slice(0,5).map(({h,L})=>`<div class="item click" data-act="reviewHw" data-id="${esc(h.key)}" role="button" tabindex="0"><div class="grow"><div class="t">${esc(L.name)}</div><div class="s">${esc(h.title)}</div></div><span class="pill p-sun">Grade</span></div>`).join("")}</div></section>`:""}
    </div>

        <div class="stat f go" style="background:var(--sunSoft)" data-go="inbox" role="link" tabindex="0"><b class="num">${rq.length}</b><span>Reschedule requests</span></div>

/* ---------- Roster: each child's history before class ---------- */
A.roster=sid=>{const s=D.sessions[sid];if(!s)return;const ros=classRoster(s);for(const L of ros)if(L.uid)loadKp(L.uid);
  const rows=ros.map(L=>{const a=attendanceOf(L.id),last=kidHistory(L)[0],hs=hwFor(L),late=hs.filter(h=>hwState(L,h).k==="late").length,open=hs.filter(h=>!answerOf(L,h)).length,as=assessFor(L)[0],wd=wordsWithMeaning(L.uid).length;
    return `<div class="rosrow"><div class="row" style="flex-wrap:nowrap">${L.uid?avatarHTML(L.uid,44):`<span class="kav" style="width:44px;height:44px;background:var(--soft)"></span>`}<div class="grow"><b>${esc(L.name)}</b><div class="small muted">${esc(stageLabel(L.stage))}${as&&as.level?` · ${esc(as.level)}`:""} · ⭐ ${starsOf(L)} · ${wd} words</div></div><button type="button" class="btn btn-ghost btn-sm" data-mact="award" data-id="${esc(L.id)}">⭐ Award</button><button type="button" class="btn btn-ghost btn-sm" data-mact="info" data-id="${esc(L.id)}">More</button></div>
      <div class="rosfacts"><span>${ratePill(a.rate)} ${a.t} class${a.t===1?"":"es"}</span><span>Last class: ${last?`${attPill(last.st)} ${esc(fmtDay(new Date(last.date)))}`:"–"}</span><span>Homework: ${open?`${open} open`:"all done"}${late?` · <b style="color:var(--bad)">${late} late</b>`:""}</span>${!L.uid?`<span class="pill p-mute">Not signed in</span>`:""}</div>
      ${last&&(last.mine||last.note)?`<div class="small reply">Last note: ${esc(last.mine||last.note)}</div>`:""}${as&&as.note?`<div class="small muted">Assessment: ${esc(as.note)}</div>`:""}</div>`;}).join("");
  openModal(`${s.title||"Class"} · roster`,`<p class="small muted">${esc(fmtDay(new Date(s.startsAt)))}, ${esc(fmtTime(new Date(s.startsAt)))} · ${esc(D.courses[s.courseId]?.title||"")}${s.topic?` · ${esc(s.topic)}`:""}</p>${s.vocab?`<p class="small"><b>Words:</b> ${esc(parseVocab(s.vocab).map(p=>p[0]).join(", "))}</p>`:""}${rows||`<p class="muted">No learners in this class.</p>`}`,
  {wide:true,noFocus:true,actions:{award:lid=>{closeModal();A.award(lid)},info:lid=>{closeModal();A.learnerInfo(lid)}}});};

  <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">Badge (optional)</legend><div class="stickpick wide"><label><input type="radio" name="b" value="" checked><span>None</span></label>${TBADGES.map(([e,t],i)=>`<label><input type="radio" name="b" value="${i}"><span>${e} ${esc(t)}</span></label>`).join("")}</div></fieldset>

  {submitLabel:"Give reward",done:"Reward sent! 🌟",onSubmit:async f=>{const b=f.b.value;await S.db.collection(`tw/${S.uid}/x`).doc().set({kind:"award",lid,stars:+f.st.value,badge:b!==""?TBADGES[+b]:null,reason:f.r.value.trim(),at:Date.now()})}});};

/* ---------- Availability + reply hours ---------- */
A.availability=()=>{const st=settingsOf(S.uid),av=st.avail||{},rp=st.reply||{days:[1,2,3,4,5,6],from:"10:00",to:"18:00"};const order=[1,2,3,4,5,6,0];
  openModal("Availability and reply hours",`<p class="section-title" style="border:0;padding:0">When can you teach?</p><p class="small muted">Parents see this when they ask to reschedule, and the admin sees it when finding a substitute.</p>
  <div class="availgrid">${order.map(d=>{const r=av[d]||{};return `<label class="row" style="font-weight:700;flex-wrap:nowrap"><input type="checkbox" name="ad_${d}" ${r.from?"checked":""} style="width:20px;height:20px;accent-color:var(--leafMid)"> ${WDN[d]}</label><input type="time" name="af_${d}" value="${esc(r.from||"16:00")}" aria-label="${WDN[d]} from"><input type="time" name="at_${d}" value="${esc(r.to||"19:00")}" aria-label="${WDN[d]} to">`}).join("")}</div>
  <p class="section-title">Parent chat reply hours</p><p class="small muted">Parents see these hours in chat, so they know when to expect a reply.</p>
  <div class="row">${order.map(d=>`<label class="row" style="gap:4px;font-weight:700"><input type="checkbox" name="rd_${d}" ${(rp.days||[]).includes(d)?"checked":""} style="width:18px;height:18px;accent-color:var(--leafMid)">${WDN[d]}</label>`).join("")}</div>
  <div class="two"><div class="field"><label for="rp-f">From</label><input type="time" id="rp-f" name="rf" value="${esc(rp.from||"10:00")}"></div><div class="field"><label for="rp-t">To</label><input type="time" id="rp-t" name="rt" value="${esc(rp.to||"18:00")}"></div></div>`,
  {wide:true,noFocus:true,done:"Saved",onSubmit:async f=>{const avail={};for(const d of order)if(f["ad_"+d].checked){if(f["af_"+d].value>=f["at_"+d].value)throw userErr(`${WDN[d]}: the end time must be after the start time.`);avail[d]={from:f["af_"+d].value,to:f["at_"+d].value};}
    const days=order.filter(d=>f["rd_"+d].checked);await S.db.doc(`tw/${S.uid}/x/settings`).set({kind:"settings",avail,reply:{days,from:f.rf.value,to:f.rt.value},at:Date.now()});}});};

/* ---------- Approve reschedules ---------- */
A.approveReq=v=>{const [uid,id]=v.split("|");const x=(D.pp[uid]||{})[id];if(!x)return;const s=x.sid&&D.sessions[x.sid];const L=learner(x.lid);
  const d=s?new Date(s.startsAt):new Date(Date.now()+864e5);
  openModal(`Approve reschedule · ${L?firstOf(L.name):"learner"}`,`<p class="small muted">${esc(reqSummary({...x,uid}))}${x.text?` · “${esc(x.text)}”`:""}</p>${availText(S.uid)?`<p class="small">Your availability: ${esc(availText(S.uid))}</p>`:""}
   <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">How?</legend><div class="choice"><label><input type="radio" name="how" value="makeup" checked><b>Make-up class</b><span>A separate class just for ${esc(L?firstOf(L.name):"this learner")}</span></label>${s?`<label><input type="radio" name="how" value="move"><b>Move the whole class</b><span>Everyone in “${esc(s.title||"the class")}” moves</span></label>`:""}</div></fieldset>
   <div class="two"><div class="field"><label for="ap-d">New start</label><input type="datetime-local" id="ap-d" name="d" required data-label="New start" value="${esc(toLocalInput(d))}"></div><div class="field"><label for="ap-m">Minutes</label><input type="number" id="ap-m" name="m" min="10" max="240" step="5" value="${esc((s&&s.durationMin)||40)}"></div></div>
   <div class="field"><label for="ap-r">Message to the parent</label><textarea id="ap-r" name="r" rows="2" maxlength="600"></textarea></div>`,
  {wide:true,submitLabel:"Approve",done:"Approved. The parent can see the new time.",onSubmit:async f=>{const nd=new Date(f.d.value);if(isNaN(nd))throw userErr("Pick the new time.");const mins=+f.m.value||40;
    let msg;
    if(f.how.value==="move"&&s){await S.db.doc("sessions/"+x.sid).update({startsAt:nd.toISOString(),durationMin:mins});msg=`Moved “${s.title||"the class"}” to ${fmtDay(nd)}, ${fmtTime(nd)}.`;}
    else{const base=s||{courseId:L&&learnerCourses(L)[0],title:"Make-up class"};await S.db.collection("sessions").doc().set({courseId:base.courseId,trainerId:(s&&s.trainerId)||myTid()||null,title:`Make-up: ${base.title||"class"}`,startsAt:nd.toISOString(),durationMin:mins,joinUrl:(s&&s.joinUrl)||"",notes:"",topic:(s&&s.topic)||"",forLids:x.lid?[x.lid]:[],createdBy:S.uid,createdAt:Date.now()});msg=`Make-up class booked for ${fmtDay(nd)}, ${fmtTime(nd)}.`;}
    const r=f.r.value.trim();await S.db.doc(`pp/${uid}/x/${id}`).update({status:"done",reply:(r?r+" ":"")+msg,replyBy:S.uid,replyName:myName(),replyAt:Date.now()});await bumpPPI(uid,{staffAt:Date.now()});refreshThread(uid);}});};

/* ---------- Leave and substitutes ---------- */
A.newLeave=sid=>{const tid=myTid();if(!tid){toast("Only trainers can request leave.",true);return}const s=sid&&D.sessions[sid];const d0=s?ymd(new Date(s.startsAt)):ymd(new Date(Date.now()+864e5));
  openModal("Leave or substitute",`<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">What do you need?</legend><div class="choice"><label><input type="radio" name="kind" value="leave" ${s?"":"checked"}><b>Leave</b><span>Days off. Classes need a substitute</span></label><label><input type="radio" name="kind" value="sub" ${s?"checked":""}><b>Substitute only</b><span>Someone to cover a class</span></label></div></fieldset>
   <div class="two"><div class="field"><label for="lv-f">From</label><input type="date" id="lv-f" name="from" required data-label="From" value="${esc(d0)}"></div><div class="field"><label for="lv-t">To</label><input type="date" id="lv-t" name="to" required data-label="To" value="${esc(d0)}"></div></div>
   <div class="field"><label for="lv-r">Reason</label><input type="text" id="lv-r" name="reason" maxlength="160" required data-label="Reason" placeholder="e.g. Family wedding"></div>
   <p class="small muted">Your classes in these dates are listed for the admin, who assigns a substitute.</p>`,
  {submitLabel:"Send request",done:"Request sent to the admin",onSubmit:async f=>{if(f.to.value<f.from.value)throw userErr("The end date must be on or after the start date.");
    const sids=scopedSessions().filter(x=>{const k=ymd(new Date(x.startsAt));return k>=f.from.value&&k<=f.to.value;}).map(x=>x.id);

function leaveCard(){const ls=txAll("leave").filter(l=>l.to>=ymd(new Date(Date.now()-7*864e5))).sort((a,b)=>(a.status==="pending"?0:1)-(b.status==="pending"?0:1)||String(a.from).localeCompare(String(b.from)));if(!ls.length)return "";

function reportData(L,from,to){const inR=d=>{const k=ymd(new Date(d));return k>=from&&k<=to;};
  const hist=kidHistory(L).filter(h=>inR(h.date)),att=hist.filter(h=>h.st!=="absent").length;
  const words=wordsWithMeaning(L.uid).filter(w=>w.ts&&inR(w.ts));
  const hs=hwFor(L).filter(h=>{const a=answerOf(L,h);return a&&inR(a.at)});const stars=hs.map(h=>+(replyOf(L,h)||{}).stars||0).filter(Boolean);
  const as=assessFor(L).filter(a=>inR(a.at))[0]||assessFor(L)[0]||null;const lessons=doneList(L.uid).filter(x=>inR(x.ts)).length;
  return {classes:hist.length,attended:att,rate:hist.length?att/hist.length:null,words:words.length,wordList:words.slice(0,30).map(w=>w.w),hw:hs.length,hwStars:stars.length?(stars.reduce((a,b)=>a+b,0)/stars.length).toFixed(1):null,lessons,skills:as&&as.skills||null,level:as&&as.level||"",badges:badgesOf(L).filter(b=>b.ok).map(b=>b.e+" "+b.t).concat(awardsFor(L).filter(a=>a.badge&&inR(a.at)).map(a=>a.badge.join(" ")))};}

  const ls=role()==="admin"?activeLearners():teacherLearners(myTid());const pend=role()==="admin"?reportsPending():txAll("report").filter(r=>r.uid===S.uid&&needApproval()&&!r.approved);

}

function parseCSV(text){const rows=[];let row=[],cur="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c;}else if(c==='"')q=true;else if(c===","){row.push(cur);cur="";}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);if(row.some(x=>x.trim()))rows.push(row);row=[];cur="";}else cur+=c;}row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows;}
